<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생각 사슬</title>
<style>
  :root{
    --ink:#14152B; --blue:#4C6FFF; --paper:#F6F5FA; --card:#FFF;
    --line:#E6E4EF; --sub:#6E6C85; --dim:#9C9AAE;
    /* 말하는 수학과 같은 브랜드색 (지금 화면에선 안 씀 — 나중 합칠 때 대비) */
    --purple:#8B5CF6; --gold:#E9A63C; --sage:#22A06B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--paper); color:var(--ink); line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  button{font-family:inherit;}
  .wrap{max-width:560px; margin:0 auto; padding:0 18px 76px;}

  /* ── 문제 목록 ── */
  .home{padding:26px 0 8px;}
  .home h1{font-size:21px; font-weight:800; letter-spacing:-.5px; margin:0 0 6px;}
  .home .sub{font-size:13.5px; color:var(--sub); margin:0 0 24px; line-height:1.6;}
  .grp{font-size:11.5px; font-weight:800; color:var(--dim); letter-spacing:.07em; margin:26px 2px 10px;}
  .row{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 15px; margin-bottom:6px; cursor:pointer;
  }
  .row:active{background:#FAFAFD;}
  .row .no{flex:0 0 16px; font-size:12px; font-weight:800; color:var(--dim);}
  .row .ttl{flex:1; font-size:14.5px; font-weight:700; color:var(--ink); line-height:1.45;}
  .row .ttl small{display:block; font-size:12px; font-weight:500; color:var(--sub); margin-top:3px;}
  .row .go{color:#CFCDDD; font-size:16px; font-weight:700;}

  /* ── 문제 화면 ── */
  .back{
    display:inline-block; margin:18px 0 0; padding:6px 0;
    background:none; border:none; cursor:pointer;
    font-size:13px; font-weight:700; color:var(--dim);
  }
  .back:active{color:var(--sub);}
  .tag{font-size:11.5px; font-weight:800; letter-spacing:.04em; color:var(--dim); margin:12px 0 7px;}
  .prob{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 17px; font-size:16.5px; line-height:2.1; font-weight:500;
  }
  .tk{display:inline; border-radius:5px; cursor:pointer;}
  .tk:active{background:#EDECF5; box-shadow:0 0 0 3px #EDECF5;}
  .tk.found{
    background:#EAF0FF; box-shadow:0 0 0 3px #EAF0FF;
    border-bottom:2px solid var(--blue); font-weight:700;
  }

  .guide{font-size:13px; color:var(--sub); margin:14px 2px 0; line-height:1.65;}
  .guide b{color:var(--ink); font-weight:700;}
  .guide .cnt{color:var(--blue); font-weight:800; white-space:nowrap;}
  .toast{
    margin:10px 2px 0; padding:9px 12px; font-size:12.5px; color:var(--sub);
    background:#EDECF5; border-radius:10px; line-height:1.55; animation:fade .22s both;
  }

  /* ── 생각의 흐름 (타임라인) ── */
  .flow{margin-top:28px; position:relative; padding-left:22px;}
  .flow:before{content:''; position:absolute; left:3px; top:9px; bottom:10px; width:1.5px; background:#D3D0E4;}
  .flow:empty:before{display:none;}
  .layer{position:relative; margin-bottom:28px;}
  .layer:last-child{margin-bottom:0;}
  .layer .hd{position:relative; font-size:14.5px; font-weight:800; line-height:1.5;}
  .layer .hd:before{
    content:''; position:absolute; left:-22px; top:8px;
    width:8px; height:8px; border-radius:50%; background:#fff;
    box-shadow:0 0 0 1.5px #D3D0E4;
  }
  .layer.done .hd:before{background:var(--ink); box-shadow:0 0 0 1.5px var(--ink);}
  .ask{
    margin:10px 0 0; padding:13px 14px; border-radius:11px; background:#EFF3FF;
    font-size:14.5px; font-weight:600; line-height:1.6; color:#1F2C6B;
  }
  .note{margin:8px 0 0; font-size:13px; color:var(--sub); line-height:1.65;}
  .opts{margin-top:12px;}
  .item{
    display:block; width:100%; text-align:left; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:11px;
    padding:13px 14px; margin-bottom:6px; font-size:14.5px; line-height:1.5;
    cursor:pointer; animation:rise .26s ease both;
  }
  .item:active{background:#FAFAFD;}
  .item.pickd{background:var(--ink); border-color:var(--ink); color:#fff; cursor:default;}
  .item.pickd .chk{margin-right:7px; font-weight:800; opacity:.5;}
  .item.miss{background:#FAFAFC; color:var(--sub); cursor:default;}
  .item .why{display:block; margin-top:7px; font-size:12.5px; color:var(--sub); line-height:1.6;}
  .item.hidden{display:none;}

  .hintbtn, .more{
    background:none; border:none; cursor:pointer; padding:6px 0;
    text-decoration:underline; text-underline-offset:3px;
  }
  .hintbtn{margin:3px 0 0; font-size:12.5px; font-weight:700; color:var(--dim);}
  .more{margin:4px 0 0; font-size:12px; color:var(--dim);}
  .hintbtn:active, .more:active{color:var(--sub);}
  .hintbtn.gone{display:none;}
  .hinttxt{
    margin:8px 0 0; padding:2px 0 2px 12px; border-left:2px solid var(--line);
    font-size:13px; color:var(--sub); line-height:1.65; animation:fade .22s both;
  }

  /* ── 수식 표시 (말하는 수학 v75.1 mfmt와 같은 서체 — 브랜드 일관) ── */
  .mf{font-family:"STIX Two Text","Noto Serif KR",Georgia,"Times New Roman",serif;}
  .mf-v{font-style:italic;}
  .mf-frac{display:inline-flex; flex-direction:column; text-align:center; margin:0 .18em;
    font-size:.9em; line-height:1.15; vertical-align:middle; position:relative; top:-.08em;}
  .mf-num{border-bottom:1px solid currentColor; padding:0 .32em;}
  .mf-den{padding:1px .32em 0;}
  .mf-rad{white-space:nowrap;}
  .mf-rcd{border-top:1px solid currentColor; padding:1px .14em 0 .05em; margin-left:-.06em;}
  sup.mf-sup{font-size:.68em; vertical-align:.55em; line-height:0;}
  sub.mf-sub{font-size:.68em; vertical-align:-.2em; line-height:0;}

  /* ── 계산해서 직접 답 넣기 (선택지로 주면 너무 쉬움) ── */
  .solve{margin-top:12px;}
  .sq{font-size:14.5px; font-weight:600; line-height:1.6;}
  .sin{display:flex; align-items:center; gap:8px; margin-top:11px;}
  .sin input{
    flex:1; min-width:0; padding:12px 13px; font-size:16px; font-family:inherit;
    color:var(--ink); background:var(--card);
    border:1.5px solid var(--line); border-radius:11px;
  }
  .sin input:focus{outline:none; border-color:var(--blue);}
  .sin .su{font-size:14px; font-weight:700; color:var(--sub);}
  .sin button{
    flex:0 0 auto; padding:12px 18px; border:none; border-radius:11px;
    background:var(--ink); color:#fff; font-size:14px; font-weight:800; cursor:pointer;
  }
  .sfb{margin-top:9px; font-size:13px; line-height:1.6; color:var(--sub);}
  .sfb.bad{color:#B4442F;}
  .solve.done .sin{opacity:.5; pointer-events:none;}
  .solve.done .sfb{color:var(--ink); font-weight:700;}

  /* ── 위에 붙어 따라오는 문제 바 (층이 쌓여 문제가 화면 밖으로 나갈 때) ── */
  .stick{
    position:fixed; left:0; right:0; top:0; z-index:70;  /* 도형 오버레이(60)보다 위 — 문제와 도형을 같이 보게 */
    padding:11px 18px 12px; border-bottom:1px solid var(--line);
    background:rgba(246,245,250,.96); backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transform:translateY(-102%); transition:transform .18s ease;
  }
  .stick.on{transform:none;}
  .stick .inner{max-width:560px; margin:0 auto;}
  .stick .mini{font-size:13.5px; line-height:1.85; font-weight:500;}
  .stick .stfig{
    margin-top:8px; padding:5px 11px; border-radius:8px; cursor:pointer;
    background:var(--card); border:1px solid var(--line);
    font-size:11.5px; font-weight:700; color:var(--sub);
  }
  .stick .stfig:active{background:#F1F0F7;}
  /* 도형은 바 안에 넣으면 글씨가 작아 안 읽힘 → 화면 가운데 크게 띄운다 */
  #fig2{
    position:fixed; inset:0; z-index:60; padding:22px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(20,21,43,.5); animation:fade .16s both; cursor:pointer;
  }
  #fig2[hidden]{display:none;}
  #fig2 .fig{margin:0; width:100%; max-width:340px; padding:18px 14px 13px;}
  #fig2 .fig svg{max-width:270px;}
  #fig2 .close{
    margin-top:12px; font-size:12px; font-weight:700; color:var(--dim);
  }
  @media (prefers-reduced-motion:reduce){ .stick{transition:none;} }

  /* ── 도형 ── */
  .fig{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:15px 12px 11px; margin-top:10px; text-align:center;
  }
  .fig svg{max-width:225px; width:100%; height:auto; display:block; margin:0 auto;}
  .fig .cap{margin-top:9px; font-size:11.5px; color:var(--dim);}

  /* ── 도착 ── */
  .final{margin-top:32px; background:var(--ink); color:#fff; border-radius:16px; padding:21px 19px;}
  .final h3{margin:0 0 13px; font-size:11.5px; font-weight:800; letter-spacing:.09em; color:rgba(255,255,255,.45);}
  .final .fl{margin:8px 0; font-size:14.5px; line-height:1.65; color:rgba(255,255,255,.88);}
  .final .ans{
    margin-top:16px; padding-top:15px; border-top:1px solid rgba(255,255,255,.15);
    font-size:19px; font-weight:800;
  }
  .final .cmt{margin-top:13px; font-size:13px; line-height:1.75; color:rgba(255,255,255,.6);}
  .pathbox{margin-top:18px; padding-top:16px; border-top:1px solid rgba(255,255,255,.15);}
  .pathbox .pl{
    display:block; margin-bottom:10px; font-size:11.5px; font-weight:800;
    letter-spacing:.07em; color:rgba(255,255,255,.42);
  }
  .pathbox .chip{
    display:inline-block; margin:0 4px 5px 0; padding:5px 10px; border-radius:7px;
    background:rgba(255,255,255,.1); font-size:12.5px; color:rgba(255,255,255,.9);
  }
  .pathbox .step{display:inline-block; white-space:nowrap;}
  .pathbox .arw{margin-right:4px; color:rgba(255,255,255,.28);}
  .pathbox .hcount{display:block; margin-top:9px; font-size:12px; color:rgba(255,255,255,.42);}
  .retry{
    display:block; width:100%; margin-top:18px; padding:13px 0; border:none;
    border-radius:11px; background:#fff; color:var(--ink);
    font-size:14.5px; font-weight:800; cursor:pointer;
  }
  .again{
    display:block; width:100%; margin-top:22px; padding:12px 0;
    border:1px solid var(--line); border-radius:11px; background:transparent;
    color:var(--sub); font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .foot{margin-top:36px; font-size:11.5px; color:#BAB8C9; text-align:center;}

  @keyframes rise{from{opacity:0; transform:translateY(-5px);} to{opacity:1; transform:none;}}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
  @media (prefers-reduced-motion:reduce){ .item, .hinttxt, .toast{animation:none;} }
</style>
</head>
<body>
<div class="wrap">
  <div id="home"></div>
  <div id="solve" hidden>
    <button class="back" onclick="goHome()">← 문제 목록</button>
    <div class="tag" id="tag"></div>
    <div id="probwrap">
      <div class="prob" id="prob"></div>
      <div id="fig"></div>
    </div>
    <p class="guide" id="guide"></p>
    <div class="toast" id="toast" hidden></div>
    <div class="stick" id="stick">
      <div class="inner">
        <div class="mini" id="prob2"></div>
        <button class="stfig" id="stfig" onclick="toggleStickFig()" hidden>도형 보기</button>
      </div>
    </div>
    <div id="fig2" onclick="closeStickFig()" hidden></div>
    <div class="flow" id="flow"></div>
    <button class="again" onclick="restart()">처음부터 다시</button>
  </div>
  <div class="foot">생각 사슬 · 시제품</div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   문제 데이터 — 문제를 늘릴 땐 여기만 추가하면 됩니다.

   ★ 오답 만드는 요령 (이게 제일 중요합니다)
     - "말도 안 되는 것"은 넣지 마세요. 아무도 안 고릅니다.
     - 아이들이 실제로 자주 하는 실수를 넣으세요:
         · ½ 빠뜨리기        · 제곱 빠뜨리기
         · 비의 순서 뒤집기   · 길이의 비를 넓이의 비로 착각
         · 조건이 다른데 맞는 공식 쓰기
     - 그 자체로는 '맞는 말'인데 이 문제엔 안 쓰이는 것도 좋은 오답입니다.
     - 선택지 순서는 화면에서 자동으로 섞입니다. 순서 신경 쓰지 마세요.

   sentence : 문제 문장 조각. key가 있으면 눌러지는 부분
              kind 'cond'=조건(노랑) / 'goal'=구하려는 것(파랑)
   nodes    : ask(되묻는 질문) / note(중립 안내) / hint(눌러야 나오는 짧은 힌트)
              items → next 있으면 그 길이 열림(여러 개 가능) / why만 있으면 이유 설명
              end:true → 답에 도착한 노드
   ═══════════════════════════════════════════════════════════ */
const PROBLEMS = [
/* ══════════ 중2-2  Ⅴ. 도형의 성질 ══════════
   ★ 문제를 만들 때 지킬 것
   1) note/ask는 중립적으로. 답을 암시하면 고를 게 정해져 버린다.
   2) 정답 선택지에만 괄호 설명을 달지 말 것 — 그게 곧 정답 표시가 된다.
      오답도 정답과 같은 길이·같은 꼴로 쓴다.
   3) 오답은 "그 자체로 맞는 말인데 안 이어지는 것" 또는 "실제로 자주 하는 실수"만.
      말도 안 되는 것은 자리만 차지한다.
   4) 값이 우연히 맞는 오답은 넣지 않는다 (아이가 억울하고 헷갈린다).
   5) 계산은 선택지로 주지 말고 solve(직접 입력)로. 식을 고른 뒤 대입까지 골라주면 너무 쉽다.
   ═══════════════════════════════════════════ */
{
  id:'t01', unit:'1. 삼각형의 성질', pick:'이등변삼각형 · 각 추적',
  tag:'중2 · 이등변삼각형의 성질 활용',
  svg:'<svg viewBox="0 0 200 208" role="img" aria-label="AB=AC인 이등변삼각형 ABC와 변 AC 위의 점 D">'
    + '<polygon points="100,25 48,185 152,185" fill="none" stroke="var(--ink)" stroke-width="1.8"/>'
    + '<line x1="48" y1="185" x2="132" y2="119" stroke="var(--ink)" stroke-width="1.8"/>'
    + '<path d="M90.7,53.5 A30,30 0 0,0 109.3,53.5" fill="none" stroke="var(--blue)" stroke-width="1.6"/>'
    + '<text x="100" y="70" text-anchor="middle" font-size="10" fill="var(--blue)">36°</text>'
    + '<g stroke="var(--ink)" stroke-width="1.5">'
    +   '<line x1="69" y1="103" x2="79" y2="107"/><line x1="121" y1="107" x2="131" y2="103"/>'
    +   '<line x1="84.7" y1="152.3" x2="90.5" y2="160.3"/><line x1="89.5" y1="148.7" x2="95.3" y2="156.7"/>'
    +   '<line x1="97" y1="180" x2="97" y2="190"/><line x1="103" y1="180" x2="103" y2="190"/>'
    + '</g>'
    + '<g font-size="11" font-weight="700" fill="var(--ink)">'
    +   '<text x="100" y="17" text-anchor="middle">A</text><text x="36" y="196">B</text>'
    +   '<text x="156" y="196">C</text><text x="139" y="116">D</text>'
    + '</g></svg>',
  cap:'╱ 표시끼리, ╱╱ 표시끼리 길이가 같습니다',
  sentence:[
    {t:'AB=AC인 이등변삼각형', kind:'cond', key:'iso1'},
    {t:' ABC에서 '},
    {t:'∠A=36°', kind:'cond', key:'angA'},
    {t:'이다. 변 AC 위의 점 D를 '},
    {t:'BD=BC', kind:'cond', key:'iso2'},
    {t:'가 되도록 잡을 때, '},
    {t:'∠DBC', kind:'goal', key:'goal'},
    {t:'의 크기를 구하시오.'}
  ],
  nodes:{
    goal:{ label:'∠DBC를 구해야 한다',
      ask:'∠DBC는 어느 삼각형에 들어 있는 각일까?',
      hint:'D, B, C 세 점으로도 삼각형이 만들어져.',
      items:[
        {t:'△DBC를 따로 떼어 본다', next:'iso2'},
        {t:'△ABD를 따로 떼어 본다', why:'△ABD에는 아직 크기를 아는 각이 하나도 없어요.'},
        {t:'∠ABC를 반으로 나눈다', why:'BD가 ∠ABC의 이등분선이라는 조건은 없어요.'},
        {t:'△ABC의 세 각을 모두 구한다', why:'∠DBC는 △ABC의 각이 아니에요. ∠ABC의 일부죠.'}
      ]},
    iso1:{ label:'AB=AC인 이등변삼각형이다',
      note:'이등변삼각형에서 알 수 있는 것들이에요.',
      hint:'∠A를 알면 알 수 있는 각이 있지.',
      items:[
        {t:'두 밑각의 크기가 같다', next:'base'},
        {t:'세 각의 크기가 모두 같다', why:'그건 정삼각형이에요. 여기서 같은 변은 두 개뿐이죠.'},
        {t:'한 밑각의 크기는 꼭지각의 절반이다', why:'그런 관계는 없어요. 세 각의 합으로 구해야 해요.'},
        {t:'꼭지각의 이등분선이 밑변을 수직이등분한다', why:'맞는 성질이지만 이 문제에는 그 이등분선이 없어요.'},
        {t:'외심과 내심이 한 직선 위에 있다', why:'맞는 성질이지만 각의 크기와는 이어지지 않아요.'}
      ]},
    angA:{ label:'∠A = 36°이다',
      note:'이 값을 어디에 쓸 수 있을까요?',
      hint:'삼각형 세 각의 합은 180°.',
      items:[
        {t:'세 각의 합 180°를 이용한다', next:'base'},
        {t:'삼각형의 외각의 성질을 이용한다', why:'아직 외각을 쓸 자리가 없어요. 세 각의 합이 더 빠릅니다.'},
        {t:'∠A가 가장 작으므로 BC가 가장 짧다', why:'맞는 성질이지만 각의 크기를 구하는 데는 안 쓰여요.'},
        {t:'36°를 3으로 나눠 각 각에 배분한다', why:'세 각이 모두 같은 건 정삼각형일 때예요.'}
      ]},
    base:{ label:'세 각의 합으로 밑각을 구한다',
      solve:{ q:'∠ABC의 크기는 몇 도일까요? 계산해서 넣어보세요.', unit:'°', accept:['72'],

    while(k>0){
      if(t[k-1]!=='/' && t[k+1]!=='/'){
        var L=leftOperand(t,k), R=L?rightOperand(t,k+1):null;
        if(L && R){
          return expr(t.slice(0,L[0]))
            + '<span class="mf-frac"><span class="mf-num">'+expr(strip(L[1]))+'</span>'
            + '<span class="mf-den">'+expr(strip(R))+'</span></span>'
            + expr(t.slice(k+1+R.length));
        }
      }
      k=t.indexOf('/',k+1);
    }
    return inner(t);
  }

  function mfmt(s){
    var src=String(s==null?'':s), out='', last=0, m;
    RUN.lastIndex=0;
    while((m=RUN.exec(src))){
      var raw=m[0], start=m.index;
      var trimmed=raw.replace(/\s+$/,'');
      if(trimmed.length<2 || !OPS.test(trimmed)){ continue; }
      out += esc(src.slice(last,start)) + '<span class="mf">'+expr(trimmed)+'</span>';
      last = start + trimmed.length;
      RUN.lastIndex = last;
    }
    return out + esc(src.slice(last));
  }
  window.mfmt = mfmt;
})();


/* ─── 상태 ─── */
let cur = null, openedKeys = [], path = [], hintUsed = 0, solveTries = 0;
function P(){ return PROBLEMS[cur]; }

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* 문제 목록 화면 — 단원별로 묶어서 세로 목록 (문제가 늘어도 안 깨짐) */
function renderHome(){
  const groups = [];
  PROBLEMS.forEach((p,i)=>{
    const name = p.unit || '기타';
    let g = groups.find(x=>x.name===name);
    if(!g){ g = {name, rows:[]}; groups.push(g); }
    g.rows.push({p,i});
  });
  let h = '<div class="home"><h1>생각 사슬</h1>'
        + '<p class="sub">문제에서 단서를 찾아 누르면 관련 개념이 펼쳐집니다. 답까지 이어가 보세요.</p>';
  groups.forEach(g=>{
    h += '<div class="grp">' + g.name + '</div>';
    g.rows.forEach((r,n)=>{
      h += '<button class="row" onclick="openProblem(' + r.i + ')">'
         +   '<span class="no">' + (n+1) + '</span>'
         +   '<span class="ttl">' + r.p.pick + '<small>' + r.p.tag + '</small></span>'
         +   '<span class="go">›</span>'
         + '</button>';
    });
  });
  document.getElementById('home').innerHTML = h + '</div>';
}

function openProblem(i){
  cur = i;
  document.getElementById('home').hidden = true;
  document.getElementById('solve').hidden = false;
  restart();
}
function goHome(){
  cur = null;
  document.getElementById('flow').innerHTML = '';
  document.getElementById('solve').hidden = true;
  document.getElementById('home').hidden = false;
  document.getElementById('stick').classList.remove('on');
  window.scrollTo({top:0});
}

/* 도형 (SVG를 코드로 직접 그림 — 교재 이미지 사용 금지) */
function renderFig(){
  const p = P();
  const html = p.svg
    ? '<div class="fig">' + p.svg + (p.cap ? '<div class="cap">' + p.cap + '</div>' : '') + '</div>'
    : '';
  document.getElementById('fig').innerHTML  = html;
  document.getElementById('fig2').innerHTML = p.svg
    ? html.replace('</div>', '<div class="close">아무 곳이나 눌러 닫기</div></div>')
    : '';
  document.getElementById('stfig').hidden = !p.svg;
  closeStickFig();
}

/* 문제 문장 — 조건에 미리 색을 칠하지 않는다.
   학생이 스스로 "무엇이 단서인가"를 찾는 것이 이 앱의 훈련 대상이기 때문.
   맞게 누르면 그때 색이 켜지고(찾았다는 표시), 아니면 짧게 알려준다. */
function paintSentence(box){
  box.innerHTML = '';
  P().sentence.forEach((s,i)=>{
    const sp = document.createElement('span');
    sp.className = 'tk' + (s.key && openedKeys.includes(s.key) ? ' found' : '');
    sp.innerHTML = mfmt(s.t);
    sp.onclick = ()=> tapPiece(i);
    box.appendChild(sp);
  });
}

function renderProblem(){
  document.getElementById('tag').textContent = P().tag;
  paintSentence(document.getElementById('prob'));   // 문제 카드
  paintSentence(document.getElementById('prob2'));  // 위에 붙는 바 (여기서도 누를 수 있음)
  renderGuide();
}

/* 층이 쌓여 문제 카드가 화면 위로 사라지면 바를 내려준다 */
function onScroll(){
  const st = document.getElementById('stick');
  if(cur === null){ st.classList.remove('on'); return; }
  const show = document.getElementById('probwrap').getBoundingClientRect().bottom < 4;
  st.classList.toggle('on', show);
  if(!show) closeStickFig();
}
function toggleStickFig(){
  document.getElementById('fig2').hidden = false;
}
function closeStickFig(){
  document.getElementById('fig2').hidden = true;
}
window.addEventListener('scroll', onScroll, {passive:true});

function renderGuide(){
  const keys = [...new Set(P().sentence.filter(s=>s.key).map(s=>s.key))];
  const left = keys.filter(k=>!openedKeys.includes(k)).length;
  document.getElementById('guide').innerHTML = left
    ? '문제에서 <b>단서가 될 만한 부분</b>을 눌러보세요. <span class="cnt">남은 단서 ' + left + '개</span>'
    : '단서를 다 찾았어요. 아래에서 생각을 이어가 보세요.';
}

function tapPiece(i){
  const s = P().sentence[i];
  if(s.key){ hideToast(); openNode(s.key, true); return; }
  showToast(s.no || '여기선 새로 알 수 있는 게 없어요. 다른 곳을 눌러볼까요?');
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.hidden = true; }, 3400);
}
function hideToast(){
  document.getElementById('toast').hidden = true;
  clearTimeout(toastTimer);
}

function openNode(key, fromSentence){
  const node = P().nodes[key];
  if(!node) return;

  const exist = document.querySelector('.layer[data-key="'+key+'"]');
  if(exist){ exist.scrollIntoView({behavior:'smooth', block:'center'}); return; }

  if(fromSentence && !openedKeys.includes(key)){ openedKeys.push(key); renderProblem(); }
  if(node.end){ showEnd(node); return; }
  path.push(node.label);

  const layer = document.createElement('div');
  layer.className = 'layer';
  layer.dataset.key = key;
  let html = '<div class="hd">' + mfmt(node.label) + '</div>';
  if(node.ask)  html += '<div class="ask">'  + mfmt(node.ask)  + '</div>';
  if(node.note) html += '<div class="note">' + mfmt(node.note) + '</div>';
  html += node.solve ? solveHTML(node) : '<div class="opts"></div>';
  layer.innerHTML = html;
  document.getElementById('flow').appendChild(layer);

  if(node.solve){ bindSolve(key, layer); }

  // 선택지 순서를 매번 섞습니다 (정답이 늘 위에 오지 않도록)
  const br = layer.querySelector('.opts');
  const order = shuffle((node.items||[]).map((_,i)=>i));
  order.forEach((origIdx, pos)=>{
    const it = node.items[origIdx];
    const b = document.createElement('button');
    b.className = 'item';
    b.style.animationDelay = (pos*0.05)+'s';
    b.innerHTML = mfmt(it.t);
    b.onclick = ()=> choose(key, origIdx, b, layer);
    br.appendChild(b);
  });

  if(node.hint){
    const hb = document.createElement('button');
    hb.className = 'hintbtn';
    hb.textContent = '힌트 보기';
    hb.onclick = ()=>{
      hintUsed++;
      const tx = document.createElement('div');
      tx.className = 'hinttxt';
      tx.innerHTML = mfmt(node.hint);
      hb.classList.add('gone');
      layer.insertBefore(tx, hb.nextSibling);
    };
    layer.appendChild(hb);
  }

  setTimeout(()=> layer.scrollIntoView({behavior:'smooth', block:'center'}), 120);
}

/* ── 계산해서 답 넣기 ──────────────────────────────────────
   식을 고른 다음 "숫자를 어디에 넣나"를 또 선택지로 주면 너무 쉽다.
   고른 식에 맞춰 학생이 직접 계산해서 넣게 한다. */
function solveHTML(node){
  const sv = node.solve;
  return '<div class="solve">'
    + '<div class="sq">' + mfmt(sv.q) + '</div>'
    + '<div class="sin">'
    +   '<input type="text" inputmode="decimal" autocomplete="off" placeholder="' + (sv.ph || '숫자만') + '">'
    +   (sv.unit ? '<span class="su">' + sv.unit + '</span>' : '')
    +   '<button type="button">확인</button>'
    + '</div>'
    + '<div class="sfb"></div>'
    + '</div>';
}

function numOnly(v){ return String(v).replace(/[^0-9./]/g, ''); }

function bindSolve(key, layer){
  const node = P().nodes[key], sv = node.solve;
  const box = layer.querySelector('.solve');
  const inp = box.querySelector('input');
  const btn = box.querySelector('button');
  const fb  = box.querySelector('.sfb');
  const ok  = sv.accept.map(numOnly);

  function submit(){
    if(box.classList.contains('done')) return;
    const v = numOnly(inp.value);
    if(!v){ fb.className = 'sfb bad'; fb.textContent = '숫자를 넣어보세요.'; return; }
    if(ok.includes(v)){
      box.classList.add('done');
      layer.classList.add('done');
      fb.className = 'sfb';
      fb.innerHTML = '✓ ' + mfmt(sv.say || ('맞았어요. ' + inp.value + (sv.unit||'')));
      const hb = layer.querySelector('.hintbtn'); if(hb) hb.classList.add('gone');
      if(node.next) setTimeout(()=> openNode(node.next, false), 420);
    }else{
      solveTries++;
      fb.className = 'sfb bad';
      fb.innerHTML = mfmt(sv.wrong || '다시 계산해볼까요?');
      inp.select();
    }
  }
  btn.onclick = submit;
  inp.onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); submit(); } };
}

function choose(key, idx, btn, layer){
  const it = P().nodes[key].items[idx];
  if(btn.classList.contains('pickd') || btn.classList.contains('miss')) return;

  if(it.next){
    btn.classList.add('pickd');
    btn.innerHTML = '<span class="chk">✓</span>' + mfmt(it.t);
    layer.classList.add('done');
    const others = [...layer.querySelectorAll('.item')].filter(o=>o!==btn);
    others.forEach(o=> o.classList.add('hidden'));
    const hb = layer.querySelector('.hintbtn');
    if(hb) hb.classList.add('gone');
    if(others.length && !layer.querySelector('.more')){
      const m = document.createElement('button');
      m.className = 'more';
      m.textContent = '다른 선택지 ' + others.length + '개 보기';
      let open = false;
      m.onclick = ()=>{
        open = !open;
        others.forEach(o=> o.classList.toggle('hidden', !open));
        m.textContent = open ? '접기' : ('다른 선택지 ' + others.length + '개 보기');
      };
      layer.appendChild(m);
    }
    setTimeout(()=> openNode(it.next, false), 380);
  }else{
    btn.classList.add('miss');
    btn.innerHTML = mfmt(it.t) + '<span class="why">' + mfmt(it.why) + '</span>';
  }
}

function showEnd(node){
  const div = document.createElement('div');
  div.className = 'final';
  let hmsg = hintUsed === 0 ? '힌트 없이 끝까지 갔어요.' : ('힌트 ' + hintUsed + '번 사용');
  if(solveTries) hmsg += ' · 계산 고쳐 넣기 ' + solveTries + '번';
  div.innerHTML = '<h3>식을 세워 답 구하기</h3>'
    + node.lines.map(l=>'<div class="fl">' + mfmt(l) + '</div>').join('')
    + '<div class="ans">' + mfmt(node.ans) + '</div>'
    + '<div class="cmt">' + mfmt(node.cmt) + '</div>'
    + '<div class="pathbox"><span class="pl">네가 따라간 생각의 길</span>'
    +   path.map((p,i)=> '<span class="step">' + (i ? '<span class="arw">→</span>' : '') + '<span class="chip">' + mfmt(p) + '</span></span>').join('')
    +   '<span class="hcount">' + hmsg + '</span>'
    + '</div>'
    + '<button class="retry" onclick="restart()">다른 길로도 풀어보기</button>';
  document.getElementById('flow').appendChild(div);
  setTimeout(()=> div.scrollIntoView({behavior:'smooth', block:'center'}), 120);
}

function restart(){
  if(cur === null) return;
  openedKeys = []; path = []; hintUsed = 0; solveTries = 0;
  document.getElementById('flow').innerHTML = '';
  renderProblem(); renderFig();
  document.getElementById('stick').classList.remove('on');
  window.scrollTo({top:0, behavior:'smooth'});
}

renderHome();
</script>
