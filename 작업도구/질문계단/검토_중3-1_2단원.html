<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>질문 계단 검토</title>
<style>
  :root{--bg:#f6f5f1;--card:#fff;--ink:#23221f;--sub:#6b6a64;--line:#e4e2da;--blue:#185FA5;--orange:#D85A30;--green:#2f9e76;--purple:#534AB7;--soft:#eef3f9}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Malgun Gothic",sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:23px;margin:0 0 4px}
  .lead{color:var(--sub);margin:0 0 16px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 16px}
  .box h2{font-size:16px;margin:0 0 8px}
  .box ul{margin:0;padding-left:20px}
  .mid{font-size:18px;font-weight:700;margin:26px 0 10px;color:var(--blue)}
  details.lad{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden}
  details.lad summary{padding:12px 18px;cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  details.lad summary::-webkit-details-marker{display:none}
  details.lad summary::before{content:'▸';color:var(--sub)}
  details.lad[open] summary::before{content:'▾'}
  .cnt{font-size:12px;font-weight:600;color:var(--sub)}
  .warn{font-size:11px;font-weight:700;color:#fff;background:var(--orange);border-radius:5px;padding:0 6px}
  .step{display:grid;grid-template-columns:34px 1fr;gap:0 10px;padding:14px 18px;border-top:1px solid var(--line)}
  .n{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--blue);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
  .kind{font-size:11px;font-weight:700;color:var(--purple);background:#efedfb;border-radius:5px;padding:0 6px;margin-right:6px;vertical-align:1px}
  .q{font-weight:600}
  .fig{font-size:12px;font-weight:700;color:var(--orange);margin-left:6px;white-space:nowrap}
  .lbl{font-size:12px;font-weight:700;margin:8px 0 2px}
  .ideas{margin:0;padding:0;list-style:none}
  .ideas li{font-size:14px;display:grid;grid-template-columns:22px 1fr;gap:4px;margin:3px 0}
  .ideas li i{font-style:normal;font-weight:700;color:var(--green)}
  .ideas .hq{display:block;color:var(--orange);font-size:13px}
  .teach{font-size:14px;background:#f7f9fc;border-radius:8px;padding:6px 9px}
  .again{font-size:14px;color:var(--purple)}
  .src{font-size:12px;color:var(--sub);margin-top:4px}
  .ai{margin-top:10px;border:1px dashed #cfd8e3;border-radius:10px;padding:8px 10px;background:#fbfcfe}
  .ai .t{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:4px}
  .case{font-size:13.5px;padding:5px 0;border-top:1px solid #edf0f4}
  .case:first-of-type{border-top:none}
  .who{font-weight:700;margin-right:4px}
  .v{font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;margin-left:4px}
  .v.pass{background:#e3f4ec;color:var(--green)} .v.partial{background:#fff3dc;color:#9a6a00} .v.applied{background:#efedfb;color:var(--purple)} .v.none{background:#fdeee8;color:var(--orange)}
  .diag{margin-top:8px;font-size:13.5px;background:#fdf8f2;border-radius:8px;padding:6px 9px}
  .diag b{color:#8a5a1a}
  .sumtag{font-size:11px;font-weight:700;color:#fff;background:var(--purple);border-radius:5px;padding:0 6px}
  .say{display:block;margin-top:2px;color:#2b3a4a}
  .flip{display:block;font-size:12px;font-weight:700;color:var(--orange)}
</style>
<div class="wrap">
  <h1 id="title">질문 계단 검토</h1>
  <p class="lead" id="lead"></p>
  <div class="box" id="summary"></div>
  <div id="list"></div>
</div>
<script>
window.REVIEW = {"made":"2026-09-15T11:58:28.671Z","ladders":[{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"28. (다항식)×(다항식)은 어떻게 계산할까?","steps":[{"kind":"방법","q":"(a+b)(c+d)처럼 다항식끼리 곱할 때 어떤 방법으로 계산하고, 마지막에 무엇을 해?","ideas":[["분배법칙으로 한 식의 각 항을 다른 식의 각 항에 빠짐없이 곱한다","(a+b)(c+d)에서 a는 c와 d 중 어디에 곱해야 할까?"],["곱한 뒤 동류항끼리 모아 간단히 정리한다","전개한 결과에 문자와 차수가 같은 항이 있으면 어떻게 할까?"]],"teach":"(a+b)(c+d)=ac+ad+bc+bd. 앞 식의 모든 항을 뒤 식의 모든 항에 한 번씩 곱하고, 동류항이 있으면 모아서 정리해. 가로 a+b, 세로 c+d인 직사각형을 네 칸으로 나눈 넓이의 합과 같아.","again":"(2a+3)(a−4)를 전개하는 방법을 말로 설명해 봐.","fig":false,"src":"80쪽","wrong":"앞끼리 곱하고 뒤끼리 곱해서 ac 더하기 bd예요","miscon":"(a+b)(c+d)=ac+bd처럼 같은 자리끼리만 곱함","record":"다항식의 곱에서 모든 항끼리 빠짐없이 곱하는 분배법칙을 적용하지 못함","half":"분배법칙으로 한 항씩 빠짐없이 다 곱해요"},{"kind":"함정","q":"(a+b)(x+y+z)처럼 한쪽 식의 항이 3개일 때 빠뜨리지 않고 전개하려면 어떻게 해야 해? 동류항 정리 전에 항은 몇 개가 나올까?","ideas":[["앞 식의 항 하나씩을 차례로 뒤 식의 모든 항에 곱한다","a를 곱할 때 x, y, z 중 몇 개에 곱해야 할까?"],["항이 2개와 3개이므로 정리 전에 2×3, 즉 6개의 항이 나온다","a가 만드는 항과 b가 만드는 항을 합치면 몇 개일까?"]],"teach":"a를 x, y, z에 모두 곱하고, 이어서 b를 x, y, z에 모두 곱해: ax+ay+az+bx+by+bz. 항이 2개와 3개면 곱한 항은 2×3=6개라서, 개수를 세어 보면 빠뜨렸는지 확인할 수 있어.","again":"(x+y)(x−y+2)를 전개하면 정리 전에 항이 몇 개 나오는지와 그 이유를 말해 봐.","fig":false,"src":"81쪽","wrong":"a는 x에만, b는 y에만 곱해요","miscon":"항의 개수가 다르면 일부 항을 빠뜨림","record":"항이 3개 이상인 다항식의 곱을 빠뜨리지 않고 전개하는 방법을 모름","half":"앞에서부터 차례로 하나씩 뒤의 항에 다 곱해요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"29. (a+b)²과 (a-b)²은 어떻게 전개할까?","steps":[{"kind":"성질","q":"(a+b)²을 전개하면 어떤 식이 되고, 가운데 항이 2ab가 되는 이유는 뭘까?","ideas":[["(a+b)²=a²+2ab+b²이다","(a+b)(a+b)를 전개하면 어떤 항들이 나올까?"],["전개할 때 ab와 ba가 한 번씩 나와서 ab가 두 번, 곧 2ab가 된다","(a+b)(a+b)에서 a×b와 b×a는 각각 몇 번 나오지?"]],"teach":"(a+b)²=(a+b)(a+b)=a²+ab+ba+b²=a²+2ab+b². 한 변이 a+b인 정사각형을 나누면 a², b² 정사각형 하나씩과 ab 직사각형 두 개가 생겨.","again":"(x+3)²을 전개할 때 가운데 항이 6x가 되는 이유를 말해 봐.","fig":true,"src":"81~82쪽","wrong":"(a+b)²은 a²+b²이에요","miscon":"(a+b)²=a²+b²으로 가운데 항을 빠뜨림","record":"합의 제곱에서 2ab 항이 생기는 이유를 설명하지 못함","half":"a 제곱 더하기 2ab 더하기 b 제곱이에요"},{"kind":"함정","q":"(a−b)²을 전개하면 어떻게 되고, (b−a)²은 (a−b)²과 같을까 다를까?","ideas":[["(a−b)²=a²−2ab+b²으로 가운데 항의 부호만 −이다","(a−b)(a−b)에서 a×(−b)의 부호는 어떻게 될까?"],["b−a는 a−b의 부호를 바꾼 수라서 제곱하면 (a−b)²과 같다","−3과 3을 각각 제곱하면 결과가 같을까?"]],"teach":"(a−b)²=a²−ab−ba+b²=a²−2ab+b², 끝 항 b²은 +야. b−a=−(a−b)이고 부호가 반대인 수를 제곱하면 같아서 (b−a)²=(a−b)². (x−3y)²처럼 계수가 있으면 (3y)²=9y²까지 제곱해야 해.","again":"(−x+2)²과 (x−2)²이 같은 이유를 말해 봐.","fig":false,"src":"82쪽","wrong":"(a−b)²은 a²−b²이에요","miscon":"(a−b)²=a²−b²이나 a²−2ab−b²으로 부호를 틀림","record":"차의 제곱에서 각 항의 부호와 (a−b)²=(b−a)²인 이유를 설명하지 못함","half":"a 제곱 빼기 2ab 더하기 b 제곱이에요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"30. (a+b)(a-b)는 어떻게 전개할까?","steps":[{"kind":"성질","q":"(a+b)(a−b)를 전개하면 왜 항이 두 개만 남을까?","ideas":[["전개하면 −ab와 +ab가 서로 없어진다","(a+b)(a−b)를 하나씩 곱했을 때 ab가 들어간 항들은 부호가 어떻게 돼?"],["그래서 a²−b², 곧 (제곱)−(제곱)만 남는다","없어지고 남는 두 항은 무엇과 무엇이야?"]],"teach":"(a+b)(a−b)=a²−ab+ba−b²=a²−b². 가운데 −ab와 +ab가 지워져서 합과 차의 곱은 \"제곱 빼기 제곱\"이 돼.","again":"(x+5)(x−5)를 전개하면 x항이 없는 이유를 말해 봐.","fig":true,"src":"82쪽","wrong":"a²+b²이 남아요","miscon":"합과 차의 곱을 a²+b²이나 a²−2ab+b²으로 봄","record":"합과 차의 곱에서 가운데 항이 사라지는 이유를 설명하지 못함","half":"가운데 ab 항끼리 없어져요"},{"kind":"함정","q":"(−a+b)(a+b)를 합과 차의 곱 공식으로 전개하려면 어떻게 봐야 할까?","ideas":[["교환법칙으로 순서를 바꿔 (b−a)(b+a)로 본다","−a+b를 순서를 바꿔 쓰면 어떤 꼴이 될까?"],["두 식에서 부호가 같은 b의 제곱에서 부호가 다른 a의 제곱을 빼 b²−a²이 된다","두 괄호에서 부호가 같은 문자와 부호가 다른 문자는 각각 무엇이지?"]],"teach":"(−a+b)(a+b)=(b−a)(b+a)=b²−a². 두 식에서 부호가 같은 항의 제곱이 앞, 부호가 다른 항의 제곱을 빼. 순서만 보고 a²−b²이라고 쓰면 부호가 반대가 돼.","again":"(−x−3)(x−3)을 공식으로 전개할 때 어떤 항의 제곱이 앞에 오는지 말해 봐.","fig":false,"src":"83쪽 예제 3","wrong":"앞에 있는 a부터 제곱하니까 a²−b²이에요","miscon":"항의 순서만 보고 a²−b²으로 씀","record":"부호가 같은 항과 다른 항을 구분해 합과 차의 곱을 적용하지 못함","half":"순서를 바꿔서 b−a 곱하기 b+a로 봐요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"31. (x+a)(x+b)는 어떻게 전개할까?","steps":[{"kind":"성질","q":"(x+a)(x+b)를 전개하면 x의 계수와 상수항은 각각 무엇이 될까? 이유도 말해 봐.","ideas":[["x의 계수는 두 상수의 합 a+b이다","전개했을 때 x가 들어간 항 bx와 ax를 모으면 계수가 뭐가 되지?"],["상수항은 두 상수의 곱 ab이다","x가 없는 항은 무엇과 무엇을 곱해서 생겨?"]],"teach":"(x+a)(x+b)=x²+bx+ax+ab=x²+(a+b)x+ab. 처음 식의 두 상수를 더하면 x의 계수, 곱하면 상수항이야.","again":"(x+3)(x+4)에서 x의 계수와 상수항을 구하는 방법을 말해 봐.","fig":false,"src":"83쪽","wrong":"x²+abx+(a+b)예요","miscon":"계수와 상수항 자리에 곱과 합을 바꿔 씀","record":"(x+a)(x+b)에서 합과 곱이 각각 어디에 오는지 설명하지 못함","half":"x의 계수는 a 더하기 b예요"},{"kind":"함정","q":"(x−2)(x+5)처럼 부호가 다른 상수가 있을 때 x의 계수와 상수항을 구하면서 조심할 점은?","ideas":[["상수를 부호까지 포함해 −2와 +5로 본다","(x−2)에서 더해지는 수는 2일까, −2일까?"],["합과 곱을 부호까지 계산해서 합은 양수, 곱은 음수가 될 수 있다","−2와 5를 곱하면 부호가 어떻게 돼?"]],"teach":"(x−2)(x+5)는 (x+(−2))(x+5)야. x의 계수는 (−2)+5, 상수항은 (−2)×5라서 x²+3x−10. 부호를 떼고 2와 5로 계산하면 틀려.","again":"(x−4)(x−3)의 상수항이 양수가 되는 이유를 말해 봐.","fig":false,"src":"83쪽 예제 4","wrong":"2와 5를 더해서 7x이고 곱해서 10이에요","miscon":"상수의 부호를 빼고 합·곱을 계산함","record":"상수의 부호를 포함해 합과 곱을 계산하지 못함","half":"마이너스 2로 봐야 해요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"32. (ax+b)(cx+d)는 어떻게 전개할까?","steps":[{"kind":"성질","q":"(ax+b)(cx+d)를 전개하면 x²의 계수, x의 계수, 상수항은 각각 어떻게 구해?","ideas":[["x²의 계수는 x의 계수끼리 곱한 ac이다","ax와 cx를 곱하면 무엇이 나와?"],["x의 계수는 ad와 bc를 더한 것이다","x가 한 번만 들어가는 항은 어떤 두 곱에서 생길까?"],["상수항은 상수끼리 곱한 bd이다","x가 없는 항은 무엇끼리 곱해서 생기지?"]],"teach":"(ax+b)(cx+d)=acx²+adx+bcx+bd=acx²+(ad+bc)x+bd. x의 계수는 \"바깥끼리 곱 ad\"와 \"안쪽끼리 곱 bc\"의 합이야.","again":"(2x+1)(3x+5)에서 x의 계수를 구하는 방법을 말해 봐.","fig":true,"src":"84쪽","wrong":"x의 계수는 a 더하기 c예요","miscon":"x의 계수를 ad+bc가 아니라 계수끼리 더한 값으로 봄","record":"(ax+b)(cx+d)에서 x의 계수가 ad+bc가 되는 이유를 설명하지 못함","half":"x 제곱의 계수는 a 곱하기 c예요"},{"kind":"연결","q":"(x+a)(x+b) 공식은 (ax+b)(cx+d) 공식과 어떤 관계일까?","ideas":[["x의 계수가 모두 1인 특별한 경우이다","(ax+b)(cx+d)에서 x의 계수 a, c에 1을 넣으면?"],["그러면 x의 계수가 두 상수의 합, 상수항이 두 상수의 곱이 되어 같은 식이 된다","x의 계수가 둘 다 1이면 ad+bc는 무엇이 될까?"]],"teach":"(ax+b)(cx+d)에서 a=c=1이면 x²+(d+b)x+bd, 곧 (x+b)(x+d)의 공식과 같아. 곱셈 공식은 따로 외울 게 아니라 하나에서 나온 거야.","again":"(x+2)(x+7)을 (ax+b)(cx+d) 공식으로 전개해도 되는 이유를 말해 봐.","fig":false,"src":"84쪽","wrong":"두 공식은 서로 관계가 없어요","miscon":"곱셈 공식을 따로따로 외워 서로 연결하지 못함","record":"곱셈 공식들 사이의 관계(특별한 경우)를 설명하지 못함","half":"x의 계수가 1인 경우예요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"33. (a-b+2)(a-b+1)은 어떻게 전개할까?","steps":[{"kind":"방법","q":"(a−b+2)(a−b+1)처럼 항이 3개인 두 식의 곱을 곱셈 공식으로 전개하려면 어떻게 해?","ideas":[["두 식에 공통으로 있는 a−b를 A처럼 한 문자로 치환한다","두 괄호에 똑같이 들어 있는 부분은 무엇이지?"],["(A+2)(A+1)을 곱셈 공식으로 전개한 뒤 A에 a−b를 다시 대입한다","A로 바꿔 전개했으면 마지막에 무엇을 해야 할까?"]],"teach":"a−b=A로 두면 (A+2)(A+1)=A²+3A+2. 여기에 A=a−b를 다시 넣어 (a−b)²+3(a−b)+2를 전개하면 돼. 공통부분이 보이면 치환해서 공식을 쓸 수 있어.","again":"(x+y+3)(x+y−5)를 전개하는 방법을 말해 봐.","fig":false,"src":"85쪽","wrong":"항이 3개라서 곱셈 공식은 못 써요","miscon":"항이 많으면 곱셈 공식을 쓸 수 없다고 생각하거나 치환 후 대입을 빠뜨림","record":"공통부분을 치환해 곱셈 공식을 쓰는 방법을 모름","half":"a−b를 A로 바꿔요"},{"kind":"전략","q":"(x−3)(x−1)(x+1)(x+3)을 편하게 전개하려면 네 식을 어떻게 짝지어야 할까?","ideas":[["합과 차의 곱이 되도록 (x+3)(x−3)과 (x+1)(x−1)로 짝짓는다","합과 차의 곱 공식을 쓰려면 어떤 두 식을 묶어야 할까?"],["그러면 (x²−9)(x²−1)이 되어 x²이 공통으로 나와 전개가 쉬워진다","두 묶음을 각각 전개하면 공통으로 들어 있는 식은 무엇이지?"]],"teach":"앞에서부터 차례로 곱하면 복잡해. (x+3)(x−3)=x²−9, (x+1)(x−1)=x²−1로 짝지으면 (x²−9)(x²−1)=x⁴−10x²+9로 쉽게 전개돼.","again":"(x+1)(x+2)(x−1)(x−2)를 어떻게 짝지으면 좋은지 말해 봐.","fig":false,"src":"85쪽","wrong":"앞에서부터 순서대로 두 개씩 곱해요","miscon":"앞에서부터 순서대로만 곱해 계산이 복잡해짐","record":"곱셈 공식을 쓸 수 있도록 식을 짝짓는 방법을 모름","half":"합과 차의 곱이 되게 x+3이랑 x−3을 짝지어요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"34. 곱셈 공식으로 복잡한 수의 곱을 계산한다?","steps":[{"kind":"방법","q":"1003²이나 48×52 같은 수의 계산을 곱셈 공식으로 빠르게 하려면 어떻게 해?","ideas":[["계산하기 쉬운 수(1000, 50 같은)와의 합이나 차로 바꾼다","1003을 1000과 어떤 수의 합으로 나타낼 수 있을까?"],["(a+b)²이나 (a+b)(a−b) 같은 곱셈 공식을 적용한다","48×52를 (50−2)(50+2)로 보면 어떤 공식을 쓸 수 있지?"]],"teach":"1003²=(1000+3)²=1000²+2×1000×3+3², 48×52=(50−2)(50+2)=50²−2². 수를 딱 떨어지는 수와의 합·차로 바꾸면 공식으로 쉽게 계산돼.","again":"99²을 곱셈 공식으로 계산하는 방법을 말해 봐.","fig":false,"src":"86쪽","wrong":"하나씩 그냥 곱하는 게 제일 빨라요","miscon":"수를 식처럼 볼 생각을 못함","record":"수를 합·차로 바꿔 곱셈 공식을 쓰는 방법을 모름","half":"1003을 1000 더하기 3으로 바꿔요"},{"kind":"적용","q":"(√5+√2)(√5−√2)처럼 근호가 있는 식에도 곱셈 공식을 쓸 수 있는 이유와 방법을 말해 봐.","ideas":[["제곱근을 문자처럼 보면 (a+b)(a−b) 꼴이다","√5를 a, √2를 b라고 보면 어떤 꼴이지?"],["그래서 (√5)²−(√2)²으로 계산하면 근호가 없어진다","(√5)²과 (√2)²은 각각 무엇이야?"]],"teach":"√5=a, √2=b로 보면 (a+b)(a−b)=a²−b²이라 (√5)²−(√2)²=5−2=3. 근호가 있어도 식의 모양이 같으면 곱셈 공식을 그대로 쓸 수 있어.","again":"(√10−4)(√10+2)에 쓸 수 있는 곱셈 공식을 말해 봐.","fig":false,"src":"86쪽","wrong":"근호가 있으면 곱셈 공식은 못 쓰고 하나씩 곱해야 해요","miscon":"근호가 있으면 곱셈 공식을 쓸 수 없다고 생각함","record":"제곱근을 문자로 보고 곱셈 공식을 적용하지 못함","half":"루트 5를 a, 루트 2를 b로 봐요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"35. (a+b)(a-b)의 전개식을 이용하여 분모를 유리화한다?","steps":[{"kind":"방법","q":"1/(√3+1)처럼 분모가 √a+b 꼴이면 무엇을 곱해서 유리화하고, 왜 그걸 곱해?","ideas":[["분모와 가운데 부호가 반대인 √3−1을 분모와 분자에 곱한다","√3+1과 곱해서 근호가 없어지려면 어떤 식을 곱하면 될까?"],["(a+b)(a−b)=a²−b²이 되어 분모의 근호가 없어진다","(√3+1)(√3−1)에는 어떤 곱셈 공식을 쓸 수 있지?"]],"teach":"(√3+1)(√3−1)=(√3)²−1²=2 라서 분모의 근호가 사라져. 그래서 1/(√3+1)=(√3−1)/2. 분모가 √a+√b 면 √a−√b, √a+b 면 √a−b 를 곱해.","again":"3/(√5+√2)를 유리화할 때 곱할 식과 이유를 말해 봐.","fig":false,"src":"87쪽","wrong":"분모에 루트 3만 곱하면 돼요","miscon":"√3만 곱해 분모에 근호가 남음","record":"분모가 √a+b 꼴일 때 합과 차의 곱으로 유리화하는 방법을 모름","half":"부호를 반대로 한 루트 3 빼기 1을 곱해요"},{"kind":"함정","q":"1/(√3+1)을 유리화하면서 분모와 분자에 √3만 곱하면 왜 안 될까?","ideas":[["√3×(√3+1)=3+√3이 되어 분모에 여전히 근호가 남는다","√3과 √3+1을 곱하면 근호가 모두 없어질까?"]],"teach":"√3을 곱하면 분모가 3+√3 이라 여전히 무리수야. 분모의 두 항 중 근호가 있는 항만 없애려면 합과 차의 곱이 필요해서 √3−1 을 곱해야 해.","again":"분모가 √2−1 일 때 무엇을 곱해야 근호가 완전히 없어지는지 말해 봐.","fig":false,"src":"87쪽","wrong":"루트 3을 곱하면 분모가 3 더하기 1이 돼요","miscon":"분모의 근호 부분에만 곱하면 된다고 생각함","record":"분모의 항이 두 개일 때 한쪽만 곱해서는 유리화가 안 되는 이유를 설명하지 못함"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"36. a+b, ab의 값을 이용하여 a²+b²의 값을 구할 수 있다?","steps":[{"kind":"방법","q":"a, b의 값을 몰라도 a+b와 ab의 값을 알면 a²+b²을 구할 수 있어. 어떤 식을 이용하고, 그 식은 어디서 나왔어?","ideas":[["a²+b²=(a+b)²−2ab를 이용한다","a²+b²을 a+b와 ab로 나타낼 수 있을까?"],["(a+b)²=a²+2ab+b²에서 2ab를 옮겨 얻은 식이다","(a+b)²을 전개한 식에서 a²+b²만 남기려면 무엇을 빼야 할까?"]],"teach":"(a+b)²=a²+2ab+b² 이니까 a²+b²=(a+b)²−2ab. a−b 와 ab 를 알면 a²+b²=(a−b)²+2ab. 곱셈 공식을 거꾸로 옮긴 거야.","again":"a−b와 ab를 알 때 a²+b²을 구하는 식을 말해 봐.","fig":false,"src":"88쪽","wrong":"a²+b²은 (a+b)²이랑 같아요","miscon":"a²+b²=(a+b)²으로 봄","record":"곱셈 공식을 변형해 a²+b²을 합·곱으로 나타내지 못함","half":"(a+b)의 제곱에서 2ab를 빼요"},{"kind":"연결","q":"a+1/a의 값을 알면 a를 구하지 않고도 a²+1/a²의 값을 구할 수 있어. 그 이유는 뭘까?","ideas":[["a×(1/a)=1이라 두 수의 곱을 이미 알고 있다","a와 1/a를 곱하면 얼마야?"],["그래서 a²+1/a²=(a+1/a)²−2로 합만 알면 구할 수 있다","a²+b²=(a+b)²−2ab에서 ab 자리에 1을 넣으면?"]],"teach":"a와 1/a 는 곱이 늘 1이야. 그래서 a²+1/a²=(a+1/a)²−2×1, 또는 (a−1/a)²+2. 합이나 차 하나만 알아도 값을 구할 수 있어.","again":"a−1/a를 알 때 a²+1/a²을 구하는 방법을 말해 봐.","fig":false,"src":"88쪽","wrong":"a를 먼저 구해야 해서 알 수 없어요","miscon":"a의 값을 직접 구해야만 한다고 생각함","record":"역수 관계에서 곱이 1임을 이용해 식의 값을 구하지 못함","half":"a 곱하기 a분의 1은 1이에요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"37. x=(무리수)일 때, 식의 값을 어떻게 구할까?","steps":[{"kind":"전략","q":"x=2+√3, y=2−√3일 때 x²+y²+5xy의 값을 구하려면 x, y를 바로 대입하는 것보다 어떤 방법이 편할까?","ideas":[["x+y와 xy를 먼저 구하면 근호가 사라진다","(2+√3)+(2−√3)과 (2+√3)(2−√3)에는 근호가 남을까?"],["주어진 식을 x+y와 xy로 나타낸 뒤 대입한다","x²+y²을 x+y와 xy로 나타내면 어떻게 되지?"]],"teach":"x+y=4, xy=1 로 근호가 없어져. x²+y²+5xy=(x+y)²−2xy+5xy=(x+y)²+3xy 로 바꿔 넣으면 계산이 짧아. 두 방법 중 편한 쪽을 고르면 돼.","again":"x=1/(√2−1), y=1/(√2+1)일 때 x²+y²−xy를 구하는 순서를 말해 봐.","fig":false,"src":"89쪽","wrong":"x와 y를 그대로 넣어서 제곱하는 게 제일 편해요","miscon":"대입 전에 식을 바꿔 볼 생각을 못함","record":"대입 전에 식을 변형해 계산을 줄이는 방법을 떠올리지 못함","half":"x 더하기 y랑 xy를 먼저 구해요"},{"kind":"방법","q":"x=1/(√2+1)일 때 x²+2x+5의 값을 조건을 변형해서 구하는 방법을 말해 봐.","ideas":[["x를 유리화해 √2−1로 만든 뒤 x+1=√2처럼 근호만 한쪽에 남긴다","x=√2−1에서 근호만 한쪽에 남기려면 어떻게 이항하지?"],["양변을 제곱해 x²+2x의 값을 얻어 식에 대입한다","x+1=√2의 양변을 제곱하면 무엇이 나올까?"]],"teach":"x=√2−1 이니까 x+1=√2. 양변을 제곱하면 x²+2x+1=2, 곧 x²+2x=1. 그래서 x²+2x+5=1+5=6. 근호가 있는 수를 그대로 제곱해 넣는 것보다 짧아.","again":"x=√3+1일 때 x²−2x의 값을 구하려면 조건을 어떻게 바꾸면 되는지 말해 봐.","fig":false,"src":"89쪽","wrong":"x를 그대로 제곱해서 넣어야만 해요","miscon":"근호가 남은 채로 제곱해 계산이 복잡해짐","record":"근호만 남기고 제곱해 식을 간단히 하는 방법을 모름","half":"x 더하기 1을 루트 2로 만들어요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"38. 인수분해란?","steps":[{"kind":"뜻","q":"인수분해는 무엇이고, 전개와는 어떤 관계야?","ideas":[["하나의 다항식을 두 개 이상의 다항식의 곱으로 나타내는 것이다","x²−3x+2를 (x−1)(x−2)로 바꾸는 건 합의 꼴을 무엇의 꼴로 바꾼 걸까?"],["전개를 거꾸로 하는 과정이다","(x−1)(x−2)를 전개하면 무엇이 되지? 인수분해는 그 반대 방향일까?"]],"teach":"(x−1)(x−2)를 전개하면 x²−3x+2. 반대로 x²−3x+2 를 (x−1)(x−2) 처럼 곱의 꼴로 나타내는 것이 인수분해야. 합의 꼴 → 곱의 꼴.","again":"x²−9=(x+3)(x−3)에서 어느 방향이 인수분해인지 말해 봐.","fig":false,"src":"96쪽","wrong":"인수분해는 식을 전개하는 거예요","miscon":"인수분해와 전개를 같은 것으로 봄","record":"인수분해의 뜻과 전개와의 관계를 설명하지 못함","half":"다항식을 곱의 꼴로 나타내는 거예요"},{"kind":"뜻","q":"x²−3x+2=(x−1)(x−2)에서 인수는 무엇무엇이야? 인수를 찾을 때 빠뜨리기 쉬운 것은?","ideas":[["곱해진 각각의 식 x−1, x−2가 인수이다","(x−1)(x−2)에서 곱해져 있는 식은 무엇무엇이지?"],["1과 자기 자신 x²−3x+2도 인수이다","6의 약수에 1과 6이 들어가듯, 다항식의 인수에도 빠뜨린 게 없을까?"]],"teach":"인수는 곱을 이루는 각각의 식이야. x²−3x+2 의 인수는 1, x−1, x−2, x²−3x+2. 약수처럼 1과 자기 자신도 인수야.","again":"x²−x=x(x−1)의 인수를 모두 말해 봐.","fig":false,"src":"96쪽","wrong":"인수는 x랑 1, 2예요","miscon":"1과 자기 자신을 인수에서 빠뜨림","record":"인수의 뜻과 1·자기 자신도 인수라는 것을 모름","half":"x 빼기 1이랑 x 빼기 2요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"39. 공통인수를 이용하여 어떻게 인수분해할까?","steps":[{"kind":"방법","q":"ma+mb처럼 모든 항에 공통으로 들어 있는 인수가 있을 때 어떻게 인수분해해?","ideas":[["모든 항에 공통으로 들어 있는 인수를 찾는다","ma와 mb에 똑같이 들어 있는 것은 무엇이지?"],["분배법칙을 거꾸로 써서 공통인수를 괄호 밖으로 묶어 낸다","m(a+b)를 전개하면 ma+mb가 되지? 그 반대로 하면?"]],"teach":"ma+mb=m(a+b). 각 항에 공통으로 있는 인수를 공통인수라고 하고, 분배법칙을 거꾸로 써서 괄호 밖으로 묶어. 괄호 안에는 각 항에서 남은 것을 써.","again":"6a²−3ab+3ac를 인수분해하는 방법을 말해 봐.","fig":true,"src":"97쪽","wrong":"항마다 다른 문자를 하나씩 묶어요","miscon":"공통이 아닌 인수까지 묶거나 일부만 묶음","record":"공통인수를 찾아 분배법칙으로 묶어 내는 방법을 모름","half":"두 항에 똑같이 있는 m을 찾아요"},{"kind":"함정","q":"2x²+4x를 x(2x+4)로 인수분해하면 왜 덜 된 걸까? 공통인수를 묶을 때 규칙은?","ideas":[["괄호 안에 공통인수 2가 남아 있어 끝까지 묶지 않았다","2x+4의 두 항에 공통으로 들어 있는 수가 있을까?"],["수는 최대공약수로, 문자는 차수가 가장 낮은 것으로 남김없이 묶는다","2x²과 4x의 수 부분 최대공약수와 공통인 문자는 무엇이지?"]],"teach":"2x²+4x 의 공통인수는 x 가 아니라 2x 야. 2x(x+2) 까지 묶어야 끝. 수는 최대공약수, 문자는 가장 낮은 차수로 묶어. ax+ay−a 처럼 한 항 전체가 묶이면 괄호 안에 1이 남는 것도 조심해.","again":"ax+ay−a를 인수분해할 때 조심할 점을 말해 봐.","fig":false,"src":"97쪽","wrong":"x로 묶었으니까 다 된 거예요","miscon":"공통인수를 일부만 묶고 끝냄","record":"공통인수를 남김없이(최대공약수·가장 낮은 차수) 묶어야 한다는 것을 모름","half":"괄호 안에 2가 남아 있어요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"40. 괄호로 묶인 부분이 공통인수일 때는 어떻게 인수분해할까?","steps":[{"kind":"방법","q":"a(x+y)−b(x+y)처럼 괄호로 묶인 부분이 두 항에 공통으로 있을 때 어떻게 인수분해해?","ideas":[["괄호로 묶인 x+y 전체를 공통인수로 보고 묶어 낸다","두 항에 똑같이 들어 있는 것은 x 하나일까, (x+y) 전체일까?"],["헷갈리면 x+y를 A로 치환해 aA−bA=A(a−b)로 묶는다","x+y를 한 문자로 바꾸면 어떤 식이 되지?"]],"teach":"공통인수는 수나 문자뿐 아니라 괄호로 묶인 식이어도 돼. a(x+y)−b(x+y)=(x+y)(a−b). 실수가 걱정되면 x+y=A 로 치환해서 묶어.","again":"a(x+1)−(x+1)을 인수분해할 때 −(x+1)에서 괄호 밖에 남는 것이 무엇인지 말해 봐.","fig":false,"src":"98쪽","wrong":"x랑 y를 따로따로 묶어야 해요","miscon":"괄호 전체를 하나의 인수로 보지 못함","record":"괄호로 묶인 식 전체를 공통인수로 보고 묶는 방법을 모름","half":"(x+y)를 통째로 묶어요"},{"kind":"함정","q":"5x(x+2)−3y(x+2)를 x+2=A로 치환해 인수분해한 뒤 A(5x−3y)로 끝내면 왜 틀릴까?","ideas":[["치환한 A에 원래 식 x+2를 다시 대입해야 한다","A는 원래 어떤 식이었지?"],["답에는 문제에 있던 문자만 들어 있어야 인수분해가 끝난 것이다","문제에 없던 문자 A가 답에 남아 있어도 될까?"]],"teach":"A 는 계산을 쉽게 하려고 잠깐 바꾼 이름이야. 인수분해한 다음에는 반드시 A=x+2 를 다시 넣어 (x+2)(5x−3y) 로 써야 끝나.","again":"치환을 이용해 인수분해할 때 마지막에 꼭 해야 하는 일을 말해 봐.","fig":false,"src":"98쪽 참고","wrong":"A로 바꿨으니까 답을 A로 써도 돼요","miscon":"치환한 문자를 답에 그대로 남김","record":"치환 후 원래 식을 대입해 마무리하지 못함","half":"A를 다시 x 더하기 2로 바꿔야 해요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"41. ax+a+bx+b는 어떻게 인수분해할까?","steps":[{"kind":"방법","q":"ax+a+bx+b처럼 네 항 전체에 공통인수가 보이지 않을 때 어떻게 인수분해해?","ideas":[["두 항씩 묶어 각각 공통인수로 묶는다","ax+a와 bx+b를 각각 인수분해하면 어떻게 되지?"],["그러면 생긴 공통인수 x+1로 한 번 더 묶는다","a(x+1)+b(x+1)에 공통으로 있는 것은?"]],"teach":"ax+a=a(x+1), bx+b=b(x+1) 이라 전체는 a(x+1)+b(x+1)=(x+1)(a+b). 전체 공통인수가 없어도 두 항씩 묶으면 공통인수가 생길 수 있어.","again":"xy−x+y−1을 인수분해하는 방법을 말해 봐.","fig":false,"src":"98쪽","wrong":"전체에 공통인수가 없으니까 인수분해가 안 돼요","miscon":"전체 공통인수가 없으면 인수분해할 수 없다고 판단함","record":"두 항씩 묶어 공통인수를 만드는 방법을 모름","half":"두 항씩 묶어요"},{"kind":"함정","q":"ax+a+bx+b를 (ax+bx)+(a+b)로 묶어도 될까? 두 항씩 묶을 때 짝은 어떻게 정해?","ideas":[["묶은 뒤 괄호 안이 같은 식이 되도록 짝을 정한다","a(x+1)과 b(x+1)처럼 괄호 안이 같아야 다음에 무엇을 할 수 있지?"],["(ax+bx)+(a+b)=x(a+b)+(a+b)도 괄호 안이 같아 (a+b)(x+1)이 되므로 이렇게 묶어도 된다","x(a+b)+(a+b)에서 공통인수는 무엇이지?"]],"teach":"짝을 어떻게 짓든 묶은 뒤 괄호 안이 같아지면 돼. x(a+b)+(a+b)=(a+b)(x+1) 로 같은 답이 나와. 괄호 안이 달라지는 짝은 다시 골라.","again":"두 항씩 묶었는데 괄호 안이 서로 달라졌다면 어떻게 해야 하는지 말해 봐.","fig":false,"src":"98쪽","wrong":"짝을 바꾸면 답이 달라지니까 안 돼요","miscon":"묶는 짝이 하나로 정해져 있다고 생각함","record":"공통인수가 생기도록 짝을 정하는 기준을 설명하지 못함","half":"괄호 안이 같아지게 짝을 지어요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"42. a²+2ab+b², a²-2ab+b²은 어떻게 인수분해할까?","steps":[{"kind":"방법","q":"x²+10x+25가 (x+5)²으로 인수분해된다는 걸 어떻게 알아봐?","ideas":[["처음과 끝 항이 각각 x²과 5²처럼 어떤 식의 제곱인지 본다","x²과 25는 각각 무엇의 제곱이지?"],["가운데 항이 2×x×5와 같은지 확인한다","x와 5를 곱해서 2배 하면 가운데 항과 같을까?"]],"teach":"a²+2ab+b²=(a+b)² 은 곱셈 공식을 거꾸로 쓴 거야. x²+10x+25 는 양 끝이 x², 5² 이고 가운데가 2×x×5 라서 (x+5)². 가운데가 − 이면 (a−b)².","again":"4x²−4x+1이 완전제곱식으로 인수분해되는지 확인하는 방법을 말해 봐.","fig":false,"src":"100쪽","wrong":"x²+10x+25는 (x+10)²이에요","miscon":"가운데 항의 계수를 그대로 괄호 안에 씀","record":"a²±2ab+b² 꼴인지(양 끝이 제곱·가운데가 2ab) 확인하는 방법을 모름","half":"처음 x²이랑 끝의 25가 각각 x와 5의 제곱인지 봐요"},{"kind":"함정","q":"3x²−18x+27을 완전제곱식으로 인수분해할 때 먼저 할 일은 뭐고, 괄호 안의 부호는 어떻게 정해?","ideas":[["공통인수 3을 먼저 묶어 3(x²−6x+9)로 만든다","세 항에 공통으로 들어 있는 수가 있을까?"],["가운데 항이 −이면 (x−3)²처럼 괄호 안도 −이다","가운데 항 −6x의 부호는 괄호 안의 어느 부호와 같을까?"]],"teach":"3 을 먼저 묶으면 3(x²−6x+9)=3(x²−2×x×3+3²)=3(x−3)². 공통인수를 안 묶으면 27 이 제곱수가 아니라 완전제곱식이 안 보여.","again":"2x²+8x+8을 인수분해하는 순서를 말해 봐.","fig":false,"src":"100쪽 예제 15","wrong":"27이 제곱수가 아니라서 완전제곱식이 안 돼요","miscon":"공통인수를 묶지 않아 완전제곱식을 알아보지 못함","record":"공통인수를 먼저 묶고 부호를 맞춰 완전제곱식으로 인수분해하지 못함","half":"3으로 먼저 묶어요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"43. 완전제곱식으로 인수분해할 식인지 어떻게 확인할 수 있을까?","steps":[{"kind":"성질","q":"x²+ax+b가 완전제곱식이 될 조건은 뭐고, 왜 그런지 (x+a/2)²을 전개해서 설명해 봐.","ideas":[["x의 계수의 절반의 제곱이 상수항과 같아야 한다","x²+2x+1에서 x의 계수 2의 절반을 제곱하면 얼마야?"],["(x+a/2)²=x²+ax+(a/2)²이기 때문이다","(x+a/2)²을 전개하면 상수항은 무엇이 되지?"]],"teach":"(x+a/2)² 을 전개하면 x²+ax+(a/2)². 그래서 x²+ax+b 가 완전제곱식이 되려면 b=(a/2)², 곧 \"x 의 계수 절반의 제곱 = 상수항\" 이어야 해. x²−6x+9 는 (−6/2)²=9 라서 (x−3)².","again":"x²−6x+9가 완전제곱식인 이유를 조건을 써서 말해 봐.","fig":false,"src":"101쪽","wrong":"상수항이 제곱수이기만 하면 돼요","miscon":"상수항이 제곱수이기만 하면 완전제곱식이라고 생각함","record":"완전제곱식이 될 조건(계수 절반의 제곱=상수항)을 설명하지 못함","half":"x의 계수 절반을 제곱하면 상수항이 돼야 해요"},{"kind":"성질","q":"9x²+24x+16처럼 x²의 계수가 1이 아닐 때는 완전제곱식인지 어떻게 확인해?","ideas":[["x의 계수의 절반의 제곱이 x²의 계수와 상수항의 곱과 같은지 본다","24의 절반을 제곱한 값과 9×16을 비교해 볼래?"],["(ax+c)²을 전개하면 x²의 계수 a², 상수항 c², x의 계수 2ac라서 절반의 제곱이 두 수의 곱과 같기 때문이다","(3x+4)²을 전개해서 x²의 계수와 상수항을 곱해 볼래?"]],"teach":"(ax+c)²=a²x²+2acx+c². x 의 계수 절반 ac 를 제곱하면 a²c², 곧 (x²의 계수)×(상수항). 9x²+24x+16 은 12²=144=9×16 이라 (3x+4)².","again":"4x²−12xy+9y²이 완전제곱식인지 확인하는 방법을 말해 봐.","fig":false,"src":"101쪽","wrong":"x²의 계수가 1이 아니면 완전제곱식이 안 돼요","miscon":"x²의 계수가 1일 때만 완전제곱식이 된다고 생각함","record":"x²의 계수가 1이 아닌 경우의 완전제곱식 조건을 모름","half":"절반의 제곱이랑 9 곱하기 16을 비교해요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"44. x²+□x+25가 완전제곱식이 되도록 하는 □의 값은?","steps":[{"kind":"함정","q":"x²+□x+25가 완전제곱식이 되도록 □에 알맞은 수를 구할 때, 10 하나만 답하면 왜 부족할까?","ideas":[["(x+5)²과 (x−5)² 둘 다 상수항이 25이다","(x−5)²을 전개해도 상수항이 25일까?"],["가운데 항은 +, − 부호를 모두 가질 수 있어서 □는 두 값이다","(x−5)²을 전개하면 가운데 항의 부호는?"]],"teach":"(x+5)²=x²+10x+25, (x−5)²=x²−10x+25. 둘 다 상수항이 25 라서 □ 는 10 과 −10 두 가지야. \"양수\" 같은 조건이 없으면 둘 다 써야 해.","again":"x²+□x+36이 완전제곱식이 되도록 □를 구할 때 조심할 점을 말해 봐.","fig":false,"src":"101쪽","wrong":"25의 제곱근이 5니까 □는 10 하나예요","miscon":"양수만 생각해 음수 값을 빠뜨림","record":"완전제곱식의 가운데 항이 두 부호를 가질 수 있다는 것을 모름","half":"x 빼기 5의 제곱도 되니까요"},{"kind":"함정","q":"x²+□x+25y²이 완전제곱식이 되려면 □에 무엇이 들어가야 할까? 수만 넣으면 왜 틀릴까?","ideas":[["상수 부분 25y²이 (5y)²이라 (x±5y)² 꼴이 되어야 한다","25y²은 무엇의 제곱이지?"],["가운데 항이 2×x×5y이므로 □에는 문자 y까지 붙어야 한다","가운데 항에 y가 없으면 (x+5y)²을 전개한 식과 같아질까?"]],"teach":"25y²=(5y)² 이니까 (x±5y)² 이 되어야 해. 가운데 항은 2×x×(±5y)=±10xy 라서 □ 에는 ±10y 가 들어가. 문자를 빠뜨리지 마.","again":"□x²+12xy+4y²이 완전제곱식이 되는 □를 구할 때 확인할 것을 말해 봐.","fig":false,"src":"101쪽","wrong":"□에는 플러스 마이너스 10이 들어가요","miscon":"문자를 빠뜨리고 수만 씀","record":"완전제곱식에서 문자까지 포함해 가운데 항을 정하지 못함","half":"25y²은 5y의 제곱이에요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"45. a²-b²은 어떻게 인수분해할까?","steps":[{"kind":"방법","q":"a²−b²은 어떻게 인수분해하고, 이 공식을 쓸 수 있는 식인지는 어떻게 알아봐?","ideas":[["a²−b²=(a+b)(a−b)로 합과 차의 곱으로 인수분해한다","합과 차의 곱 (a+b)(a−b)를 전개하면 무엇이었지?"],["항이 2개이고 둘 다 제곱 꼴이며 빼기로 연결되어 있는지 본다","36x²−25y²의 두 항은 각각 무엇의 제곱이고 어떻게 연결돼 있지?"]],"teach":"(a+b)(a−b)=a²−b² 을 거꾸로 쓰면 a²−b²=(a+b)(a−b). \"제곱 − 제곱\" 꼴인지만 보면 돼: 36x²−25y²=(6x)²−(5y)²=(6x+5y)(6x−5y).","again":"x²−16을 인수분해할 수 있는 이유를 말해 봐.","fig":true,"src":"102쪽","wrong":"a²−b²은 (a−b)²이에요","miscon":"(a−b)²과 혼동함","record":"제곱의 차를 합과 차의 곱으로 인수분해하지 못함","half":"a 더하기 b 곱하기 a 빼기 b로 해요"},{"kind":"함정","q":"a²−1이나 −4x²+25는 제곱의 차 공식을 쓰려면 어떻게 바꿔서 봐야 할까?","ideas":[["1을 1²으로 본다","1은 무엇의 제곱일까?"],["−4x²+25는 순서를 바꿔 5²−(2x)²으로 본다","−4x²+25의 두 항 순서를 바꾸면 어떤 꼴이 될까?"]],"teach":"a²−1=a²−1²=(a+1)(a−1). −4x²+25=25−4x²=5²−(2x)²=(5+2x)(5−2x). 제곱의 차가 보이게 식을 살짝 바꿔 보는 눈이 필요해.","again":"−a²+b²을 인수분해하는 방법을 말해 봐.","fig":false,"src":"102쪽","wrong":"1은 제곱이 아니라서 a²−1은 인수분해가 안 돼요","miscon":"1이나 순서가 바뀐 식을 제곱의 차로 알아보지 못함","record":"식을 a²−b² 꼴로 바꿔 보는 변형을 하지 못함","half":"1을 1의 제곱으로 봐요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"46. x²+(a+b)x+ab는 어떻게 인수분해할까?","steps":[{"kind":"방법","q":"x²+5x+6을 (x+a)(x+b) 꼴로 인수분해하려면 어떤 두 수를 어떻게 찾아?","ideas":[["곱이 상수항 6이고 합이 x의 계수 5인 두 수를 찾는다","(x+a)(x+b)를 전개하면 상수항과 x의 계수에 각각 무엇이 오지?"],["곱이 6인 두 정수를 먼저 나열한 뒤 그중 합이 5인 것을 고른다","곱과 합 중 어느 쪽부터 찾으면 경우가 적을까?"]],"teach":"x²+(a+b)x+ab=(x+a)(x+b). 곱이 6 인 두 정수는 (1,6), (2,3), (−1,−6), (−2,−3) 뿐이라 곱부터 찾고, 그중 합이 5 인 (2,3) 을 골라 (x+2)(x+3).","again":"x²+3x+2를 인수분해할 두 수를 찾는 방법을 말해 봐.","fig":true,"src":"103쪽","wrong":"더해서 6이고 곱해서 5인 수를 찾아요","miscon":"합과 곱의 자리를 바꿔 찾음","record":"곱이 상수항, 합이 x의 계수인 두 수를 찾는 방법을 모름","half":"곱해서 6이고 더해서 5인 두 수를 찾아요"},{"kind":"함정","q":"x²−2x−8처럼 부호가 섞여 있을 때 두 수를 찾으면서 조심할 점은?","ideas":[["상수항이 음수이면 두 수의 부호가 서로 다르다","곱이 −8이 되려면 두 수의 부호는 어때야 할까?"],["합이 음수이면 절댓값이 큰 쪽이 음수이다","합이 −2가 되려면 2와 4 중 어느 쪽에 −를 붙여야 할까?"]],"teach":"곱 −8 → 두 수의 부호가 달라. 합 −2 → 절댓값이 큰 쪽이 음수. 그래서 2 와 −4, (x+2)(x−4). 절댓값만 보고 (x+2)(x+4) 로 쓰면 틀려.","again":"x²+2x−15를 인수분해할 때 두 수의 부호를 정하는 방법을 말해 봐.","fig":false,"src":"103쪽 예제 18","wrong":"8을 2 곱하기 4로 나눠서 x 더하기 2, x 더하기 4예요","miscon":"부호를 무시하고 절댓값만으로 두 수를 고름","record":"상수항과 x의 계수의 부호로 두 수의 부호를 정하지 못함","half":"곱이 음수라서 두 수의 부호가 달라요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"47. acx²+(ad+bc)x+bd는 어떻게 인수분해할까?","steps":[{"kind":"방법","q":"2x²+7x+3처럼 x²의 계수가 1이 아닌 이차식은 어떻게 인수분해해?","ideas":[["x²의 계수와 상수항을 각각 두 수의 곱으로 나눠 세로로 놓는다","2와 3을 각각 어떤 두 수의 곱으로 나눌 수 있지?"],["대각선 방향으로 곱한 두 값의 합이 x의 계수가 되는 배치를 찾는다","대각선으로 곱한 두 수를 더하면 7이 되는지 확인해 볼래?"]],"teach":"2=2×1, 3=1×3 으로 놓으면 대각선 곱 2×3=6, 1×1=1 의 합이 7 이라 성공. 같은 가로 줄끼리 묶어 (2x+1)(x+3).","again":"2x²+x−15를 인수분해하는 방법을 말해 봐.","fig":false,"src":"104쪽","wrong":"3을 1 곱하기 3으로 나눠서 x 더하기 1, x 더하기 3이에요","miscon":"x²의 계수를 무시하고 (x+a)(x+b) 방법을 그대로 씀","record":"x²의 계수까지 나눠 대각선 곱의 합을 맞추는 방법을 모름","half":"대각선으로 곱해서 더한 게 7이 되게 해요"},{"kind":"함정","q":"3x²−x−4를 인수분해할 때 수의 위치와 부호를 바꾸면 대각선 곱의 합이 여러 가지로 나와. 맞는 배치를 찾은 뒤 식으로 쓸 때 틀리기 쉬운 점은?","ideas":[["합이 x의 계수와 같아질 때까지 수의 위치와 부호를 바꿔 본다","−1과 4, 1과 −4 중 어떤 배치가 합 −1을 만들까?"],["식을 쓸 때는 대각선이 아니라 같은 가로 줄의 수끼리 묶는다","3과 같은 가로 줄에 있는 수는 무엇이고, 그 둘로 어떤 일차식을 만들지?"]],"teach":"1, 1 / 3, −4 로 놓으면 대각선 곱 1×(−4)=−4 와 3×1=3 의 합이 −1. 식은 가로 줄끼리 (x+1)(3x−4). 대각선끼리 묶어 쓰면 틀려.","again":"대각선 곱의 합을 확인한 뒤 일차식을 만들 때 어느 방향으로 묶는지 이유와 함께 말해 봐.","fig":false,"src":"104쪽","wrong":"대각선끼리 묶어서 x 빼기 4, 3x 더하기 1이에요","miscon":"식을 쓸 때 대각선 방향으로 묶음","record":"배치를 바꿔 합을 맞추고 가로 줄로 묶어 쓰는 과정을 정확히 하지 못함","half":"가로 줄끼리 묶어서 써요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"48. 2x²+Ax-6이 x-2로 나누어 떨어질 때, A의 값은?","steps":[{"kind":"방법","q":"2x²+Ax−6이 x−2로 나누어떨어질 때 A를 구하려면 식을 어떻게 놓고 생각해?","ideas":[["2x²+Ax−6=(x−2)(□)처럼 x−2를 인수로 놓는다","x가 2로 나누어떨어지면 x=2×□라고 놓았지?"],["x²의 계수와 상수항에 맞게 □를 정한 뒤 x의 계수를 비교해 A를 구한다","x×□가 2x²이 되고 (−2)×(□의 상수)가 −6이 되려면 □는?"]],"teach":"나누어떨어진다 = x−2 가 인수. 2x²+Ax−6=(x−2)(2x+3) 이어야 x² 의 계수 2, 상수항 −6 이 맞아. 이제 x 의 계수 3−4=−1 이 A.","again":"3x²+Ax−5가 x−1을 인수로 가질 때 A를 구하는 방법을 말해 봐.","fig":false,"src":"105쪽","wrong":"2로 나눠서 x²에 A분의 2 x 빼기 3으로 봐요","miscon":"나누어떨어진다는 뜻을 인수와 연결하지 못함","record":"나누어떨어짐을 인수분해(인수)로 바꿔 생각하지 못함","half":"x 빼기 2 곱하기 괄호로 놓아요"},{"kind":"연결","q":"같은 문제를 x=2를 대입해서 풀 수도 있어. x−2로 나누어떨어지면 왜 x=2를 넣은 값이 0이 될까?","ideas":[["x−2가 인수이면 x=2일 때 그 인수가 0이 된다","x=2를 넣으면 x−2는 얼마가 되지?"],["인수 하나가 0이면 곱 전체가 0이라서 2×2²+2A−6=0으로 A를 구할 수 있다","0에 어떤 수를 곱하면 얼마야?"]],"teach":"2x²+Ax−6=(x−2)×(□) 에 x=2 를 넣으면 오른쪽은 0×(□)=0. 그래서 왼쪽도 0 이 되어 8+2A−6=0. 인수와 방정식의 해가 연결돼.","again":"다항식이 x+1로 나누어떨어질 때 어떤 값을 대입하면 0이 되는지와 이유를 말해 봐.","fig":false,"src":"105쪽","wrong":"x에 2를 넣으면 A가 2가 돼요","miscon":"대입한 값이 0이 되는 이유를 모르고 임의로 대입함","record":"인수와 방정식의 해(대입하면 0)를 연결하지 못함","half":"x 빼기 2에 2를 넣으면 0이 돼요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"49. 치환을 이용하여 어떻게 인수분해할까?","steps":[{"kind":"방법","q":"(x+y)²+10(x+y)+24는 어떻게 인수분해해?","ideas":[["반복해서 나오는 x+y를 A로 치환한다","식에서 두 번 반복해서 나오는 부분은 무엇이지?"],["A²+10A+24를 인수분해한 뒤 A에 x+y를 다시 대입한다","A로 인수분해를 끝냈으면 마지막에 무엇을 해야 할까?"]],"teach":"x+y=A 로 두면 A²+10A+24=(A+4)(A+6). 여기에 A=x+y 를 다시 넣어 (x+y+4)(x+y+6). (A+4)(A+6) 에서 멈추면 틀려.","again":"(x−y+1)(x−y−6)+10을 인수분해하는 방법을 말해 봐.","fig":false,"src":"107쪽","wrong":"(x+y)²부터 전개해서 풀어요","miscon":"공통부분을 보지 못하고 전개부터 함","record":"공통부분을 치환해 인수분해 공식을 쓰는 방법을 모름","half":"x 더하기 y를 A로 바꿔요"},{"kind":"함정","q":"(2x+3)²−(x+4)²을 인수분해할 때 어떤 공식을 쓰고, 마지막에 무엇을 조심해야 해?","ideas":[["2x+3=A, x+4=B로 치환하면 A²−B²이라 (A+B)(A−B)로 인수분해한다","A²−B²은 어떤 공식으로 인수분해하지?"],["원래 식을 대입해 괄호를 풀 때 빼는 식의 부호를 모두 바꾼다","(2x+3)−(x+4)에서 괄호를 풀면 4의 부호는?"]],"teach":"(A+B)(A−B)={(2x+3)+(x+4)}{(2x+3)−(x+4)}=(3x+7)(x−1). 빼는 괄호를 풀 때 x+4 의 두 항 부호를 모두 바꿔야 해.","again":"(a+1)²−(a−2)²을 인수분해할 때 부호를 조심해야 하는 곳을 말해 봐.","fig":false,"src":"108쪽 예제 21","wrong":"2x 더하기 3 빼기 x 빼기 4를 제곱해요","miscon":"제곱의 차를 차의 제곱으로 봄","record":"치환 후 제곱의 차 공식을 적용하고 부호를 정리하지 못함","half":"2x+3을 A, x+4를 B로 바꾸면 제곱의 차라서 A+B 곱하기 A−B로 해요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"50. ( )( )( )( )+k 꼴은 어떻게 인수분해할까?","steps":[{"kind":"방법","q":"(x−1)(x−3)(x+2)(x+4)+24는 어떻게 인수분해를 시작해?","ideas":[["전개했을 때 공통부분이 생기도록 두 개씩 짝지어 전개한다","(x−1)(x+2)와 (x−3)(x+4)를 전개하면 x의 계수가 같아질까?"],["공통부분 x²+x를 A로 치환해 인수분해한다","두 전개식에 똑같이 들어 있는 부분은 무엇이지?"]],"teach":"상수의 합이 같도록 짝지으면 (x−1)(x+2)=x²+x−2, (x−3)(x+4)=x²+x−12 로 x²+x 가 공통. A=x²+x 로 두면 (A−2)(A−12)+24=A²−14A+48=(A−6)(A−8).","again":"(x+1)(x+2)(x−3)(x−4)+4를 짝짓는 방법을 말해 봐.","fig":false,"src":"108쪽","wrong":"이미 곱의 꼴이니까 인수분해가 끝났어요","miscon":"+k가 있어도 인수분해가 끝났다고 봄","record":"짝지어 전개해 공통부분을 만드는 방법을 모름","half":"공통부분이 생기게 상수의 합이 같은 것끼리 두 개씩 짝지어 전개해요"},{"kind":"함정","q":"(x−1)(x−3)(x+2)(x+4)+24가 이미 곱의 꼴로 보이는데 인수분해가 끝난 게 아닌 이유는? A로 인수분해한 뒤에는 무엇을 더 확인해야 해?","ideas":[["마지막에 +24가 더해져 있어서 식 전체는 곱이 아니라 합의 꼴이다","식 전체가 곱으로 끝나는지, 더하기로 끝나는지 봐 볼래?"],["A에 원래 식을 대입한 뒤 더 인수분해할 수 있는지 끝까지 확인한다","x²+x−6은 더 인수분해할 수 있을까?"]],"teach":"+24 때문에 전체는 합이야. A 로 인수분해해 (x²+x−6)(x²+x−8) 을 얻은 뒤에도 x²+x−6=(x−2)(x+3) 으로 더 분해돼. 더 이상 안 될 때까지 확인해.","again":"인수분해가 끝났는지 판단하는 기준 두 가지를 말해 봐.","fig":false,"src":"108쪽","wrong":"괄호가 네 개 곱해져 있으니까 인수분해가 된 거예요","miscon":"겉모양만 보고 인수분해가 끝났다고 봄","record":"인수분해가 끝났는지(곱의 꼴인지·더 분해되는지) 판단하지 못함","half":"뒤에 24가 더해져 있어서요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"51. 항이 4개인 식은 어떻게 인수분해할까?","steps":[{"kind":"방법","q":"항이 4개이고 공통인수가 없는 식은 어떤 두 가지 방법으로 묶어 볼 수 있어?","ideas":[["(항 2개)+(항 2개)로 묶어 공통인수를 만든다","4xy−2x−2y+1을 두 항씩 묶으면 공통인수가 생길까?"],["(항 3개)+(항 1개)로 묶어 ( )²−( )² 꼴로 만든다","a²+2ab+b²−16에서 앞의 세 항은 어떤 식이지?"]],"teach":"두 항씩 묶어 공통인수가 생기면 (2+2), 세 항이 완전제곱식이 되고 나머지 한 항이 제곱이면 (3+1) 로 묶어 제곱의 차를 써: a²+2ab+b²−16=(a+b)²−4²=(a+b+4)(a+b−4).","again":"x²y−x²−y+1을 어떻게 묶을지 말해 봐.","fig":false,"src":"109~110쪽","wrong":"전체에 공통인수가 없으면 인수분해를 못 해요","miscon":"전체 공통인수가 없으면 인수분해할 수 없다고 판단함","record":"항이 4개인 식을 (2+2) 또는 (3+1)로 묶는 방법을 모름","half":"두 항씩 묶어서 공통인수를 만들어요"},{"kind":"전략","q":"x²−y²+2x+1은 (2+2)와 (3+1) 중 어떤 방법으로 묶는 게 좋을까? 어떻게 알아봐?","ideas":[["x², 2x, 1이 완전제곱식을 이루므로 (3+1)로 묶는다","x², 2x, 1 세 항을 모으면 어떤 식이 되지?"],["(x+1)²−y²이 되어 제곱의 차로 인수분해한다","(x+1)²−y²에는 어떤 공식을 쓸 수 있지?"]],"teach":"−y² 를 따로 두고 x²+2x+1=(x+1)² 을 찾으면 (x+1)²−y²=(x+1+y)(x+1−y). 두 항씩 묶으면 공통인수가 생기지 않아.","again":"a²−b²+2b−1은 어떤 세 항을 묶어야 할지 말해 봐.","fig":false,"src":"110쪽 예제 23","wrong":"x²−y²이랑 2x+1로 두 개씩 묶어요","miscon":"공통인수가 생기지 않는 짝으로 묶음","record":"완전제곱식이 되는 세 항을 찾아 묶는 판단을 하지 못함","half":"x²+2x+1이 완전제곱식이에요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"52. 항이 5개 이상인 식은 어떻게 인수분해할까?","steps":[{"kind":"방법","q":"x²−2xy+y²−7x+7y+12처럼 항이 5개 이상인 식은 어떻게 인수분해해?","ideas":[["완전제곱식이나 공통인수가 생기도록 적당한 항끼리 묶는다","x²−2xy+y²과 −7x+7y는 각각 어떻게 정리되지?"],["생긴 공통부분 x−y를 치환해 인수분해한 뒤 다시 대입한다","(x−y)²−7(x−y)+12에서 반복되는 부분은 무엇이지?"]],"teach":"x²−2xy+y²=(x−y)², −7x+7y=−7(x−y) 로 묶으면 (x−y)²−7(x−y)+12. x−y=A 로 두면 (A−3)(A−4)=(x−y−3)(x−y−4).","again":"x²+2xy−x+y²−y−2를 어떻게 묶을지 말해 봐.","fig":false,"src":"110쪽","wrong":"항이 많으면 다 전개해서 풀어요","miscon":"묶는 기준 없이 전개하거나 포기함","record":"공통부분이 생기도록 묶고 치환하는 방법을 모름","half":"적당한 항끼리 묶어서 공통부분을 만들어요"},{"kind":"방법","q":"문자가 여러 개인 복잡한 식은 한 문자에 대해 내림차순으로 정리해서 인수분해하기도 해. 어떤 문자에 대해 정리하면 편하고, 왜 그래?","ideas":[["차수가 가장 낮은 문자에 대해 내림차순으로 정리한다","x는 2차, y는 1차로만 들어 있다면 어느 문자로 정리할까?"],["그러면 식이 간단한 꼴이 되어 공통인수나 인수분해 공식을 찾기 쉽다","낮은 차수의 문자로 정리하면 식의 모양이 어떻게 보이지?"]],"teach":"내림차순은 한 문자에 대해 차수가 높은 항부터 쓰는 거야. 차수가 낮은 문자로 정리하면 일차식이나 간단한 이차식이 되어 공통인수·인수분해 공식이 잘 보여.","again":"x와 y가 섞인 식을 내림차순으로 정리할 때 문자를 고르는 기준을 말해 봐.","fig":false,"src":"111쪽 THINK Math","wrong":"아무 문자로 정리해도 똑같이 편해요","miscon":"정리할 문자를 고르는 기준이 없음","record":"내림차순 정리로 인수분해의 실마리를 찾는 방법을 모름","half":"차수가 낮은 문자로 정리해요"}]},{"grade":"m3-1","big":"2. 다항식의 곱셈과 인수분해","middle":"1. 다항식의 곱셈과 인수분해","small":"53. 인수분해를 이용하여 수의 계산을 빠르게 할 수 있다?","steps":[{"kind":"방법","q":"65²−35²이나 18×101+18×99 같은 수의 계산을 인수분해 공식으로 빠르게 하려면 어떻게 해?","ideas":[["공통인수로 묶거나 제곱의 차·완전제곱식 같은 공식 <script>
(function(){
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const V={pass:'통과 · 핵심 모두',partial:'일부 · 핵심 일부만',applied:'적용 오류 · 방법은 맞고 적용이 틀림',none:'못 맞힘 · 방법도 결론도 틀림'};
if(!window.REVIEW){ document.getElementById('summary').textContent='검토 데이터 파일이 없어요.'; return; }
const {ladders, results} = window.REVIEW;
const L0 = ladders[0]||{};
document.getElementById('title').textContent = '질문 계단 검토 — '+(L0.grade||'')+' '+(L0.big||'');
let S={steps:0,full:0,halfN:0,half:0,wrongOk:0,flip:0,applied:0};
let html='', lastMid=null;
ladders.forEach(L=>{
  if(L.middle!==lastMid){ html+=`<div class="mid">${esc(L.middle)}</div>`; lastMid=L.middle; }
  const R = results[L.small]||[];
  let warns=0;
  const steps = L.steps.map((s,k)=>{
    const r=R[k]||{}; S.steps++;
    if(r.full&&r.full.verdict==='pass')S.full++;
    if(r.half){S.halfN++; if(r.half.verdict==='partial')S.half++;}
    const wantW = s.wrongKind||'none'; if(r.wrong&&r.wrong.verdict===wantW)S.wrongOk++; if(r.wrong&&r.wrong.verdict==='applied')S.applied++;
    const flip = r.half&&r.half2&&r.half.verdict!==r.half2.verdict; if(flip)S.flip++;
    const odd = flip || (r.full&&r.full.verdict!=='pass') || (r.wrong&&r.wrong.verdict==='pass') || (r.half&&r.half.verdict!=='partial');
    if(odd) warns++;
    const c=(label,ans,x)=> !x?'':`<div class="case"><span class="who">${label}</span>${ans?'“'+esc(ans)+'”':'(통과 아이디어를 그대로 이어 말함)'}<span class="v ${x.verdict||''}">${V[x.verdict]||esc(x.error||'?')}</span>${x.say?`<span class="say">🤖 ${esc(x.say)}</span>`:''}</div>`;
    return `<div class="step"><div class="n">${k+1}</div><div>
      <div class="q"><span class="kind">${esc(s.kind)}</span>${esc(s.q)}${s.fig?'<span class="fig">🖼 그림</span>':''}</div>
      <div class="lbl" style="color:var(--green)">통과 아이디어 · 빠지면 되묻기</div>
      <ul class="ideas">${(s.ideas||[]).map((x,j)=>`<li><i>${'abc'[j]})</i><span>${esc(x[0])}<span class="hq">↳ “${esc(x[1])}”</span></span></li>`).join('')}</ul>
      <div class="lbl" style="color:var(--blue)">짧은 설명</div><div class="teach">${esc(s.teach)}</div>
      <div class="lbl" style="color:var(--purple)">다시 묻기</div><div class="again">“${esc(s.again)}”</div>
      ${s.src?`<div class="src">📖 ${esc(s.src)}</div>`:''}
      ${s.miscon||s.record?`<div class="diag"><b>대표 오개념</b> ${esc(s.miscon)}<br><b>선생님·부모님 기록 문장</b> ${esc(s.record)}</div>`:''}
      <div class="ai"><div class="t">AI 채점 시험</div>${s.half?c('절반 답',s.half,r.half):'<div class="case"><span class="who">절반 답</span>(아이디어가 하나뿐인 칸이라 없음)</div>'}${flip?`<span class="flip">⚠ 같은 답을 한 번 더 채점하니 "${V[r.half2.verdict]}" — 판정 흔들림</span>`:''}${c(s.wrongKind==='applied'?'틀린 답(적용 오류 기대)':'틀린 답',s.wrong,r.wrong)}${c('모범 답',null,r.full)}</div>
    </div></div>`;
  }).join('');
  html+=`<details class="lad"${L.summary?' open':''}><summary>${L.summary?'<span class="sumtag">대단원 종합</span> ':''}${esc(L.small)} <span class="cnt">칸 ${L.steps.length}</span>${warns?`<span class="warn">확인 ${warns}</span>`:''}</summary>${steps}</details>`;
});
document.getElementById('list').innerHTML=html;
document.getElementById('lead').textContent = '소단원 '+ladders.length+'개 · 칸 '+S.steps+'개. 소단원 이름을 누르면 펼쳐져요. 주황색 "확인" 표시는 AI 채점이 예상과 다르게 나온 칸이에요.';
document.getElementById('summary').innerHTML = `<h2>AI 채점 시험 요약 (실제 앱 서버)</h2><ul>
  <li>모범 답 → 통과: <b>${S.full} / ${S.steps}</b></li>
  <li>절반 답(핵심 하나를 담은 답) → 일부: <b>${S.half} / ${S.halfN}</b> <span class="cnt">(아이디어가 하나뿐인 칸은 절반 답 없음)</span></li>
  <li>틀린 답 → 기대한 진단(못 맞힘 또는 적용 오류): <b>${S.wrongOk} / ${S.steps}</b> <span class="cnt">(그중 적용 오류 ${S.applied})</span></li>
  <li>같은 절반 답을 두 번 채점해 판정이 달라진 칸: <b>${S.flip} / ${S.halfN}</b></li></ul>
  <p style="margin:8px 0 0;font-size:13px;color:var(--sub)">판정은 네 단계예요: <b>통과</b>(핵심 모두) · <b>일부</b>(핵심 일부만) · <b>적용 오류</b>(방법은 맞고 적용이 틀림) · <b>못 맞힘</b>(방법도 결론도 틀림). 칸마다 대표 오개념과, 학생이 틀렸을 때 선생님·부모님께 남길 기록 문장을 붙였어요.</p>`;
})();
</script>
