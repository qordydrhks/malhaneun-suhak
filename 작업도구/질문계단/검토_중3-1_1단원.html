<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>질문 계단 검토</title>
<style>
  :root{--bg:#f6f5f1;--card:#fff;--ink:#23221f;--sub:#6b6a64;--line:#e4e2da;--blue:#185FA5;--orange:#D85A30;--green:#2f9e76;--purple:#534AB7;--soft:#eef3f9}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Malgun Gothic",sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:23px;margin:0 0 4px}
  .lead{color:var(--sub);margin:0 0 16px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 16px}

  .box ul{margin:0;padding-left:20px}
  .mid{font-size:18px;font-weight:700;margin:26px 0 10px;color:var(--blue)}
  details.lad{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden}
  details.lad summary{padding:12px 18px;cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  details.lad summary::-webkit-details-marker{display:none}
  details.lad summary::before{content:'▸';color:var(--sub)}
  details.lad[open] summary::before{content:'▾'}
  .cnt{font-size:12px;font-weight:600;color:var(--sub)}
  .warn{font-size:11px;font-weight:700;color:#fff;background:var(--orange);border-radius:5px;padding:0 6px}
  .step{display:grid;grid-template-columns:34px 1fr;gap:0 10px;padding:14px 18px;border-top:1px solid var(--line)}
  .n{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--blue);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
  .kind{font-size:11px;font-weight:700;color:var(--purple);background:#efedfb;border-radius:5px;padding:0 6px;margin-right:6px;vertical-align:1px}
  .q{font-weight:600}
  .fig{font-size:12px;font-weight:700;color:var(--orange);margin-left:6px;white-space:nowrap}
  .lbl{font-size:12px;font-weight:700;margin:8px 0 2px}
  .ideas{margin:0;padding:0;list-style:none}
  .ideas li{font-size:14px;display:grid;grid-template-columns:22px 1fr;gap:4px;margin:3px 0}
  .ideas li i{font-style:normal;font-weight:700;color:var(--green)}
  .ideas .hq{display:block;color:var(--orange);font-size:13px}
  .teach{font-size:14px;background:#f7f9fc;border-radius:8px;padding:6px 9px}
  .again{font-size:14px;color:var(--purple)}
  .src{font-size:12px;color:var(--sub);margin-top:4px}
  .ai{margin-top:10px;border:1px dashed #cfd8e3;border-radius:10px;padding:8px 10px;background:#fbfcfe}
  .ai .t{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:4px}
  .case{font-size:13.5px;padding:5px 0;border-top:1px solid #edf0f4}
  .case:first-of-type{border-top:none}
  .who{font-weight:700;margin-right:4px}
  .v{font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;margin-left:4px}
  .v.pass{background:#e3f4ec;color:var(--green)} .v.partial{background:#fff3dc;color:#9a6a00} .v.applied{background:#efedfb;color:var(--purple)} .v.none{background:#fdeee8;color:var(--orange)}
  .diag{margin-top:8px;font-size:13.5px;background:#fdf8f2;border-radius:8px;padding:6px 9px}
  .diag b{color:#8a5a1a}
  .sumtag{font-size:11px;font-weight:700;color:#fff;background:var(--purple);border-radius:5px;padding:0 6px}
  .say{display:block;margin-top:2px;color:#2b3a4a}
  .flip{display:block;font-size:12px;font-weight:700;color:var(--orange)}
</style>

", "fig": false, "src": "22쪽", "half": "루트 16은 16의 양의 제곱근이니까 양수 하나예요", "wrong": "루트 16은 4와 −4예요", "miscon": "√16을 ±4로 봄", "record": "√a와 \"a의 제곱근\"을 구분하지 못해 부호를 틀림"}, {"kind": "함정", "q": "√0.04를 근호 없이 나타낼 때 0.2와 0.02 중 무엇일까? 어떻게 확인해?", "ideas": [["제곱해서 0.04가 되는 양수를 찾는다", "√0.04는 어떤 수를 제곱했을 때 0.04가 되는 수야?"], ["후보를 직접 제곱해 보면 0.02를 제곱하면 0.0004라서 0.2가 맞다", "0.02를 제곱하면 0.04가 될까?"]], "teach": "√0.04는 제곱해서 0.04가 되는 양수야. 0.2²=0.04 이고 0.02²=0.0004 라서 √0.04=0.2. 소수는 자릿수가 헷갈리니 제곱해서 확인해.", "again": "√0.09를 근호 없이 나타낼 때 확인하는 방법을 말해 봐.", "fig": false, "src": "22쪽 예제 4", "half": "제곱해서 0.04가 되는 양수를 찾으면 돼요", "wrong": "0.04에서 소수점 자리를 반으로 줄여서 0.02예요", "miscon": "소수의 제곱근을 자릿수만 보고 짐작함", "record": "소수의 제곱근을 제곱해서 확인하지 않아 자릿수를 틀림"}]}, {"grade": "m3-1", "big": "1. 실수와 그 계산", "middle": "1. 제곱근과 실수", "small": "05. 3의 제곱근과 제곱근 3은 어떻게 다를까?", "steps": [{"kind": "함정", "q": "\"3의 제곱근\"과 \"제곱근 3\"은 어떻게 다를까? 기호로는 각각 어떻게 써?", "ideas": [["\"3의 제곱근\"은 제곱해서 3이 되는 수 두 개로 ±√3이다", "제곱해서 3이 되는 수는 몇 개일까?"], ["\"제곱근 3\"은 √3을 읽은 말로 3의 양의 제곱근 √3 하나이다", "√3을 소리 내어 읽으면 어떻게 읽지?"]], "teach": "\"3의 제곱근\"은 제곱해서 3이 되는 수라서 √3과 −√3, 두 개야. \"제곱근 3\"은 기호 √3을 읽는 이름이라 √3 하나야.", "again": "\"7의 제곱근\"과 \"제곱근 7\"을 기호로 각각 말해 봐.", "fig": false, "src": "22쪽", "half": "3의 제곱근은 플러스 마이너스 루트 3 두 개예요", "wrong": "둘 다 루트 3이에요", "miscon": "\"3의 제곱근\"과 \"제곱근 3\"을 같은 것으로 봄", "record": "\"a의 제곱근\"(±√a)과 \"제곱근 a\"(√a)를 구분하지 못함"}, {"kind": "적용", "q": "\"√16의 제곱근\"을 구할 때 무엇부터 해야 하고, 틀리기 쉬운 점은 뭘까?", "ideas": [["√16을 먼저 근호 없이 4로 바꾼다", "√16은 근호 없이 어떤 수지?"], ["4의 제곱근을 구해야 하므로 ±2이고, ±4라고 하면 틀린다", "제곱근을 구할 대상이 16일까, 4일까?"]], "teach": "\"√16의 제곱근\"은 √16=4 의 제곱근이야. 그러니 ±2가 답이고, 16의 제곱근인 ±4와 헷갈리면 안 돼.", "again": "\"√81의 제곱근\"을 구하는 순서를 말해 봐.", "fig": false, "src": "22쪽", "half": "루트 16을 먼저 4로 바꿔요", "wrong": "±4예요", "miscon": "√16의 제곱근을 16의 제곱근(±4)으로 착각함", "record": "제곱근을 구할 대상(√16=4)을 먼저 정리하지 않음"}]}, {"grade": "m3-1", "big": "1. 실수와 그 계산", "middle": "1. 제곱근과 실수", "small": "06. a>0일 때, (√a)², √(a²)의 값은?", "steps": [{"kind": "성질", "q": "a>0일 때 (√a)²과 √(a²)은 각각 무엇이 되고, 그 이유는 뭘까?", "ideas": [["√a는 제곱하면 a가 되는 수라서 (√a)²=a이다", "√a는 무엇을 제곱했을 때 a가 되는 수였지?"], ["√(a²)은 a²의 양의 제곱근인데 a>0이므로 a이다", "제곱해서 a²이 되는 양수는 무엇일까?"]], "teach": "√a는 a의 제곱근이니까 제곱하면 a로 돌아와. √(a²)은 a²의 양의 제곱근인데 a가 양수라서 a야. √와 제곱이 만나면 근호가 사라지는 셈이야.", "again": "(√7)²과 √(7²)이 모두 7이 되는 이유를 말해 봐.", "fig": false, "src": "23쪽", "half": "루트 a는 제곱하면 a가 되는 수라서 루트 a 제곱은 a예요", "wrong": "(√a)²은 a²이에요", "miscon": "(√a)²을 a²으로 계산함", "record": "(√a)²=a, √(a²)=a가 되는 이유를 제곱근의 뜻으로 설명하지 못함"}, {"kind": "성질", "q": "a>0일 때 (−√a)²과 √((−a)²)도 a가 되는 이유를 말해 봐.", "ideas": [["−√a도 a의 제곱근이라서 제곱하면 a가 된다", "−√a는 a의 어떤 제곱근이지?"], ["(−a)²은 a²과 같아서 근호를 씌우면 양수 a가 된다", "(−a)²과 a²은 서로 같을까?"]], "teach": "−√a는 a의 음의 제곱근이라 제곱해도 a야. (−a)²=a² 이니까 √((−a)²)=√(a²)=a. 제곱이 − 부호를 + 로 바꿔 줘.", "again": "(−√3)²과 √((−3)²)이 모두 3인 이유를 말해 봐.", "fig": false, "src": "23쪽", "half": "마이너스 루트 a도 a의 제곱근이라서 제곱하면 a예요", "wrong": "√((−a)²)은 −a예요", "miscon": "√((−a)²)의 − 부호가 그대로 남는다고 생각함", "record": "제곱이 − 부호를 없앤다는 것을 제곱근 계산에 연결하지 못함"}, {"kind": "방법", "q": "5를 근호를 사용해 나타내면 √25가 되는 이유와, −5는 어떻게 나타내는지 말해 봐.", "ideas": [["근호 안에 그 수의 제곱인 수를 넣어 5=√(5²)=√25로 나타낸다", "√ 안에 무엇을 넣어야 근호를 벗겼을 때 5가 나올까?"], ["음수는 − 부호를 근호 밖에 두어 −5=−√25로 나타낸다", "−5를 나타낼 때 − 부호는 근호 안과 밖 중 어디에 둬야 할까?"]], "teach": "근호를 없애는 것과 반대로, 근호 안에 그 수의 제곱을 쓰면 돼: 5=√25. 음수는 − 를 밖에 둬서 −5=−√25. 근호 안에 −25를 넣으면 안 돼.", "again": "−3을 근호를 사용해 나타낼 때 조심할 점을 말해 봐.", "fig": false, "src": "24쪽", "half": "5를 제곱한 25를 근호 안에 넣어요", "wrong": "−5는 루트 마이너스 25예요", "miscon": "음수를 근호 안에 넣어 √(−25)로 씀", "record": "근호 밖의 − 부호를 근호 안으로 넣으면 안 된다는 것을 모름"}]}, {"grade": "m3-1", "big": "1. 실수와 그 계산", "middle": "1. 제곱근과 실수", "small": "07. a<0일 때, √(a²)의 값은?", "steps": [{"kind": "성질", "q": "a<0일 때 √(a²)이 a가 아니라 −a가 되는 이유를 말해 봐.", "ideas": [["√로 나타낸 값은 양의 제곱근이라 항상 0 이상이다", "√(a²)은 a²의 양의 제곱근일까, 음의 제곱근일까?"], ["a가 음수이면 부호를 바꾼 −a가 양수이므로 √(a²)=−a이다", "a가 음수일 때 a와 −a 중 양수는 어느 쪽이지?"]], "teach": "√(a²)은 양의 제곱근이라 결과가 양수여야 해. a<0 이면 a는 음수라 답이 될 수 없고, 부호를 바꾼 −a 가 양수야. 예: a=−3 이면 √9=3=−(−3).", "again": "a=−2일 때 √(a²)을 a로 쓰면 왜 틀리는지 말해 봐.", "fig": false, "src": "24쪽", "half": "루트로 나타낸 값은 항상 0 이상이에요", "wrong": "√와 제곱이 만나면 사라지니까 a예요", "miscon": "√와 제곱은 부호와 관계없이 무조건 지워진다고 생각함", "record": "√(a²) 공식은 기억하지만, a<0일 때 결과가 −a가 되는 이유를 설명하지 못함"}, {"kind": "방법", "q": "0<a<1일 때 √((a−2)²)을 근호 없이 간단히 하려면 먼저 무엇을 확인하고 어떻게 정리해?", "ideas": [["제곱된 식 a−2가 양수인지 음수인지 먼저 확인한다", "a가 0과 1 사이면 a−2는 양수일까, 음수일까?"], ["a−2가 음수이므로 부호를 바꾼 −(a−2), 즉 −a+2로 나타낸다", "제곱된 식이 음수이면 근호를 벗길 때 무엇을 붙여야 할까?"]], "teach": "근호 안이 문자식의 제곱이면 그 식의 부호부터 봐. 0<a<1 이면 a−2<0 이라서 √((a−2)²)=−(a−2)=−a+2. 양수였다면 그대로 나와.", "again": "√((a−2)²)을 간단히 할 때 a−2의 부호를 먼저 따져야 하는 이유를 말해 봐.", "fig": false, "src": "24쪽 예제 7", "half": "a−2가 양수인지 음수인지 먼저 봐요", "wrong": "a−2 그대로 나와요", "miscon": "제곱된 식의 부호를 보지 않고 그대로 꺼냄", "record": "근호 안에서 제곱된 식의 부호를 확인해야 한다는 것을 적용하지 못함"}]}, {"grade": "m3-1", "big": "1. 실수와 그 계산", "middle": "1. 제곱근과 실수", "small": "08. √((-3)²)+(-√10)²-√25를 계산하면?", "steps": [{"kind": "방법", "q": "√((−3)²)+(−√10)²−√25 같은 식을 계산할 때 어떤 성질을 어떤 순서로 쓰는지 말해 봐.", "ideas": [["제곱근의 성질로 각 항의 근호를 먼저 없애 근호가 없는 수로 바꾼다", "√((−3)²), (−√10)², √25를 각각 근호 없이 나타낼 수 있을까?"], ["그다음 보통의 덧셈·뺄셈을 한다", "근호가 모두 없어지면 식은 어떤 계산이 될까?"]], "teach": "각 항을 제곱근의 성질로 근호 없는 수로 바꾸면 √((−3)²)=3, (−√10)²=10, √25=5. 그러면 3+10−5 인 보통 계산이 돼.", "again": "√(11²)+(−√7)²−√36을 계산하는 순서를 말해 봐.", "fig": false, "src": "25쪽", "half": "근호를 먼저 없애서 보통 수로 바꿔요", "wrong": "근호 안끼리 먼저 더해요", "miscon": "근호 안의 수끼리 먼저 더하거나 뺌", "record": "제곱근의 성질로 근호를 먼저 없애는 순서를 모름"}, {"kind": "함정", "q": "√((−3)²)을 −3이라고 쓰면 왜 틀릴까?", "ideas": [["(−3)²=9이고 √9는 9의 양의 제곱근이라 3이다", "(−3)²은 얼마고, 그 수의 양의 제곱근은 무엇이지?"]], "teach": "근호 안부터 보면 (−3)²=9 야. √9는 양의 제곱근이라 3. √와 제곱이 만나 사라질 때 − 부호까지 그대로 남는 게 아니라 양수가 나와.", "again": "√((−7)²)의 값이 양수가 되는 이유를 말해 봐.", "fig": false, "src": "25쪽", "wrong": "√와 제곱이 만나면 사라져서 −3이 맞아요", "miscon": "√((−3)²)=−3 처럼 부호를 그대로 둠", "record": "√((−3)²)이 양수 3이 되는 이유를 설명하지 못함"}]}, {"grade": "m3-1", "big": "1. 실수와 그 계산", "middle": "1. 제곱근과 실수", "small": "09. √(3×x)가 자연수가 되도록 하는 가장 작은 자연수 x의 값은?", "steps": [{"kind": "이유", "q": "√(3×x)가 자연수가 되려면 근호 안의 3×x는 어떤 수여야 하고, 그 수는 소인수분해하면 어떤 특징이 있어?", "ideas": [["3×x가 제곱수여야 한다", "√9=3 처럼 근호가 없어지려면 근호 안이 어떤 수여야 할까?"], ["제곱수를 소인수분해하면 모든 소인수의 지수가 짝수이다", "36=2²×3² 처럼 제곱수를 소인수분해하면 지수에 어떤 특징이 있어?"]], "teach": "√(제곱수)=자연수 라서 근호 안이 1, 4, 9, 16… 같은 제곱수여야 해. 제곱수는 소인수분해하면 지수가 모두 짝수야(36=2²×3²).", "again": "√(5×x)가 자연수가 되기 위한 조건을 말해 봐.", "fig": false, "src": "25쪽", "half": "근호 안의 3×x가 제곱수여야 해요", "wrong": "3의 배수면 돼요", "miscon": "3의 배수이면 된다고 생각함", "record": "근호 안이 제곱수(소인수의 지수가 모두 짝수)여야 한다는 조건을 모름"}, {"kind": "방법", "q": "√(18×x)가 자연수가 되도록 하는 가장 작은 자연수 x는 어떻게 찾아?", "ideas": [["18을 소인수분해해서 2×3²으로 나타낸다", "18을 소인수분해하면 어떻게 되지?"], ["지수가 홀수인 소인수만 곱해서 모든 지수를 짝수로 만든다", "2×3² 에서 지수가 홀수인 소인수는 무엇이고, 무엇을 곱하면 짝수가 될까?"]], "teach": "18=2×3² 에서 3은 이미 지수가 짝수, 2만 홀수야. 2를 한 번 더 곱하면 2²×3² 인 제곱수가 되니까 가장 작은 x는 2야. 18을 곱해도 제곱수지만 가장 작지는 않아.", "again": "√(12×x)가 자연수가 되는 가장 작은 x를 찾는 방법을 말해 봐.", "fig": false, "src": "26쪽 예제 9", "half": "18을 소인수분해하면 2 곱하기 3의 제곱이에요", "wrong": "18에 18을 곱하면 되니까 18이에요", "miscon": "18을 곱하면 된다고 생각함(가장 작은 수 조건 무시)", "record": "지수가 홀수인 소인수만 곱해 가장 작은 수를 찾는 방법을 모름"}, {"kind": "함정", "q": "√(20−x)가 자연수가 되는 가장 작은 자연수 x를 구할 때는 √(20×x)와 방법이 어떻게 달라?", "ideas": [["20−x가 20보다 작은 제곱수(1, 4, 9, 16) 중 하나가 되어야 한다", "20−x는 20보다 클까, 작을까? 그 범위의 제곱수는 뭐가 있어?"], ["x가 가장 작으려면 20−x가 그중 가장 큰 제곱수 16이 되어야 한다", "x를 작게 하려면 20−x는 커야 할까, 작아야 할까?"]], "teach": "빼기 꼴은 소인수분해가 아니라 \"20−x 가 제곱수\"인 경우를 따져. 20보다 작은 제곱수는 1, 4, 9, 16 이고, x가 가장 작으려면 20−x가 가장 커야 하니 16, 즉 x=4.", "again": "√(30−x)가 자연수가 되는 가장 작은 x를 찾는 방법을 말해 봐.", "fig": false, "src": "26쪽 예제 9", "half": "20−x가 20보다 작은 제곱수가 돼야 해요", "wrong": "소인수분해해서 지수를 짝수로 만들어요", "miscon": "뺄셈 꼴에도 소인수분해 방법을 그대로 씀", "record": "√(20−x) 꼴에서는 20보다 작은 제곱수를 따져야 한다는 것을 구분하지 못함"}]}, {"grade": "m3-1", "big": "1. 실수와 그 계산", "middle": "1. 제곱근과 실수", "small": "10. 제곱근의 대소 관계는 어떻게 알 수 있을까?", "steps": [{"kind": "성질", "q": "a>0, b>0일 때 √a와 √b의 크기는 어떻게 비교하고, 정사각형으로 보면 왜 그럴까?", "ideas": [["a<b이면 √a<√b, 근호 안의 수가 클수록 제곱근이 크다", "근호 안의 수 3과 5 중 큰 쪽의 제곱근이 더 클까?"], ["넓이가 a, b인 정사각형의 한 변이 √a, √b인데 넓이가 넓을수록 한 변도 길다", "넓이가 더 넓은 정사각형은 한 변도 더 길까?"]], "teach": "넓이가 3, 5인 정사각형의 한 변은 √3, √5야. 넓을수록 한 변이 길어서 3<5 이면 √3<√5. 거꾸로 √a<√b 이면 a<b 도 성립해.", "again": "√6과 √7의 크기를 비교하는 방법과 이유를 말해 봐.", "fig": true, "src": "26~27쪽", "half": "근호 안의 수가 클수록 제곱근도 커요", "wrong": "근호 안의 수가 크면 제곱근은 작아져요", "miscon": "근호 안의 수가 크면 제곱근은 작다고 생각함", "record": "제곱근의 대소를 근호 안의 수로 비교하는 이유(정사각형의 넓이와 한 변)를 설명하지 못함"}, {"kind": "방법", "q": "√5와 2처럼 근호가 있는 수와 없는 수의 크기는 어떻게 비교해?", "ideas": [["근호가 없는 수를 근호가 있는 수로 바꾼다(2=√4)", "2를 근호를 사용해 나타내면 어떻게 될까?"], ["두 수의 근호 안의 수를 비교한다", "√5와 √4는 무엇을 비교하면 될까?"]], "teach": "2=√4 로 바꾸면 √5와 √4 비교가 돼. 5>4 이니까 √5>2. 근호가 없는 수를 근호 안으로 넣어 같은 모양으로 맞추는 게 핵심이야.", "again": "3과 √10의 크기를 비교하는 방법을 말해 봐.", "fig": false, "src": "27쪽 예제 10", "half": "2를 루트 4로 바꿔요", "wrong": "√5는 5니까 2보다 커요", "miscon": "√5를 5로 보고 비교함", "record": "근호가 없는 수를 근호로 바꿔 비교하는 방법을 모름"}, {"kind": "함정", "q": "−√2와 −√3 중 어느 수가 더 클까? 양수일 때와 무엇이 달라?", "ideas": [["√2<√3이지만 음수가 되면 크기가 거꾸로 되어 −√2>−√3이다", "−2와 −3 중 어느 쪽이 더 큰지 떠올려 봐."], ["음수는 근호 안의 수가 작을수록 더 크다", "음수끼리는 절댓값이 클수록 크기가 어떻게 되지?"]], "teach": "양수일 때는 근호 안이 클수록 크지만, 음수는 절댓값이 클수록 작아. √2<√3 이니까 −√2>−√3.", "again": "−√5와 −√7 중 더 큰 수를 고르는 방법을 말해 봐.", "fig": false, "src": "27쪽", "half": "음수는 근호 안의 수가 작을수록 커요", "wrong": "마이너스 루트 3이 더 커요 3이 크니까요", "miscon": "음수도 근호 안이 클수록 크다고 생각함", "record": "음수인 제곱근의 대소가 거꾸로 된다는 것을 적용하지 못함"}]}, {"grade": "m3-1", "big": "1. 실수와 그 계산", "middle": "1. 제곱근과 실수", "small": "11. 무리수와 실수는 어떤 수인가?", "steps": [{"kind": "뜻", "q": "무리수는 어떤 수이고, 실수는 어떤 수를 말해?", "ideas": [["무리수는 유리수가 아닌 수로, 순환하지 않는 무한소수로 나타나는 수이다", "분수로 나타낼 수 없는 소수는 어떤 소수였지?"], ["실수는 유리수와 무리수를 통틀어 이르는 말이다", "유리수와 무리수를 한꺼번에 부르는 이름이 뭐지?"]], "teach": "유한소수와 순환소수는 분수로 나타낼 수 있는 유리수야. 순환하지 않는 무한소수는 분수로 나타낼 수 없어서 무리수라고 해. 유리수와 무리수를 합쳐 실수라고 불러.", "again": "√2가 무리수인 이유와, √2가 실수에도 속하는 이유를 말해 봐.", "fig": false, "src": "29~30쪽", "half": "무리수는 순환하지 않는 무한소수로 나타나는 수예요", "wrong": "무한소수는 모두 무리수예요", "miscon": "무한소수를 모두 무리수로 봄", "record": "무리수와 실수의 뜻을 구분해 말하지 못함"}, {"kind": "함정", "q": "\"무한소수는 모두 무리수이다\"는 왜 틀린 말일까?", "ideas": [["무한소수 중 순환소수는 분수로 나타낼 수 있어서 유리수이다", "0.333…은 분수로 나타낼 수 있을까?"], ["무한소수 중 순환하지 않는 것만 무리수이다", "무리수가 되려면 무한소수 중에서도 어떤 조건이 필요할까?"]], "teach": "0.333…=1/3 처럼 순환소수는 끝이 없어도 분수로 쓸 수 있어서 유리수야. 무리수는 무한소수 중에서도 순환하지 않는 것뿐이야.", "again": "0.121212…가 무리수가 아닌 이유를 말해 봐.", "fig": false, "src": "31쪽 예제 11", "half": "순환소수는 분수로 나타낼 수 있어서 유리수예요", "wrong": "끝이 없는 소수니까 무리수 맞아요", "miscon": "끝이 없는 소수는 모두 무리수라고 생각함", "record": "순환소수와 순환하지 않는 무한소수를 구분하지 못함"}, {"kind": "적용", "q": "π와 3+√2가 무리수인 이유를 말해 봐.", "ideas": [["π는 순환하지 않는 무한소수이다", "π=3.141592…는 어떤 소수일까?"], ["3+√2는 유리수 3에 무리수 √2를 더해서 소수 부분이 순환하지 않는다", "√2=1.414…에 3을 더하면 소수 부분이 순환하게 될까?"]], "teach": "π는 소수점 아래가 순환하지 않고 끝없이 이어져서 무리수야. 3+√2=4.414… 로 √2의 소수 부분이 그대로 남아 순환하지 않으니 역시 무리수야.", "again": "1−√3이 무리수인지 판단하는 방법을 말해 봐.", "fig": false, "src": "31쪽 예제 11", "half": "파이는 순환하지 않는 무한소수예요", "wrong": "3+√2는 3이 유리수라서 유리수예요", "miscon": "유리수를 더하면 유리수가 된다고 생각함", "record": "유리수와 무리수의 합이 무리수인 이유를 설명하지 못함"}]}, {"grade": "m3-1", "big": "1. 실수와 그 계산", "middle": "1. 제곱근과 실수", "small": "12. √9는 유리수일까? 무리수일까?", "steps": [{"kind": "함정", "q": "√9를 \"근호가 있으니까 무리수\"라고 하면 왜 틀릴까?", "ideas": [["근호 안의 수가 제곱수이면 근호를 없앨 수 있다", "9는 어떤 수의 제곱이지?"], ["√9=3이므로 분수로 나타낼 수 있는 유리수이다", "√9를 근호 없이 나타낸 수는 분수로 나타낼 수 있을까?"]], "teach": "근호가 있다고 다 무리수는 아니야. 9=3² 이라 √9=3 으로 근호가 없어지고, 3은 유리수야.", "again": "√4가 유리수인 이유를 말해 봐.", "fig": false, "src": "31쪽", "half": "9는 3의 제곱이라서 근호를 없앨 수 있어요", "wrong": "근호가 붙어 있으면 다 무리수예요", "miscon": "근호가 붙으면 모두 무리수라고 생각함", "record": "근호가 있어도 근호 안이 제곱수면 유리수라는 것을 모름"}, {"kind": "방법", "q": "근호가 있는 수가 유리수인지 무리수인지 판단하는 방법을 √0.04와 √0.4로 설명해 봐.", "ideas": [["근호 안의 수가 어떤 유리수의 제곱인지 확인한다", "0.04와 0.4 중 어떤 유리수를 제곱해서 나오는 수는?"], ["근호 안이 0 이상의 유리수일 때, 어떤 유리수의 제곱이면 그 제곱근은 유리수이고 아니면 무리수이다", "근호를 없앨 수 없으면 그 수는 어떤 수가 될까?"]], "teach": "근호 안이 0 이상의 유리수일 때 판단법이야. 0.04=0.2² 이라 √0.04=0.2 는 유리수. 0.4는 어떤 유리수의 제곱도 아니라 √0.4는 근호를 없앨 수 없는 무리수야.", "again": "√(1/4)과 √(1/2) 중 유리수인 것을 고르는 방법을 말해 봐.", "fig": false, "src": "31쪽", "half": "근호 안의 수가 어떤 유리수의 제곱인지 확인해요", "wrong": "√0.4는 소수라서 유리수예요", "miscon": "소수로 적힌 수의 제곱근은 모두 유리수라고 봄", "record": "근호 안이 유리수의 제곱인지로 유리수·무리수를 판정하지 못함"}]}, {"grade": "m3-1", "big": "1. 실수와 그 계산", "middle": "1. 제곱근과 실수", "small": "13. 제곱근의 값을 어림하여 정리해 놓은 표가 있다?", "steps": [{"kind": "방법", "q": "제곱근표는 어떤 표이고, √1.34의 어림값은 표에서 어떻게 찾아?", "ideas": [["1.00부터 99.9까지의 수의 양의 제곱근을 어림해 정리한 표이다", "제곱근표에는 어떤 범위의 수의 제곱근이 적혀 있지?"], ["왼쪽 세로줄에서 1.3을, 위쪽 가로줄에서 4를 찾아 만나는 칸의 수를 읽는다", "1.34를 1.3과 4로 나누면 각각 표의 어디에서 찾을까?"]], "teach": "제곱근표는 1.00~99.9 인 수의 양의 제곱근을 반올림해 소수점 아래 셋째 자리까지 적은 표야. √1.34 는 왼쪽 1.3 줄과 위쪽 4 칸이 만나는 1.158 을 읽어.", "again": "√1.45의 어림값을 제곱근표에서 찾는 방법을 말해 봐.", "fig": false, "src": "31~32쪽", "half": "1.00부터 99.9까지 수의 제곱근을 어림해 둔 표예요", "wrong": "1.34를 제곱해서 찾아요", "miscon": "표에서 찾지 않고 직접 제곱해서 찾으려 함", "record": "제곱근표의 범위와 읽는 방법을 모름"}, {"kind": "이유", "q": "무리수를 실생활에서 쓸 때 제곱근표 같은 어림값을 쓰는 이유는 뭘까? 표의 값은 정확한 값일까?", "ideas": [["무리수는 순환하지 않는 무한소수라 정확한 값을 끝까지 쓸 수 없다", "√2를 소수로 쓰면 끝이 날까?"], ["표의 값은 반올림한 어림값이지 정확한 값이 아니다", "제곱근표의 1.158은 √1.34와 완전히 같은 수일까?"]], "teach": "무리수는 소수점 아래가 끝없이 순환하지 않아 정확히 다 쓸 수 없어. 그래서 실생활에서는 어림값을 쓰는데, 표의 1.158 도 반올림한 값이라 √1.34 와 완전히 같지는 않아.", "again": "원주율을 3.14로 계산하는 것과 제곱근표를 쓰는 것이 비슷한 이유를 말해 봐.", "fig": false, "src": "31쪽", "half": "무리수는 끝없이 이어지는 소수라 정확히 다 못 써요", "wrong": "제곱근표 값이 정확한 값이라서요", "miscon": "제곱근표의 값을 정확한 값으로 봄", "record": "어림값과 정확한 값을 구분하지 못함"}]}, {"grade": "m3-1", "big": "1. 실수와 그 계산", "middle": "1. 제곱근과 실수", "small": "14. 무리수를 수직선 위에 어떻게 나타낼 수 있을까?", "steps": [{"kind": "방법", "q": "√2를 수직선 위에 나타내는 방법을 말해 봐.", "ideas": [["한 변이 1인 정사각형의 대각선 길이가 피타고라스 정리로 √2임을 이용한다", "가로 1, 세로 1인 직각삼각형의 빗변의 길이는 얼마일까?"], ["원점을 중심으로 그 대각선을 반지름으로 하는 원을 그려 수직선과 만나는 점을 찾는다", "길이가 √2인 선분을 수직선 위로 옮기려면 무엇을 그리면 될까?"]], "teach": "한 변이 1인 정사각형의 대각선은 √(1²+1²)=√2 야. 원점을 중심으로 그 길이를 반지름으로 원을 그리면 수직선의 오른쪽 점이 √2, 왼쪽 점이 −√2 야.", "again": "√5를 수직선 위에 나타낼 때 어떤 직각삼각형을 쓰는지 말해 봐.", "fig": true, "src": "32쪽", "half": "한 변이 1인 정사각형의 대각선이 피타고라스 정리로 루트 2예요", "wrong": "1.4에 점을 찍어요", "miscon": "어림값 위치에 점을 찍음", "record": "피타고라스 정리와 원을 이용해 무리수의 위치를 정하는 방법을 모름"}, {"kind": "함정", "q": "한 변이 1인 정사각형을 점 1을 꼭짓점으로 그리고 점 1을 중심으로 원을 그렸을 때, 오른쪽 점이 √2가 아니라 1+√2가 되는 이유는?", "ideas": [["원의 중심, 즉 기준점이 0이 아니라 1이다", "원의 중심이 수직선의 어느 점에 있어?"], ["기준점에서 오른쪽으로 √2만큼 가면 1+√2, 왼쪽으로 가면 1−√2이다", "기준점 1에서 왼쪽으로 √2만큼 가면 어떤 수가 될까?"]], "teach": "반지름은 √2 로 같지만 출발점이 1이야. 1에서 오른쪽으로 √2만큼 가면 1+√2, 왼쪽으로 가면 1−√2. 기준점이 어디인지 먼저 봐야 해.", "again": "점 2를 중심으로 반지름 √5인 원을 그렸을 때 수직선과 만나는 두 점을 말해 봐.", "fig": true, "src": "32~33쪽", "half": "원의 중심이 0이 아니라 1이에요", "wrong": "반지름이 √2니까 √2예요", "miscon": "기준점과 상관없이 반지름 값이 곧 좌표라고 생각함", "record": "기준점에서 반지름만큼 이동한다는 것을 좌표에 반영하지 못함"}]}, {"grade": "m3-1", "big": "1. 실수와 그 계산", "middle": "1. 제곱근과 실수", "small": "15. 실수의 대소 관계는 수직선을 이용하면 된다?", "steps": [{"kind": "성질", "q": "수직선과 실수는 어떤 관계이고, 수직선에서 두 실수의 크기는 어떻게 비교해?", "ideas": [["모든 실수는 수직선 위의 한 점에 대응하고, 수직선은 실수로 완전히 메워져 있다", "수직선 위의 점 중에서 실수가 대응하지 않는 점이 있을까?"], ["수직선에서 오른쪽에 있는 수가 왼쪽에 있는 수보다 크다", "수직선에서 더 큰 수는 왼쪽과 오른쪽 중 어디에 있지?"]], "teach": "유리수와 무리수를 합친 실수로 수직선이 빈틈 없이 채워져. 모든 실수가 수직선의 한 점에 대응하니까 크기도 유리수처럼 \"오른쪽이 더 크다\"로 비교해.", "again": "−√3과 −0.2를 수직선에 나타내면 어느 쪽이 더 큰지 말해 봐.", "fig": false, "src": "33~34쪽", "half": "수직선에서 오른쪽에 있는 수가 더 커요", "wrong": "유리수만 수직선에 나타낼 수 있어요", "miscon": "무리수는 수직선에 나타낼 수 없다고 생각함", "record": "실수와 수직선 위의 점이 하나씩 대응한다는 것을 모름"}, {"kind": "방법", "q": "3+√7과 √7+√8의 크기를 어림값을 구하지 않고 어떻게 비교할 수 있어?", "ideas": [["양쪽에 똑같이 있는 √7은 두고 나머지 3과 √8만 비교한다", "두 수에 공통으로 들어 있는 수는 무엇이지?"], ["3=√9이고 √9>√8이므로 3+√7이 더 크다", "3을 근호로 나타내서 √8과 비교해 볼래?"]], "teach": "두 수 모두 √7이 더해져 있으니 나머지만 비교하면 돼(부등식의 성질). 3=√9 >√8 이니까 3+√7>√7+√8.", "again": "−√3+2와 1의 크기를 비교하는 방법을 말해 봐.", "fig": false, "src": "34쪽 예제 14", "half": "양쪽에 똑같이 있는 루트 7은 두고 3과 루트 8만 비교해요", "wrong": "√7+√8은 √15라서 비교해요", "miscon": "√7+√8을 √15로 합침", "record": "공통인 부분을 두고 나머지만 비교하는 방법을 모름"}, {"kind": "성질", "q": "1과 2 사이에 무리수가 몇 개나 있을까? 예를 들어 설명해 봐.", "ideas": [["서로 다른 두 수 사이에는 무리수가 무수히 많다", "1과 2 사이에 √2 말고 무리수가 또 있을까?"], ["두 수 사이에서 무리수를 하나 찾으면, 그 수와 한쪽 끝 사이에서 또 찾을 수 있어 끝없이 이어진다", "1과 √2 사이에도 무리수 <script>

    const r=R[k]||{}; S.steps++;

    if(r.half){S.halfN++; if(r.half.verdict==='partial')S.half++;}
    const wantW = s.wrongKind||'none'; if(r.wrong&&r.wrong.verdict===wantW)S.wrongOk++; if(r.wrong&&r.wrong.verdict==='applied')S.applied++;

    </div></div>`;
  }).join('');
  html+=`<details class="lad"${L.summary?' open':''}><summary>${L.summary?'<span class="sumtag">대단원 종합</span> ':''}${esc(L.small)} <span class="cnt">칸 ${L.steps.length}</span>${warns?`<span class="warn">확인 ${warns}</span>`:''}</summary>${steps}</details>`;
});

document.getElementById('summary').innerHTML = `<h2>AI 채점 시험 요약 (실제 앱 서버)</h2><ul>
