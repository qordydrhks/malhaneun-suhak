<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>질문 계단 검토</title>
<style>
  :root{--bg:#f6f5f1;--card:#fff;--ink:#23221f;--sub:#6b6a64;--line:#e4e2da;--blue:#185FA5;--orange:#D85A30;--green:#2f9e76;--purple:#534AB7;--soft:#eef3f9}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Malgun Gothic",sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:23px;margin:0 0 4px}
  .lead{color:var(--sub);margin:0 0 16px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 16px}
  .box h2{font-size:16px;margin:0 0 8px}
  .box ul{margin:0;padding-left:20px}
  .mid{font-size:18px;font-weight:700;margin:26px 0 10px;color:var(--blue)}
  details.lad{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden}
  details.lad summary{padding:12px 18px;cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  details.lad summary::-webkit-details-marker{display:none}
  details.lad summary::before{content:'▸';color:var(--sub)}
  details.lad[open] summary::before{content:'▾'}
  .cnt{font-size:12px;font-weight:600;color:var(--sub)}
  .warn{font-size:11px;font-weight:700;color:#fff;background:var(--orange);border-radius:5px;padding:0 6px}
  .step{display:grid;grid-template-columns:34px 1fr;gap:0 10px;padding:14px 18px;border-top:1px solid var(--line)}
  .n{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--blue);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
  .kind{font-size:11px;font-weight:700;color:var(--purple);background:#efedfb;border-radius:5px;padding:0 6px;margin-right:6px;vertical-align:1px}
  .q{font-weight:600}
  .fig{font-size:12px;font-weight:700;color:var(--orange);margin-left:6px;white-space:nowrap}
  .lbl{font-size:12px;font-weight:700;margin:8px 0 2px}
  .ideas{margin:0;padding:0;list-style:none}
  .ideas li{font-size:14px;display:grid;grid-template-columns:22px 1fr;gap:4px;margin:3px 0}
  .ideas li i{font-style:normal;font-weight:700;color:var(--green)}
  .ideas .hq{display:block;color:var(--orange);font-size:13px}
  .teach{font-size:14px;background:#f7f9fc;border-radius:8px;padding:6px 9px}
  .again{font-size:14px;color:var(--purple)}
  .src{font-size:12px;color:var(--sub);margin-top:4px}
  .ai{margin-top:10px;border:1px dashed #cfd8e3;border-radius:10px;padding:8px 10px;background:#fbfcfe}
  .ai .t{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:4px}
  .case{font-size:13.5px;padding:5px 0;border-top:1px solid #edf0f4}
  .case:first-of-type{border-top:none}
  .who{font-weight:700;margin-right:4px}
  .v{font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;margin-left:4px}
  .v.pass{background:#e3f4ec;color:var(--green)} .v.partial{background:#fff3dc;color:#9a6a00} .v.applied{background:#efedfb;color:var(--purple)} .v.none{background:#fdeee8;color:var(--orange)}
  .diag{margin-top:8px;font-size:13.5px;background:#fdf8f2;border-radius:8px;padding:6px 9px}
  .diag b{color:#8a5a1a}
  .sumtag{font-size:11px;font-weight:700;color:#fff;background:var(--purple);border-radius:5px;padding:0 6px}
  .say{display:block;margin-top:2px;color:#2b3a4a}
  .flip{display:block;font-size:12px;font-weight:700;color:var(--orange)}
</style>
<div class="wrap">
  <h1 id="title">질문 계단 검토</h1>
  <p class="lead" id="lead"></p>
  <div class="box" id="summary"></div>
  <div id="list"></div>
</div>
<script>
window.REVIEW = {"made":"2026-09-15T16:55:48.994Z","ladders":[{"grade":"m3-1","big":"4. 이차함수","middle":"1. 이차함수와 그 그래프","small":"78. 이차함수란 무엇일까?","steps":[{"kind":"뜻","q":"이차함수는 어떤 함수이고, y=ax²+bx+c가 이차함수가 되려면 어떤 조건이 필요해?","ideas":[["함수 y=f(x)에서 y가 x에 대한 이차식으로 나타내어지는 함수이다","일차함수는 y가 x에 대한 일차식이었지? 이차함수는?"],["x²의 계수 a가 0이 아니어야 하고, b나 c는 0이어도 된다","a=0이면 y=bx+c는 어떤 함수가 되지?"]],"teach":"y가 x에 대한 이차식 ax²+bx+c (a≠0)로 나타내어지면 이차함수야. a=0이면 y=bx+c로 일차함수가 되니까 a≠0이 꼭 필요하고, b·c는 0이어도 x²이 남아 이차함수야.","again":"y=3x²이 이차함수인 이유를 조건을 써서 말해 봐.","fig":false,"src":"190~191쪽","wrong":"x²이 식에 보이면 이차함수예요","miscon":"식을 정리하지 않고 x²이 보이면 이차함수라고 봄","record":"이차함수의 뜻과 a≠0 조건을 설명하지 못함","half":"y가 x에 대한 이차식인 함수예요"},{"kind":"함정","q":"y=x²−(x−1)²이나 y=3/(x²+1)은 겉보기에 x²이 있는데도 이차함수가 아니야. 각각 왜 그럴까?","ideas":[["y=x²−(x−1)²은 전개해 정리하면 x²이 없어져 y=2x−1인 일차함수가 된다","(x−1)²을 전개해서 빼면 x² 항은 어떻게 돼?"],["y=3/(x²+1)은 분모에 x가 있어 x에 대한 이차식(다항식)이 아니다","분모에 x가 있는 식도 이차식이라고 할 수 있을까?"]],"teach":"이차함수인지는 우변을 정리한 뒤 판단해. x²−(x²−2x+1)=2x−1이라 일차함수야. 3/(x²+1)은 분수 꼴이라 다항식이 아니어서 이차함수가 아니야.","again":"y=x(x+3)/2가 이차함수인지 판단하는 방법을 말해 봐.","fig":false,"src":"191쪽 예제 1","wrong":"x²이 있으니까 둘 다 이차함수예요","miscon":"정리 전 겉모양이나 분모의 x²을 보고 판단함","record":"우변을 정리하고 다항식인지 확인해 이차함수를 판별하지 못함","half":"전개하면 x²이 없어져서 일차함수예요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"1. 이차함수와 그 그래프","small":"79. 이차함수 f(x)=x²-5x에 대하여 f(2)의 값은?","steps":[{"kind":"뜻","q":"f(2)는 무엇을 뜻하고, 이차함수 f(x)=x²−5x에서 f(2)는 어떻게 구해?","ideas":[["f(2)는 x=2일 때의 함숫값이다","f(2)의 괄호 안 2는 x에 넣는 수일까, y의 값일까?"],["식의 x 자리에 2를 대입해 계산한다","x²−5x에서 x를 모두 2로 바꾸면 어떻게 되지?"]],"teach":"f(2)는 \"x=2를 넣었을 때 나오는 y의 값\"이야. x 자리에 모두 2를 넣어 2²−5×2=−6. 입력에 2를 넣으면 −6이 나오는 기계라고 생각하면 돼.","again":"f(x)=−x²+2x−3에서 f(−1)을 구하는 방법을 말해 봐.","fig":false,"src":"192쪽","wrong":"f(2)는 f에 2를 곱한 값이에요","miscon":"f(2)를 f×2로 봄","record":"함숫값 f(a)의 뜻(x=a일 때의 y값)을 설명하지 못함","half":"x에 2를 넣었을 때 y의 값이에요"},{"kind":"함정","q":"f(x)=−x²+2x−3에서 f(−1)을 구할 때 −1²으로 계산하면 왜 틀릴까?","ideas":[["음수를 대입할 때는 괄호를 씌워 (−1)²으로 계산해야 한다","−1²과 (−1)²은 같은 값일까?"],["식의 앞에 있는 −는 제곱을 한 뒤에 붙이므로 −(−1)²=−1이다","−x²에서 x=−1이면 먼저 제곱하고 −를 붙일까, −를 먼저 붙일까?"]],"teach":"x=−1을 넣을 때는 괄호가 필요해: −(−1)²+2×(−1)−3=−1−2−3=−6. 괄호 없이 넣으면 부호를 틀리기 쉬워.","again":"f(x)=x²−4에서 f(−3)을 구할 때 조심할 점을 말해 봐.","fig":false,"src":"193쪽 예제 3","wrong":"−1²은 1이니까 그대로 넣으면 돼요","miscon":"음수를 괄호 없이 대입함","record":"음수를 대입할 때 괄호와 부호를 정확히 처리하지 못함","half":"음수는 괄호를 씌워서 넣어요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"1. 이차함수와 그 그래프","small":"80. 이차함수 f(x)=x²-5x에 대하여 f(a)=-6일 때, a의 값은?","steps":[{"kind":"방법","q":"f(x)=x²−5x에서 f(a)=−6일 때 a는 어떻게 구하고, f(2)를 구하는 문제와 무엇이 달라?","ideas":[["f(a)=−6은 x=a일 때 함숫값이 −6이라는 뜻이라 a²−5a=−6을 세운다","f(a)=−6을 식으로 쓰면 어떻게 될까?"],["출력값을 주고 입력값을 묻는 것이라 a에 대한 이차방정식을 풀어야 한다","f(2)는 입력을 주고 출력을 묻는 거였지? 이번엔 반대일까?"]],"teach":"f(2)는 입력 2를 넣어 출력을 구하지만, f(a)=−6은 출력 −6을 알려 주고 입력 a를 묻는 거야. a²−5a+6=0 → (a−2)(a−3)=0 → a=2 또는 3.","again":"f(x)=3x²+5x−1에서 f(k)=1일 때 k를 구하는 방법을 말해 봐.","fig":false,"src":"193쪽","wrong":"a에 −6을 넣어서 계산해요","miscon":"함숫값 조건을 대입 계산으로 착각함","record":"함숫값이 주어졌을 때 방정식을 세워 입력값을 구하지 못함","half":"a²−5a=−6이라는 식을 세워요"},{"kind":"함정","q":"f(k)=1을 풀었더니 k=−2 또는 k=1/3이 나왔는데 문제에 \"양수 k\"라고 쓰여 있어. 답은 무엇이고, 이런 조건을 왜 확인해야 해?","ideas":[["양수 조건 때문에 k=1/3만 답이다","−2와 1/3 중 양수는 무엇이지?"],["이차방정식은 해가 두 개 나올 수 있어서 문제의 조건에 맞는 것을 골라야 한다","방정식을 풀면 해가 몇 개까지 나올 수 있지?"]],"teach":"이차방정식이라 해가 두 개 나와도 문제의 조건(양수)에 맞는 것만 답이야. 그래서 k=1/3. 조건을 안 보면 −2까지 답으로 써서 틀려.","again":"함숫값 조건으로 이차방정식을 풀었을 때 답을 고르는 기준을 말해 봐.","fig":false,"src":"193쪽 예제 4","wrong":"둘 다 방정식의 해니까 둘 다 답이에요","miscon":"문제의 조건을 확인하지 않고 해를 모두 답으로 씀","record":"문제 조건으로 이차방정식의 해를 고르지 못함","half":"양수니까 3분의 1만 답이에요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"1. 이차함수와 그 그래프","small":"81. 이차함수 y=x²의 그래프는 어떤 모양일까?","steps":[{"kind":"성질","q":"y=x²의 그래프는 어떤 모양이고, 어떤 성질이 있어?","ideas":[["원점을 지나고 아래로 볼록한 곡선이다","x=0일 때 y는 얼마이고, 그래프는 위와 아래 중 어느 쪽으로 볼록할까?"],["y축에 대칭이고, x<0에서는 x가 커지면 y가 작아지고 x>0에서는 y도 커진다","x=2와 x=−2일 때 y의 값은 같을까?"]],"teach":"x와 −x를 넣으면 y 값이 같아서 y축에 대칭이고, x²≥0이라 x축 아래로는 안 내려가. 원점이 가장 낮은 점이고 아래로 볼록한 매끄러운 곡선이야.","again":"y=x²의 그래프가 x축 아래에 그려지지 않는 이유를 말해 봐.","fig":true,"src":"196~197쪽","wrong":"y=x²은 직선이에요","miscon":"이차함수 그래프를 직선이나 뾰족한 모양으로 봄","record":"y=x² 그래프의 모양과 대칭·증감을 설명하지 못함","half":"원점을 지나고 아래로 볼록해요"},{"kind":"뜻","q":"포물선의 축과 꼭짓점은 무엇이고, y=x²의 그래프에서는 각각 무엇이야?","ideas":[["포물선의 대칭축을 축, 축과 포물선이 만나는 점을 꼭짓점이라고 한다","포물선을 반으로 접는 선과 그 선이 포물선과 만나는 점을 각각 뭐라고 부르지?"],["y=x²에서는 축이 y축(x=0), 꼭짓점이 원점(0, 0)이다","y=x²의 그래프는 어떤 선에 대칭이었지?"]],"teach":"y=x² 모양의 곡선을 포물선이라고 해. 좌우를 똑같이 나누는 대칭축이 축, 축과 포물선이 만나는 점이 꼭짓점이야. y=x²은 y축이 축, 원점이 꼭짓점이야.","again":"y=x² 그래프에서 꼭짓점이 가장 낮은 점이 되는 이유를 말해 봐.","fig":true,"src":"196쪽","wrong":"꼭짓점은 그래프가 x축과 만나는 모든 점이에요","miscon":"꼭짓점을 x축과의 교점으로 봄","record":"포물선의 축과 꼭짓점의 뜻을 설명하지 못함","half":"대칭축이 축이고 만나는 점이 꼭짓점이에요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"1. 이차함수와 그 그래프","small":"82. 이차함수 y=-x²의 그래프는 어떤 모양일까?","steps":[{"kind":"성질","q":"y=−x²의 그래프는 y=x²의 그래프와 어떤 관계이고, 모양은 어떻게 돼?","ideas":[["같은 x에서 함숫값의 절댓값은 같고 부호가 반대라 x축에 대칭이다","x=2일 때 y=x²과 y=−x²의 값은 각각 얼마지?"],["원점을 지나고 위로 볼록한 포물선이다","x축에 대칭으로 뒤집으면 볼록한 방향은 어떻게 바뀔까?"]],"teach":"x=2일 때 x²=4, −x²=−4처럼 부호만 반대야. 그래서 y=x²의 그래프를 x축에 대해 뒤집은 모양, 곧 원점을 꼭짓점으로 하는 위로 볼록한 포물선이야. 증가·감소도 반대가 돼.","again":"y=−x²에서 x>0일 때 x가 커지면 y는 어떻게 되는지 이유와 함께 말해 봐.","fig":true,"src":"197쪽","wrong":"y=x²을 y축에 대칭한 거예요","miscon":"y=−x²을 y축 대칭으로 봄","record":"y=x²과 y=−x²이 x축에 대칭인 이유를 설명하지 못함","half":"y=x²이랑 x축에 대칭이에요"},{"kind":"함정","q":"y=−x²의 그래프에는 y좌표가 양수인 점이 있을까? 이유와 함께 가장 높은 점을 말해 봐.","ideas":[["모든 x에 대해 x²≥0이라 −x²≤0이므로 y좌표가 양수인 점은 없다","x²은 음수가 될 수 있을까? 그러면 −x²은?"],["x=0일 때 y=0이 가장 크므로 꼭짓점 (0, 0)이 가장 높은 점이다","−x²이 가장 커지는 x는 얼마지?"]],"teach":"x²은 항상 0 이상이라 −x²은 항상 0 이하야. 그래서 그래프는 x축 위로 올라가지 않고, x=0일 때 y=0인 꼭짓점이 가장 높은 점이야. y=x²과 반대로 꼭짓점이 최고점이 돼.","again":"y=x²과 y=−x²에서 꼭짓점이 각각 가장 낮은 점, 가장 높은 점이 되는 이유를 말해 봐.","fig":true,"src":"197쪽","wrong":"x가 음수면 y=−x²도 양수가 돼요","miscon":"−x²에 음수를 넣으면 양수가 된다고 생각함","record":"y=−x²의 값이 항상 0 이하인 이유와 꼭짓점이 최고점임을 설명하지 못함","half":"x²은 0 이상이라 −x²은 항상 0 이하여서 y좌표가 양수인 점은 없어요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"1. 이차함수와 그 그래프","small":"83. 이차함수 y=ax²의 그래프는 어떤 모양일까?","steps":[{"kind":"방법","q":"y=2x²의 그래프는 y=x²의 그래프를 이용해 어떻게 그릴 수 있고, 모양의 공통점은 뭐야?","ideas":[["같은 x에서 y=x²의 각 점의 y좌표를 2배 한 점들을 잡아 그린다","x=1일 때 y=x²과 y=2x²의 값은 어떤 관계지?"],["a의 값에 관계없이 원점을 꼭짓점, y축을 축으로 하는 포물선이다","y=ax²에서 x=0이면 y는 항상 얼마지?"]],"teach":"y=2x²은 같은 x에서 y=x²보다 y좌표가 2배라 각 점을 위로 2배씩 늘려 그려. a가 무엇이든 x=0이면 y=0이고 y축에 대칭이라, y=ax²은 항상 원점이 꼭짓점이고 y축이 축인 포물선이야.","again":"y=−(1/2)x²의 그래프를 y=(1/2)x²을 이용해 그리는 방법을 말해 봐.","fig":true,"src":"199쪽","wrong":"x좌표를 2배로 늘려서 그려요","miscon":"a배를 x좌표에 적용함","record":"y=ax² 그래프를 y=x²에서 y좌표를 a배 해 그리는 방법을 모름","half":"y좌표를 2배로 늘려서 그려요"},{"kind":"연결","q":"y=(1/2)x²과 y=−(1/2)x²의 그래프는 어떤 관계이고, 일반적으로 y=ax²과 y=−ax²은 어떤 관계야?","ideas":[["같은 x에서 함숫값의 부호만 반대라 x축에 서로 대칭이다","x=2일 때 두 함수의 값은 각각 얼마지?"],["일반적으로 y=ax²과 y=−ax²의 그래프도 x축에 대칭이다","y=x²과 y=−x²이 어떤 관계였는지 떠올려 볼래?"]],"teach":"x=2이면 (1/2)x²=2, −(1/2)x²=−2로 부호만 반대야. 그래서 두 그래프는 x축에 대칭이고, 이것은 모든 a에서 성립해: y=ax²과 y=−ax²은 x축 대칭, 폭은 같아.","again":"y=3x²의 그래프를 이용해 y=−3x²의 그래프를 그리는 방법을 말해 봐.","fig":true,"src":"199~200쪽","wrong":"두 그래프는 y축에 대칭이에요","miscon":"y=ax²과 y=−ax²을 y축 대칭으로 봄","record":"y=ax²과 y=−ax²이 x축에 대칭인 이유를 설명하지 못함","half":"두 그래프는 x축에 대칭이에요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"1. 이차함수와 그 그래프","small":"84. 이차함수 y=ax²의 그래프는 a의 값에 따라 어떻게 달라질까?","steps":[{"kind":"성질","q":"y=ax²의 그래프에서 a의 부호와 a의 절댓값은 각각 무엇을 결정해?","ideas":[["a>0이면 아래로 볼록, a<0이면 위로 볼록하다","a가 음수이면 그래프는 어느 쪽으로 볼록할까?"],["a의 절댓값이 클수록 그래프의 폭이 좁아진다","y=2x²과 y=(1/2)x² 중 폭이 좁은 것은?"]],"teach":"a의 부호는 볼록한 방향, a의 절댓값은 폭을 정해. |a|가 크면 y가 빨리 커져서 y축에 가까운 좁은 포물선이 되고, |a|가 작으면 넓어져. y=ax²과 y=−ax²은 x축에 대칭이야.","again":"y=−3x²과 y=(1/3)x² 중 폭이 좁은 것과 그 이유를 말해 봐.","fig":true,"src":"200쪽","wrong":"a가 클수록 폭이 넓어져요","miscon":"|a|가 클수록 폭이 넓어진다고 거꾸로 앎","record":"a의 부호(방향)와 절댓값(폭)의 역할을 구분하지 못함","half":"a가 양수면 아래로 볼록해요"},{"kind":"함정","q":"y=−3x²과 y=2x²의 그래프 중 폭이 더 좁은 것은? −3이 2보다 작으니까 폭이 넓다고 하면 왜 틀릴까?","ideas":[["폭은 a 자체가 아니라 a의 절댓값으로 비교한다","−3과 2의 절댓값은 각각 얼마지?"],["|−3|=3>|2|=2이므로 y=−3x²의 폭이 더 좁다","절댓값이 큰 쪽의 폭은 좁을까, 넓을까?"]],"teach":"부호는 방향만 정하고, 폭은 절댓값으로 봐. |−3|=3이 |2|=2보다 크니까 y=−3x²이 더 좁아. 부호까지 넣어 크기를 비교하면 틀려.","again":"y=−(1/2)x²과 y=x² 중 폭이 좁은 것을 판단하는 방법을 말해 봐.","fig":true,"src":"200쪽","wrong":"−3이 더 작으니까 y=−3x²이 더 넓어요","miscon":"폭을 a의 부호까지 포함한 크기로 비교함","record":"폭을 a의 절댓값으로 비교해야 한다는 것을 적용하지 못함","half":"절댓값으로 비교해야 해요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"1. 이차함수와 그 그래프","small":"85. 이차함수 y=ax²의 그래프를 y축의 방향으로 q만큼 평행이동한 그래프는?","steps":[{"kind":"성질","q":"y=ax²의 그래프를 y축의 방향으로 q만큼 평행이동하면 식, 꼭짓점, 축은 어떻게 돼?","ideas":[["식은 y=ax²+q이고 꼭짓점은 (0, q)가 된다","같은 x에서 y=x²+3의 값은 y=x²보다 얼마만큼 크지?"],["위아래로만 움직이므로 축은 그대로 x=0(y축)이다","그래프를 위로 옮기면 좌우 대칭축도 움직일까?"]],"teach":"모든 점의 y좌표가 q만큼 커지니까 식은 y=ax²+q. 꼭짓점은 (0,0)에서 (0,q)로, 위아래로만 움직여서 축은 y축(x=0) 그대로야. q>0이면 위로, q<0이면 아래로.","again":"y=−3x²을 y축의 방향으로 −2만큼 평행이동한 그래프의 꼭짓점과 축을 구하는 방법을 말해 봐.","fig":true,"src":"204쪽","wrong":"꼭짓점은 (q, 0)이 돼요","miscon":"y축 방향 이동을 꼭짓점의 x좌표 변화로 봄","record":"y축 방향 평행이동이 꼭짓점의 y좌표만 바꾼다는 것을 설명하지 못함","half":"모든 점이 위로 q만큼 올라가니까 식은 y=ax²+q이고 꼭짓점은 (0, q)예요"},{"kind":"적용","q":"y=ax²+q의 그래프를 보고 a와 q의 부호를 알아내려면 그래프의 어디를 봐야 해?","ideas":[["볼록한 방향으로 a의 부호를 정한다","아래로 볼록하면 a는 양수일까, 음수일까?"],["꼭짓점이 x축보다 위에 있는지 아래에 있는지로 q의 부호를 정한다","꼭짓점 (0, q)가 x축 아래에 있으면 q는?"]],"teach":"아래로 볼록 → a>0, 위로 볼록 → a<0. 꼭짓점 (0,q)가 x축 위면 q>0, 아래면 q<0. 모양과 꼭짓점 위치 두 가지만 보면 돼.","again":"위로 볼록하고 꼭짓점이 x축 위에 있는 y=ax²+q의 a, q 부호를 말해 봐.","fig":true,"src":"205쪽 예제 7","wrong":"꼭짓점이 오른쪽에 있으면 q가 양수예요","miscon":"q의 부호를 꼭짓점의 좌우 위치로 판단함","record":"그래프에서 a(볼록 방향)와 q(꼭짓점 높이)의 부호를 읽지 못함","half":"볼록한 방향으로 a를 봐요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"1. 이차함수와 그 그래프","small":"86. 이차함수 y=ax²의 그래프를 x축의 방향으로 p만큼 평행이동한 그래프는?","steps":[{"kind":"성질","q":"y=ax²의 그래프를 x축의 방향으로 p만큼 평행이동하면 식, 꼭짓점, 축은 어떻게 돼?","ideas":[["식은 y=a(x−p)²이고 꼭짓점은 (p, 0)이다","y=(x−2)²에서 y가 0이 되는 x는 얼마지?"],["좌우로 움직이므로 축도 함께 옮겨져 x=p가 된다","그래프를 오른쪽으로 옮기면 대칭축도 같이 움직일까?"]],"teach":"y=(x−2)²은 x=2일 때 0이 되어 꼭짓점이 (2,0)이고, y=x²을 오른쪽으로 2만큼 옮긴 모양이야. 일반적으로 y=a(x−p)², 꼭짓점 (p,0), 축 x=p.","again":"y=−(1/3)x²을 x축의 방향으로 −2만큼 평행이동한 그래프의 식과 꼭짓점을 구하는 방법을 말해 봐.","fig":true,"src":"205~206쪽","wrong":"꼭짓점은 (0, p)예요","miscon":"x축 방향 이동을 꼭짓점의 y좌표 변화로 봄","record":"x축 방향 평행이동이 꼭짓점과 축의 x좌표를 바꾼다는 것을 설명하지 못함","half":"x 대신 x−p를 넣어서 식은 y=a(x−p)²이고 꼭짓점은 (p, 0)이에요"},{"kind":"함정","q":"y=x²을 x축의 방향으로 2만큼 평행이동하면 y=(x+2)²이 아니라 y=(x−2)²이 되는 이유는?","ideas":[["옮긴 그래프의 꼭짓점은 x=2일 때 y=0이 되어야 한다","오른쪽으로 2만큼 옮기면 꼭짓점은 어디로 가지?"],["x=2를 넣었을 때 0이 되는 식은 (x−2)²이다","(x+2)²과 (x−2)² 중 x=2를 넣어 0이 되는 것은?"]],"teach":"오른쪽으로 2만큼 옮기면 꼭짓점이 (2,0)이야. x=2를 넣어 0이 되려면 (x−2)²이어야 해. 그래서 x 대신 x−p를 넣는 거고, 부호가 반대로 보여도 이동 방향과 맞아.","again":"y=(x+3)²의 꼭짓점이 (3,0)이 아닌 이유를 말해 봐.","fig":true,"src":"206쪽 THINK Math","wrong":"오른쪽으로 2만큼이니까 더하기 2예요","miscon":"이동 방향과 괄호 안 부호를 같게 봄","record":"x축 방향 이동에서 식의 부호가 반대로 되는 이유를 설명하지 못함","half":"꼭짓점은 x=2일 때 0이 돼야 해요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"1. 이차함수와 그 그래프","small":"87. y=ax²을 x축으로 p, y축으로 q만큼 평행이동한 그래프는?","steps":[{"kind":"성질","q":"y=ax²의 그래프를 x축으로 p만큼, y축으로 q만큼 평행이동한 그래프의 식, 꼭짓점, 축은?","ideas":[["식은 y=a(x−p)²+q이다","x축 방향 이동과 y축 방향 이동을 식에 각각 어떻게 반영했지?"],["꼭짓점은 (p, q), 축은 x=p이다","y=(x−3)²+2의 꼭짓점은 어디일까?"]],"teach":"x축으로 p → x 대신 x−p, y축으로 q → +q. 합치면 y=a(x−p)²+q, 꼭짓점 (p,q), 축 x=p야. 이동 순서를 바꿔도 같은 그래프가 돼.","again":"y=(x−3)²+2가 y=x²을 어떻게 옮긴 그래프인지 말해 봐.","fig":true,"src":"207쪽","wrong":"꼭짓점은 (−p, q)예요","miscon":"꼭짓점의 x좌표 부호를 반대로 읽음","record":"y=a(x−p)²+q에서 꼭짓점과 축을 정확히 읽지 못함","half":"식은 y=a(x−p)²+q예요"},{"kind":"함정","q":"y=−2(x+1)²−3의 꼭짓점과 축을 읽을 때 틀리기 쉬운 점은?","ideas":[["(x+1)은 (x−(−1))이므로 꼭짓점의 x좌표는 −1이다","x+1=0이 되는 x는 얼마지?"],["꼭짓점은 (−1, −3), 축은 x=−1이고 a=−2라 위로 볼록하다","뒤의 −3은 꼭짓점의 어느 좌표지?"]],"teach":"y=a(x−p)²+q 꼴로 맞추면 −2(x−(−1))²+(−3)이라 p=−1, q=−3. 꼭짓점 (−1,−3), 축 x=−1. 괄호 안 +1을 보고 p=1로 읽으면 틀려.","again":"y=(1/2)(x+4)²+5의 꼭짓점을 읽는 방법을 말해 봐.","fig":true,"src":"208쪽","wrong":"꼭짓점은 (1, −3)이에요","miscon":"괄호 안 부호를 그대로 꼭짓점 좌표로 씀","record":"a(x−p)²+q 꼴에서 p의 부호를 정확히 읽지 못함","half":"x+1이 0이 되는 −1이 x좌표예요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"1. 이차함수와 그 그래프","small":"88. y=a(x-p)²+q를 x축으로 m, y축으로 n만큼 평행이동한 그래프의 식은?","steps":[{"kind":"방법","q":"y=a(x−p)²+q의 그래프를 x축으로 m만큼, y축으로 n만큼 평행이동한 식을 쉽게 구하는 방법은?","ideas":[["꼭짓점 (p, q)를 x축으로 m, y축으로 n만큼 옮겨 새 꼭짓점 (p+m, q+n)을 구한다","그래프 전체를 옮기면 꼭짓점은 어디로 가지?"],["모양(a)은 그대로 두고 y=a(x−(p+m))²+q+n으로 쓴다","평행이동하면 폭과 볼록한 방향이 바뀔까?"]],"teach":"평행이동은 모양이 안 바뀌어서 a는 그대로, 꼭짓점만 옮기면 돼. (p,q) → (p+m, q+n)이라 y=a(x−p−m)²+q+n.","again":"y=−3(x+3)²+2를 x축으로 −4, y축으로 3만큼 옮긴 식을 구하는 방법을 말해 봐.","fig":true,"src":"209쪽 예제 12","wrong":"a에도 m을 더해요","miscon":"평행이동으로 a가 바뀐다고 생각함","record":"평행이동을 꼭짓점의 이동으로 보고 식을 구하지 못함","half":"꼭짓점 (p, q)를 옮겨서 (p+m, q+n)으로 새 꼭짓점을 구해요"},{"kind":"함정","q":"y=3x²+1의 그래프를 y축의 방향으로 4만큼 평행이동한 식을 y=3(x−4)²+1로 쓰면 왜 틀릴까?","ideas":[["y축 방향 이동은 꼭짓점의 y좌표를 바꾸므로 식의 뒤에 더한다","y축 방향으로 옮기면 꼭짓점의 어느 좌표가 바뀌지?"],["따라서 꼭짓점 (0, 1)이 (0, 5)가 되어 y=3x²+5이다","꼭짓점 (0, 1)을 위로 4만큼 옮기면 어디로 가지?"]],"teach":"x−4는 x축 방향(좌우) 이동이야. y축 방향(위아래)으로 4만큼은 꼭짓점 (0,1)이 (0,5)로 가는 거라 y=3x²+5. 방향에 따라 괄호 안과 뒤의 상수 중 어디를 바꿀지 구분해.","again":"y=a(x−p)²+q에서 x축 방향 이동과 y축 방향 이동이 식의 어디를 바꾸는지 말해 봐.","fig":true,"src":"209쪽 예제 12","wrong":"x 대신 x−4를 넣으면 돼요","miscon":"x축 방향과 y축 방향 이동을 식에 반대로 반영함","record":"평행이동 방향에 따라 식의 어느 부분이 바뀌는지 구분하지 못함","half":"y축 방향은 뒤에 있는 수를 바꿔요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"1. 이차함수와 그 그래프","small":"89. y=a(x-p)²+q를 x축에 대하여 대칭이동한 그래프의 식은?","steps":[{"kind":"성질","q":"y=a(x−p)²+q의 그래프를 x축에 대하여 대칭이동하면 식이 어떻게 되고, 무엇이 바뀌어?","ideas":[["y 대신 −y를 넣어 y=−a(x−p)²−q가 된다","x축에 대칭인 점은 x좌표와 y좌표 중 무엇의 부호가 바뀌지?"],["꼭짓점이 (p, −q)가 되고 볼록한 방향이 뒤집혀 a의 부호도 바뀐다","그래프를 뒤집으면 아래로 볼록하던 것이 어떻게 될까?"]],"teach":"x축 대칭은 y좌표의 부호가 바뀌어서 y 대신 −y: −y=a(x−p)²+q → y=−a(x−p)²−q. 꼭짓점 (p,−q), 모양이 뒤집혀 a도 부호가 바뀌어. q의 부호만 바꾸면 틀려.","again":"y=(1/2)(x−3)²+1을 x축에 대칭이동한 식에서 부호가 바뀌는 곳을 모두 말해 봐.","fig":true,"src":"209~210쪽","wrong":"q의 부호만 바꾸면 돼요","miscon":"x축 대칭에서 q만 바꾸고 a의 부호를 그대로 둠","record":"x축 대칭이동에서 a와 q의 부호가 모두 바뀌는 이유를 설명하지 못함","half":"x축 대칭은 y좌표 부호가 바뀌니까 y 대신 −y를 넣어서 식을 구해요"},{"kind":"연결","q":"같은 그래프를 y축에 대하여 대칭이동하면 x축 대칭과 무엇이 달라?","ideas":[["y축 대칭은 x 대신 −x를 넣어 y=a(x+p)²+q가 된다","y축에 대칭인 점은 어느 좌표의 부호가 바뀌지?"],["꼭짓점의 x좌표만 바뀌고 모양(볼록 방향)은 그대로다","y축에 대해 좌우로 뒤집으면 볼록한 방향이 바뀔까?"]],"teach":"y축 대칭은 좌우만 뒤집어서 x 대신 −x: y=a(−x−p)²+q=a(x+p)²+q. 꼭짓점 (−p,q), a는 그대로. x축 대칭은 위아래가 뒤집혀 a가 바뀌는 것과 달라.","again":"y=−(x+2)²+5를 y축에 대칭이동한 식을 구하는 방법을 말해 봐.","fig":true,"src":"210쪽 예제 13","wrong":"y축 대칭도 a의 부호가 바뀌어요","miscon":"y축 대칭에서도 a의 부호가 바뀐다고 생각함","record":"x축 대칭과 y축 대칭의 차이를 설명하지 못함","half":"x 대신 −x를 넣어요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"2. 이차함수 y=ax²+bx+c의 그래프","small":"90. 이차함수 y=ax²+bx+c를 y=a(x-p)²+q 꼴로 어떻게 고칠까?","steps":[{"kind":"방법","q":"y=2x²−4x+1을 y=a(x−p)²+q 꼴로 고치는 순서를 말해 봐.","ideas":[["상수항을 제외한 항을 x²의 계수 2로 묶는다","2x²−4x에서 2로 묶으면 괄호 안은 어떻게 되지?"],["괄호 안에서 x의 계수의 절반의 제곱을 더하고 빼서 완전제곱식을 만든다","x²−2x에 무엇을 더하면 완전제곱식이 될까?"],["괄호 밖으로 꺼내는 수에는 괄호 앞의 계수를 곱해 정리한다","괄호 안의 −1을 밖으로 꺼내면 2와 곱해서 얼마가 되지?"]],"teach":"y=2(x²−2x)+1 → 괄호 안에 (−2/2)²=1을 더하고 빼서 2(x²−2x+1−1)+1 → 2(x−1)²−2+1=2(x−1)²−1. 방정식처럼 양변에 더하는 게 아니라 식 안에서 더하고 빼는 거야.","again":"y=x²+6x+8을 표준형으로 고치는 순서를 말해 봐.","fig":false,"src":"221쪽","wrong":"양변을 2로 나눠서 풀어요","miscon":"이차함수 식을 방정식처럼 양변을 나눔","record":"일반형을 표준형으로 고치는 순서(묶기·더하고 빼기·꺼내기)를 모름","half":"x²의 계수로 먼저 묶어요"},{"kind":"함정","q":"y=−3x²−12x+6을 −3(x²+4x+4)+6으로 고치면 왜 틀릴까?","ideas":[["완전제곱식을 만들려고 괄호 안에 4를 더했으면 4도 빼야 한다","괄호 안에 4만 더하면 원래 식과 값이 같을까?"],["빼는 4를 괄호 밖으로 꺼낼 때는 −3을 곱해 +12가 된다","−3(x²+4x+4−4)에서 −4를 밖으로 꺼내면 얼마가 되지?"]],"teach":"−3(x²+4x+4−4)+6=−3(x+2)²+12+6=−3(x+2)²+18. 4를 더하기만 하거나, 꺼낼 때 −3을 안 곱하면 값이 달라져.","again":"이차함수 식을 표준형으로 고칠 때 틀리기 쉬운 두 곳을 말해 봐.","fig":false,"src":"221쪽","wrong":"−3(x+2)²+6이 맞아요","miscon":"더한 수를 빼지 않거나 꺼낼 때 계수를 곱하지 않음","record":"표준형으로 고칠 때 식의 값을 유지하는 처리를 하지 못함","half":"더한 만큼 빼야 해요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"2. 이차함수 y=ax²+bx+c의 그래프","small":"91. 이차함수 y=ax²+bx+c의 그래프에서 x절편, y절편은 어떻게 구할까?","steps":[{"kind":"방법","q":"이차함수 y=ax²+bx+c의 그래프에서 x절편과 y절편은 각각 어떻게 구해?","ideas":[["x절편은 x축과 만나는 점이므로 y=0을 대입해 이차방정식을 푼다","x축 위의 점은 y좌표가 얼마지?"],["y절편은 y축과 만나는 점이므로 x=0을 대입하며 상수항 c가 된다","x=0을 넣으면 ax²+bx+c에서 무엇만 남지?"]],"teach":"x절편은 y=0 → ax²+bx+c=0의 해, y절편은 x=0 → y=c. 예: y=x²+x−2는 (x+2)(x−1)=0이라 x절편 −2, 1, y절편 −2.","again":"y=x²−4x+3의 x절편과 y절편을 구하는 방법을 말해 봐.","fig":true,"src":"222쪽","wrong":"x절편은 x에 0을 넣어요","miscon":"x절편과 y절편에서 0을 넣는 변수를 바꿈","record":"이차함수 그래프의 x절편·y절편을 구하는 방법을 모름","half":"x절편은 y에 0을 넣어요"},{"kind":"연결","q":"이차함수의 그래프에서 x절편이 0개, 1개, 2개일 수 있는 이유를 이차방정식과 연결해 말해 봐.","ideas":[["x절편은 이차방정식 ax²+bx+c=0의 실수 해이다","x절편을 구할 때 풀었던 방정식은 무엇이었지?"],["그 이차방정식의 해가 없으면 0개, 중근이면 1개, 서로 다른 두 해면 2개이다","이차방정식의 해의 개수는 몇 가지 경우가 있었지?"]],"teach":"x절편=ax²+bx+c=0의 해야. 해가 2개면 x축과 두 점에서, 중근이면 한 점에서 닿고, 해가 없으면 x축과 안 만나. 그래서 x절편은 0, 1, 2개 중 하나야.","again":"그래프가 x축에 한 점에서만 닿는 이차함수는 이차방정식으로 보면 어떤 경우인지 말해 봐.","fig":true,"src":"222쪽 참고","wrong":"이차함수는 항상 x축과 두 점에서 만나요","miscon":"이차함수는 항상 x절편이 2개라고 생각함","record":"x절편의 개수를 이차방정식의 해의 개수와 연결하지 못함","half":"x절편은 이차방정식의 해예요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"2. 이차함수 y=ax²+bx+c의 그래프","small":"92. 이차함수 y=ax²+bx+c의 그래프는 어떻게 그릴까?","steps":[{"kind":"방법","q":"y=x²+2x−3의 그래프를 그리는 순서를 말해 봐.","ideas":[["x²의 계수의 부호로 볼록한 방향을 정한다","x²의 계수가 양수면 어느 쪽으로 볼록하지?"],["y=a(x−p)²+q 꼴로 고쳐 꼭짓점을 구한다","y=x²+2x−3을 표준형으로 고치면 꼭짓점은 어디지?"],["x=0을 넣어 y절편을 구하고 점들을 이어 그린다","y절편은 어떻게 찾았지?"]],"teach":"① 모양: x²의 계수 1>0 → 아래로 볼록 ② 꼭짓점: (x+1)²−4 → (−1,−4) ③ y절편: −3. 이 세 가지로 그래프를 그려. 인수분해가 되면 x절편 −3, 1도 도움이 돼.","again":"y=−2x²−8x−5의 그래프를 그리는 순서를 말해 봐.","fig":true,"src":"223쪽","wrong":"아무 점이나 많이 찍어서 이어요","miscon":"핵심 정보 없이 점만 찍어 그리려 함","record":"모양·꼭짓점·y절편으로 그래프를 그리는 순서를 모름","half":"먼저 x²의 계수로 볼록한 방향을 정해요"},{"kind":"연결","q":"이차함수의 그래프가 x축과 만나는 두 점 x=−3, x=1을 알면 축의 방정식을 바로 알 수 있어. 왜 그럴까?","ideas":[["포물선은 축에 대칭이므로 x축과 만나는 두 점은 축에서 같은 거리에 있다","포물선을 축으로 접으면 x축과 만나는 두 점은 어떻게 될까?"],["그래서 축은 두 x절편의 한가운데인 x=(−3+1)/2=−1이다","두 수의 한가운데는 어떻게 구하지?"]],"teach":"포물선은 축을 기준으로 좌우 대칭이라 x축과 만나는 두 점도 축에서 같은 거리야. 그래서 축은 두 x절편의 평균, x=(−3+1)/2=−1. 꼭짓점의 x좌표도 −1이야.","again":"x절편이 2와 6인 포물선의 축을 구하는 방법과 이유를 말해 봐.","fig":true,"src":"223쪽","wrong":"축은 두 x절편을 더한 값이에요","miscon":"축을 두 x절편의 합으로 봄","record":"포물선의 대칭성으로 축을 구하는 이유를 설명하지 못함","half":"포물선은 축에 대칭이라서요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"2. 이차함수 y=ax²+bx+c의 그래프","small":"93. 이차함수 y=ax²+bx+c의 그래프를 보고 a, b, c의 부호를 알 수 있을까?","steps":[{"kind":"방법","q":"이차함수 y=ax²+bx+c의 그래프를 보고 a, b, c의 부호는 각각 그래프의 어디를 보고 알아?","ideas":[["a는 그래프의 볼록한 방향으로 정한다","아래로 볼록하면 a는?"],["b는 축의 위치로 정하는데, 축이 y축의 오른쪽이면 a와 b의 부호가 다르고 왼쪽이면 같다","축의 방정식 x=−b/2a가 양수이려면 a와 b의 부호는 어때야 할까?"],["c는 그래프가 y축과 만나는 점의 위치로 정한다","y절편은 식의 어느 항이었지?"]],"teach":"a: 볼록 방향. c: y절편의 위치(x축 위면 c>0). b: 축 x=−b/2a가 y축 오른쪽이면 ab<0(부호 다름), 왼쪽이면 ab>0(부호 같음), y축이면 b=0. b는 a와 함께 봐야 해.","again":"위로 볼록하고 축이 y축의 왼쪽, y절편이 양수인 그래프의 a, b, c 부호를 판단하는 방법을 말해 봐.","fig":true,"src":"224쪽","wrong":"b는 그래프가 x축과 만나는 점을 봐요","miscon":"b의 부호를 x절편이나 볼록 방향만으로 판단함","record":"그래프에서 a·b·c의 부호를 각각 무엇으로 판단하는지 설명하지 못함","half":"a는 볼록한 방향을 봐요"},{"kind":"이유","q":"축이 y축의 오른쪽에 있으면 a와 b의 부호가 서로 다른 이유를 설명해 봐.","ideas":[["축의 방정식은 x=−b/2a이다","y=ax²+bx+c를 표준형으로 고치면 축은 어떻게 나타나지?"],["축이 y축 오른쪽이면 −b/2a>0이라 b/a<0, 즉 a와 b의 부호가 다르다","−b/2a가 양수가 되려면 a와 b를 나눈 값의 부호는?"]],"teach":"표준형으로 고치면 축은 x=−b/2a야. 오른쪽이면 −b/2a>0 → b/2a<0 → a와 b의 부호가 달라. 왼쪽이면 같은 부호, 축이 y축이면 b=0.","again":"축이 y축의 왼쪽에 있을 때 ab의 부호를 판단하는 이유를 말해 봐.","fig":true,"src":"224쪽","wrong":"축이 오른쪽이면 b가 양수예요","miscon":"축의 위치를 b 하나의 부호로만 판단함","record":"축의 위치와 a·b 부호 관계(x=−b/2a)를 설명하지 못함","half":"축의 방정식이 x=−b/2a예요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"2. 이차함수 y=ax²+bx+c의 그래프","small":"94. 꼭짓점의 좌표가 주어진 경우, 이차함수의 식은 어떻게 구할까?","steps":[{"kind":"방법","q":"꼭짓점이 (−2, 4)이고 점 (0, 1)을 지나는 포물선의 이차함수 식은 어떻게 구해?","ideas":[["꼭짓점 (p, q)를 이용해 y=a(x+2)²+4로 놓는다","꼭짓점을 알 때 편한 식의 꼴은 무엇이었지?"],["지나는 점 (0, 1)을 대입해 a를 구한다","남은 미지수 a는 어떻게 구하지?"]],"teach":"꼭짓점을 알면 y=a(x−p)²+q 꼴이 편해: y=a(x+2)²+4. 점 (0,1)을 넣으면 1=4a+4 → a=−3/4. 그래서 y=−(3/4)(x+2)²+4.","again":"꼭짓점이 (1, −2)이고 점 (3, 6)을 지나는 포물선의 식을 구하는 순서를 말해 봐.","fig":false,"src":"225쪽","wrong":"y=ax²+bx+c로 놓고 세 미지수를 구해요","miscon":"꼭짓점 정보를 쓰지 않고 일반형으로 놓음","record":"꼭짓점이 주어질 때 표준형으로 놓고 a를 구하는 방법을 모름","half":"y=a(x+2)²+4로 놓아요"},{"kind":"함정","q":"꼭짓점이 (0, 3)이면 식을 y=a(x−0)²+3, 곧 y=ax²+3으로 놓을 수 있어. 꼭짓점이 (2, 0)이면 어떤 꼴이 되고, 틀리기 쉬운 점은?","ideas":[["꼭짓점이 (p, 0)이면 q=0이라 y=a(x−p)² 꼴이 되어 y=a(x−2)²으로 놓는다","꼭짓점의 y좌표가 0이면 표준형에서 무엇이 사라지지?"],["괄호 안의 부호를 꼭짓점과 반대로 써서 (x+2)²으로 놓지 않도록 조심한다","x=2일 때 0이 되는 식은 (x−2)²일까, (x+2)²일까?"]],"teach":"꼭짓점 좌표에 따라 표준형이 간단해져: (0,0) → ax², (0,q) → ax²+q, (p,0) → a(x−p)². 꼭짓점 (2,0)이면 y=a(x−2)². x좌표 2를 보고 (x+2)로 쓰면 틀려.","again":"꼭짓점이 (−3, 0)인 포물선의 식을 놓을 때 괄호 안 부호를 정하는 방법을 말해 봐.","fig":false,"src":"225쪽 참고","wrong":"꼭짓점이 (2,0)이니까 y=a(x+2)²이에요","miscon":"꼭짓점의 x좌표와 괄호 안 부호를 같게 씀","record":"꼭짓점 좌표에 맞게 표준형을 간단히 놓지 못함","half":"y=a(x−2)²으로 놓아요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"2. 이차함수 y=ax²+bx+c의 그래프","small":"95. 축의 방정식이 주어진 경우, 이차함수의 식은 어떻게 구할까?","steps":[{"kind":"방법","q":"축의 방정식이 x=−1이고 두 점 (0, −5), (1, −8)을 지나는 포물선의 식은 어떻게 구해?","ideas":[["축이 x=−1이면 꼭짓점의 x좌표가 −1이라 y=a(x+1)²+q로 놓는다","축의 방정식과 꼭짓점의 x좌표는 어떤 관계지?"],["두 점을 각각 대입해 a와 q에 대한 연립방정식을 푼다","미지수 a, q가 두 개면 식이 몇 개 필요할까?"]],"teach":"축 x=p는 꼭짓점의 x좌표가 p라는 뜻이라 y=a(x+1)²+q. (0,−5) → a+q=−5, (1,−8) → 4a+q=−8. 연립하면 a=−1, q=−4라 y=−(x+1)²−4.","again":"축이 x=2이고 두 점을 지나는 포물선의 식을 구할 때 처음 놓는 식을 말해 봐.","fig":false,"src":"226쪽","wrong":"축을 알면 꼭짓점을 다 알아서 a만 구하면 돼요","miscon":"축만 알고도 q까지 안다고 생각함","record":"축이 주어질 때 표준형으로 놓고 a·q를 연립으로 구하지 못함","half":"y=a(x+1)²+q로 놓아요"},{"kind":"이유","q":"축의 방정식이 x=−1이라는 조건만으로는 이차함수의 식을 하나로 정할 수 없어. 그 이유와, 몇 개의 점이 더 필요한지 말해 봐.","ideas":[["축은 꼭짓점의 x좌표만 알려 주므로 a와 q 두 값을 아직 모른다","y=a(x+1)²+q에서 아직 모르는 값은 몇 개지?"],["모르는 값이 두 개라 서로 다른 두 점의 좌표가 더 필요하다","미지수 두 개를 구하려면 식이 몇 개 필요할까?"]],"teach":"축 x=−1은 p=−1만 정해 줘. y=a(x+1)²+q에는 a, q 두 값이 남아서 식이 두 개, 즉 지나는 두 점이 필요해. 꼭짓점을 알면 a 하나만 남아 한 점이면 충분한 것과 달라.","again":"꼭짓점이 주어질 때는 한 점, 축이 주어질 때는 두 점이 필요한 이유를 말해 봐.","fig":false,"src":"226쪽","wrong":"축을 알면 꼭짓점을 알아서 점 하나면 돼요","miscon":"축을 꼭짓점 전체 정보로 착각함","record":"주어진 조건에 따라 필요한 점의 개수를 판단하지 못함","half":"축만으로는 a랑 q를 몰라요"}]},{"grade":"m3-1","big":"4. 이차함수","middle":"2. 이차함수 y=ax²+bx+c의 그래프","small":"96. 꼭짓점이 아닌 세 점의 좌표가 주어지는 경우, 이차함수의 식은 어떻게 구할까?","steps":[{"kind":"방법","q":"꼭짓점이 아닌 세 점 (0, −3), (1, −3), (− <script>
(function(){
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const V={pass:'통과 · 핵심 모두',partial:'일부 · 핵심 일부만',applied:'적용 오류 · 방법은 맞고 적용이 틀림',none:'못 맞힘 · 방법도 결론도 틀림'};
if(!window.REVIEW){ document.getElementById('summary').textContent='검토 데이터 파일이 없어요.'; return; }
const {ladders, results} = window.REVIEW;
const L0 = ladders[0]||{};
document.getElementById('title').textContent = '질문 계단 검토 — '+(L0.grade||'')+' '+(L0.big||'');
let S={steps:0,full:0,halfN:0,half:0,wrongOk:0,flip:0,applied:0};
let html='', lastMid=null;
ladders.forEach(L=>{
  if(L.middle!==lastMid){ html+=`<div class="mid">${esc(L.middle)}</div>`; lastMid=L.middle; }
  const R = results[L.small]||[];
  let warns=0;
  const steps = L.steps.map((s,k)=>{
    const r=R[k]||{}; S.steps++;
    if(r.full&&r.full.verdict==='pass')S.full++;
    if(r.half){S.halfN++; if(r.half.verdict==='partial')S.half++;}
    const wantW = s.wrongKind||'none'; if(r.wrong&&r.wrong.verdict===wantW)S.wrongOk++; if(r.wrong&&r.wrong.verdict==='applied')S.applied++;
    const flip = r.half&&r.half2&&r.half.verdict!==r.half2.verdict; if(flip)S.flip++;
    const odd = flip || (r.full&&r.full.verdict!=='pass') || (r.wrong&&r.wrong.verdict==='pass') || (r.half&&r.half.verdict!=='partial');
    if(odd) warns++;
    const c=(label,ans,x)=> !x?'':`<div class="case"><span class="who">${label}</span>${ans?'“'+esc(ans)+'”':'(통과 아이디어를 그대로 이어 말함)'}<span class="v ${x.verdict||''}">${V[x.verdict]||esc(x.error||'?')}</span>${x.say?`<span class="say">🤖 ${esc(x.say)}</span>`:''}</div>`;
    return `<div class="step"><div class="n">${k+1}</div><div>
      <div class="q"><span class="kind">${esc(s.kind)}</span>${esc(s.q)}${s.fig?'<span class="fig">🖼 그림</span>':''}</div>
      <div class="lbl" style="color:var(--green)">통과 아이디어 · 빠지면 되묻기</div>
      <ul class="ideas">${(s.ideas||[]).map((x,j)=>`<li><i>${'abc'[j]})</i><span>${esc(x[0])}<span class="hq">↳ “${esc(x[1])}”</span></span></li>`).join('')}</ul>
      <div class="lbl" style="color:var(--blue)">짧은 설명</div><div class="teach">${esc(s.teach)}</div>
      <div class="lbl" style="color:var(--purple)">다시 묻기</div><div class="again">“${esc(s.again)}”</div>
      ${s.src?`<div class="src">📖 ${esc(s.src)}</div>`:''}
      ${s.miscon||s.record?`<div class="diag"><b>대표 오개념</b> ${esc(s.miscon)}<br><b>선생님·부모님 기록 문장</b> ${esc(s.record)}</div>`:''}
      <div class="ai"><div class="t">AI 채점 시험</div>${s.half?c('절반 답',s.half,r.half):'<div class="case"><span class="who">절반 답</span>(아이디어가 하나뿐인 칸이라 없음)</div>'}${flip?`<span class="flip">⚠ 같은 답을 한 번 더 채점하니 "${V[r.half2.verdict]}" — 판정 흔들림</span>`:''}${c(s.wrongKind==='applied'?'틀린 답(적용 오류 기대)':'틀린 답',s.wrong,r.wrong)}${c('모범 답',null,r.full)}</div>
    </div></div>`;
  }).join('');
  html+=`<details class="lad"${L.summary?' open':''}><summary>${L.summary?'<span class="sumtag">대단원 종합</span> ':''}${esc(L.small)} <span class="cnt">칸 ${L.steps.length}</span>${warns?`<span class="warn">확인 ${warns}</span>`:''}</summary>${steps}</details>`;
});
document.getElementById('list').innerHTML=html;
document.getElementById('lead').textContent = '소단원 '+ladders.length+'개 · 칸 '+S.steps+'개. 소단원 이름을 누르면 펼쳐져요. 주황색 "확인" 표시는 AI 채점이 예상과 다르게 나온 칸이에요.';
document.getElementById('summary').innerHTML = `<h2>AI 채점 시험 요약 (실제 앱 서버)</h2><ul>
  <li>모범 답 → 통과: <b>${S.full} / ${S.steps}</b></li>
  <li>절반 답(핵심 하나를 담은 답) → 일부: <b>${S.half} / ${S.halfN}</b> <span class="cnt">(아이디어가 하나뿐인 칸은 절반 답 없음)</span></li>
  <li>틀린 답 → 기대한 진단(못 맞힘 또는 적용 오류): <b>${S.wrongOk} / ${S.steps}</b> <span class="cnt">(그중 적용 오류 ${S.applied})</span></li>
  <li>같은 절반 답을 두 번 채점해 판정이 달라진 칸: <b>${S.flip} / ${S.halfN}</b></li></ul>
  <p style="margin:8px 0 0;font-size:13px;color:var(--sub)">판정은 네 단계예요: <b>통과</b>(핵심 모두) · <b>일부</b>(핵심 일부만) · <b>적용 오류</b>(방법은 맞고 적용이 틀림) · <b>못 맞힘</b>(방법도 결론도 틀림). 칸마다 대표 오개념과, 학생이 틀렸을 때 선생님·부모님께 남길 기록 문장을 붙였어요.</p>`;
})();
</script>
