<title>조건 터치 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
/* 새 앱(app.css) 색을 그대로: 밤하늘 바탕 + 종이 카드. 터치한 조건·묻는 것만 보라색으로 */
:root{
  --sky:#0c1022; --sky2:#141a33; --line:#252d4d; --ink:#eef1f8; --sub:#9aa3c0;
  --gold:#f2c45f; --paper:#fbfaf6; --pen:#1d2233; --ok:#5fcfa0; --warn:#ff9a7a;
  --tap:#6a3fd1; --tapbg:#efe7ff; --miss:#d9534f;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font:16px/1.55 Pretendard,"Malgun Gothic",system-ui,sans-serif;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.crumb{font-size:13px;color:var(--sub)}
.crumb b{color:var(--gold);font-weight:600}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.d{background:var(--ok)} .dots i.c{background:var(--gold)}
.mark{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:2px 9px}

.guide{display:flex;align-items:center;gap:10px;background:var(--sky2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:15px}
.guide .hand{font-size:22px}
.guide.done{border-color:#3d2f6b}

.qcard{background:var(--paper);color:var(--pen);border-radius:var(--r);padding:18px 18px 16px;box-shadow:0 10px 40px #0007}
.q{font-size:19px;font-weight:500;line-height:2;word-break:keep-all}
.q .w,.q .ch{cursor:pointer;border-radius:6px;padding:1px 1px;transition:color .15s,background .15s;-webkit-tap-highlight-color:transparent}
.q .ch.on,.q .ch.opt.on{color:var(--tap);font-weight:800;background:var(--tapbg);box-shadow:0 2px 0 var(--tap)}
.q .w.no{color:var(--miss);animation:shake .35s}
.q .ch.glow{animation:glow 1.2s ease-in-out infinite}
.q.over .w,.q.over .ch{cursor:default}
.ch{position:relative}
.ch .pop{position:absolute;left:50%;bottom:100%;transform:translate(-50%,4px);white-space:nowrap;font-size:11.5px;font-weight:700;color:#fff;background:var(--tap);border-radius:999px;padding:1px 8px;line-height:1.6;opacity:0;pointer-events:none;transition:.25s}
.ch .pop.on{opacity:1;transform:translate(-50%,-3px)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes glow{0%,100%{background:transparent}50%{background:#e7dcff}}

.ans{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:4px}
.count{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--sub);background:var(--sky2);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.chip .pips{display:flex;gap:4px}
.chip .pips i{width:10px;height:10px;border-radius:50%;border:1.5px solid #6c5aa8}
.chip .pips i.f{background:#a98bff;border-color:#a98bff}
.chip.full{color:#d9ccff;border-color:#4b3d82}
.prompt{color:var(--sub);font-size:14.5px;text-align:center;min-height:22px}
.prompt b{color:var(--ink)}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--gold);position:relative;cursor:pointer;transition:background .3s,transform .3s}
.mic span{position:absolute;inset:28px 33px;border-radius:12px;background:#241a00}
.mic:disabled{background:#3a4060;cursor:not-allowed}
.mic:disabled span{background:#5b6385}
.mic .lock{position:absolute;right:-4px;bottom:-4px;font-size:22px}
.mic.open{animation:pop .5s}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
button.primary{background:var(--gold);color:#2a1600;border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

details.rec{background:var(--sky2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px}
details.rec summary{cursor:pointer;color:var(--sub)}
.rec ul{margin:8px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.rec .t{color:var(--sub);font-size:12.5px;margin-top:6px}
.rec .ok{color:var(--ok)} .rec .h{color:var(--gold)} .rec .x{color:var(--warn)}

.toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,20px);opacity:0;background:var(--sky2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;transition:.35s;max-width:calc(100% - 32px);text-align:center;font-size:14px;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){.q{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* [v75.1] 수식 표시 — mfmt() 가 만든 조각들 */
.mf{font-family:"Cambria Math","STIX Two Math","STIX Two Text","Latin Modern Math","Times New Roman",Georgia,"Noto Serif KR",serif;}
.mf-v{font-style:italic;}
.mf-mi{font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Noto Sans Math","Times New Roman",serif;font-style:normal;}
.mf-frac{display:inline-flex;flex-direction:column;text-align:center;margin:0 .18em;
  font-size:.9em;line-height:1.15;vertical-align:middle;position:relative;top:-.08em;}
.mf-num{border-bottom:1px solid currentColor;padding:0 .32em;}
.mf-den{padding:1px .32em 0;}
.mf-rad{white-space:nowrap;}
.mf-rcd{border-top:1px solid currentColor;padding:1px .14em 0 .05em;margin-left:-.06em;}
sup.mf-sup{font-size:.68em;vertical-align:.55em;line-height:0;}
sub.mf-sub{font-size:.68em;vertical-align:-.2em;line-height:0;}

</style>

<div class="wrap">
  <div class="top">
    <div class="crumb"><b>은하 탐사</b> · 3회차 계단</div>
    <div class="dots" id="dots"></div>
    <span class="mark">시안</span>
  </div>

  <div class="guide" id="guide"><span class="hand">👆</span><span id="guideT">조건과 묻는 것을 터치하세요. 그래야 말할 기회가 생겨요.</span></div>

  <section class="qcard"><div class="q" id="q"></div></section>

  <section class="ans">
    <div class="count" id="count"></div>
    <div class="prompt" id="prompt"></div>
    <button class="mic" id="mic" disabled aria-label="말하기"><span></span><i class="lock" id="lock">🔒</i></button>
    <div class="row"><button class="ghost" id="again">이 질문 처음부터</button><button class="primary" id="next" hidden>다음 질문 →</button></div>
  </section>

  <details class="rec" id="recBox"><summary>선생님 화면에 남는 기록 보기</summary><div id="rec"></div></details>
</div>
<div class="toast" id="toast"></div>

<script>
/* 수식 표시기 mfmt — dodream.html(v92) 에서 그대로 옮김. 표시 전용(채점·저장에 쓰지 말 것). */
(function(){
  function esc(s){ return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var OPS = /[=+\-*\/^√∪∩⊂⊄∈∉≤≥≠×÷²³⁻]/;
  // 수식 덩어리 후보: 영문/숫자/여는괄호/√ 로 시작
  var GREEK = 'πθαβγλμφωΔΣΩ';
  var RUN = /[A-Za-z0-9(√πθ∠][A-Za-z0-9 +\-*\/^=<>≤≥≠()\[\]{}∪∩⊂⊄∈∉∅√|,.×÷·²³⁻¹⁰′°_πθαβγλμφωΔΣΩ∠∽≡∥⊥½⅓¼⅔¾]*/g;

  // 균형 잡힌 괄호 덩어리를 s[i]부터 읽는다. 여는 괄호가 아니면 null.
  function group(s,i){
    if(s[i]!=='(') return null;
    var d=0;
    for(var j=i;j<s.length;j++){
      if(s[j]==='(') d++;
      else if(s[j]===')'){ d--; if(!d) return s.slice(i,j+1); }
    }
    return null;
  }
  // 분수의 한쪽 피연산자를 뒤/앞에서 읽는다
  var TOKEN = /[A-Za-z0-9²³ⁿ_.]+$/;
  function leftOperand(s,i){            // s[0..i-1] 의 끝에서
    if(s[i-1]===')'){ var d=0; for(var j=i-1;j>=0;j--){ if(s[j]===')')d++; else if(s[j]==='('){d--; if(!d) return [j,s.slice(j,i)];} } return null; }
    var m=TOKEN.exec(s.slice(0,i)); if(!m||!m[0]) return null;
    if(s[i-1-m[0].length]==='√') return null;      // √a/… 는 √까지 포함
    return [i-m[0].length, m[0]];
  }
  function rightOperand(s,i){           // s[i..] 의 앞에서
    var gp=group(s,i); if(gp) return gp;
    var m=/^[A-Za-z0-9²³ⁿ_.]+/.exec(s.slice(i)); return m?m[0]:null;
  }

  function strip(t){ return (t.length>1 && t[0]==='(' && group(t,0)===t) ? t.slice(1,-1) : t; }

  // 한 덩어리 안을 재귀적으로 꾸민다
  function inner(t){
    var out='', i=0;
    while(i<t.length){
      var ch=t[i];
      // 근호
      if(ch==='√'){
        var gp=group(t,i+1), body;
        if(gp){ body=gp.slice(1,-1); i+=1+gp.length; }
        else { var m=/^[A-Za-z0-9²³_.]+/.exec(t.slice(i+1)); if(m){ body=m[0]; i+=1+m[0].length; } else { out+='√'; i++; continue; } }
        out+='<span class="mf-rad">√<span class="mf-rcd">'+inner(body)+'</span></span>';
        continue;
      }
      // 위첨자
      if(ch==='^'){
        var gp2=group(t,i+1), sup;
        if(gp2){ sup=gp2.slice(1,-1); i+=1+gp2.length; }
        else { var m2=/^-?[A-Za-z0-9]+/.exec(t.slice(i+1)); if(m2){ sup=m2[0]; i+=1+m2[0].length; } else { out+='^'; i++; continue; } }
        out+='<sup class="mf-sup">'+inner(sup)+'</sup>';
        continue;
      }
      // [v82.7] 영문 낱말은 교재 규칙대로: 변수는 기울임, 점·도형 이름·단위·함수 이름은 세움
      if(/[A-Za-z]/.test(ch)){
        var w=/^[A-Za-z]+/.exec(t.slice(i))[0];
        if(isRoman(w,t,i)){ out+=esc(w); i+=w.length; continue; }
        i+=w.length;
        var md=/^\d+/.exec(t.slice(i)), body='';
        for(var q=0;q<w.length;q++) body+=mvar(w[q]);
        if(md){ body+='<sub class="mf-sub">'+md[0]+'</sub>'; i+=md[0].length; }
        out+=body; continue;
      }
      out+=esc(ch); i++;
    }
    return out;
  }

  // [v82.6] 문자는 교재와 같은 "수학 기울임체"(유니코드 math italic)로 그린다.
  //   보통 글자에 기울임만 주면 x 가 대문자처럼 보여서 마스터가 지적함.
  //   글꼴이 이 글자를 못 그리는 기기에서는 예전처럼 <i> 기울임으로 돌아간다.
  var MI_OK = null, MI_FONT = '"Cambria Math","STIX Two Math","Latin Modern Math","Noto Sans Math","Times New Roman",serif';
  function mathItalicOk(){
    if(MI_OK !== null) return MI_OK;
    try{
      var c = document.createElement('canvas').getContext('2d');
      c.font = '20px ' + MI_FONT;
      var w1 = c.measureText(String.fromCodePoint(0x1D465)).width;   // 수학 기울임 x
      var w2 = c.measureText(String.fromCodePoint(0x10FFFF)).width;  // 없는 글자(네모)
      MI_OK = w1 > 0 && Math.abs(w1 - w2) > 0.5;
    }catch(e){ MI_OK = false; }
    return MI_OK;
  }
  // [v82.7] 교재(숨마쿰 라우데)에서 세워서 쓰는 것들
  //   · 점·선분·도형 이름: AB, ABC, ∠A, A(-3)   · 단위: cm, L, mL   · 함수 이름: sin, tan, log
  //   기울여 쓰는 것: 변수 a x p k, 집합 A B U, 판별식 D, 넓이 S …
  var UNITS = {mm:1,cm:1,m:1,km:1,mg:1,g:1,kg:1,t:1,mL:1,ml:1,L:1,kL:1,cc:1,mol:1,s:1};
  var FUNCS = {sin:1,cos:1,tan:1,sec:1,csc:1,cot:1,log:1,ln:1,lim:1,max:1,min:1,gcd:1,lcm:1,mod:1};
  var MF_CTX = '';                                    // 이 수식 덩어리 바로 앞의 우리말
  var POINT_WORD = /(점|각|원|호|선분|중심|꼭짓점|지점|삼각형|사각형|다각형|평행사변형|마름모|사다리꼴|정점|둘레)\s*$/;
  function isRoman(w,t,i){
    if(w.length>1 && FUNCS[w.toLowerCase()]) return true;              // sin, tan, log
    if(UNITS[w] && w.length>1 && /\d\s*$/.test(t.slice(0,i))) return true;  // 10cm, 1000 mL
    if(UNITS[w] && MF_UNIT) return true;                               // 단위 이야기 속의 한 글자 단위 (1 L, 3 g)
    if(UNITS[w] && t[i-1]==='(' && t[i+w.length]===')') return true;   // 홀로 괄호 안의 단위 — (m), (cm)
    if(w.length>1 && /^[A-Z]+$/.test(w)) return true;                  // AB, ABC — 점·선분·도형
    if(w.length>3 && /^[a-z]+$/.test(w)) return true;                  // 영어 낱말
    if(w.length===1 && /[A-Z]/.test(w)){
      var pch=t.slice(0,i).replace(/\s+$/,'').slice(-1);
      if(pch && '\u2220\u25B3\u25B1\u223D\u2261'.indexOf(pch)>=0) return true;  // ∠A △A
      if(/^\(\s*[-\u2212+]?[\d.]+\s*(,\s*[-\u2212+]?[\d.]+\s*)*\)/.test(t.slice(i+1))) return true;  // A(-3), B(5, 2)
      if(i===0 && POINT_WORD.test(MF_CTX)) return true;                // 점 A, 원 O
    }
    return false;
  }
  function mvar(ch){
    if(mathItalicOk()){
      if(ch === 'h') return '<span class="mf-mi">\u210E</span>';   // ℎ 는 따로 있는 글자
      var code = ch.charCodeAt(0);
      var base = (code >= 97) ? 0x1D44E + (code - 97) : 0x1D434 + (code - 65);
      return '<span class="mf-mi">' + String.fromCodePoint(base) + '</span>';
    }
    return '<i class="mf-v">' + ch + '</i>';
  }

  // 분수 처리 후 inner()
  function expr(t){
    var k=t.indexOf('/');
    while(k>0){
      if(t[k-1]!=='/' && t[k+1]!=='/'){
        var L=leftOperand(t,k), R=L?rightOperand(t,k+1):null;
        if(L && R){
          return expr(t.slice(0,L[0]))
            + '<span class="mf-frac"><span class="mf-num">'+expr(strip(L[1]))+'</span>'
            + '<span class="mf-den">'+expr(strip(R))+'</span></span>'
            + expr(t.slice(k+1+R.length));
        }
      }
      k=t.indexOf('/',k+1);
    }
    return inner(t);
  }

  // [v82.7] 수식 덩어리 밖에 홀로 있는 변수 한 글자도 교재처럼 기울인다.
  //   "x의 값", "y축", "꼭짓점 (p, q)", "n각형" … 숫자 뒤의 단위(500 g)와 영어 낱말은 건드리지 않는다.
  var LONE = /(^|[^A-Za-z0-9])([a-z])(?![A-Za-z0-9])/g;
  // 단위로도 쓰이는 글자(m 미터·g 그램·t 톤·l 리터·s 초·h 시간)는, 그 글에 단위 이야기가 있으면 변수로 보지 않는다.
  //   "2 km는 몇 m일까요?" 의 m 은 변수가 아니라 단위다.
  var UNIT_CH = 'mgtlsh';
  var UNIT_CTX = /(mm|cm|km|kg|mg|mL|kL|㎜|㎝|㎞|㎏|㎖|㎠|㎤|단위|그램|킬로|리터|미터|센티|밀리|톤|무게|들이|길이는|시간의)/;
  var MF_UNIT = false;
  var SET_UP = /(집합)(\s*)([A-Z](?:\s*,\s*[A-Z])*)(?![A-Za-z0-9])/g;   // 집합 A, 전체집합 U, 부분집합 A, B
  function plain(t){
    var src=String(t==null?'':t), out='', last=0, m;
    LONE.lastIndex=0;
    while((m=LONE.exec(src))){
      var at=m.index+m[1].length;
      if(/\d\s*$/.test(src.slice(0,at))){ continue; }        // 500 g, 3 m — 단위
      if(MF_UNIT && UNIT_CH.indexOf(m[2])>=0){ continue; }   // 단위 이야기 속의 m·g·t·l
      out += esc(src.slice(last,at)) + '<span class="mf">'+mvar(m[2])+'</span>';
      last = at+1; LONE.lastIndex = last;
    }
    out += esc(src.slice(last));
    // 집합 이름은 대문자라도 기울인다 (점 A·원 O 는 그대로 세움)
    return out.replace(SET_UP, function(_, k, sp, names){
      return k + sp + names.replace(/[A-Z]/g, function(c){ return '<span class="mf">' + mvar(c) + '</span>'; });
    });
  }

  // [v85.7] 대분수 "2와 1/3"·"1과1/2" → 교재처럼 자연수 바로 옆에 분수. 화면에서 한글 '와/과'를 뺀다.
  //   앞이 숫자·'/'·'.' 이면(3/4과 5/6 같은 분수 두 개) 건드리지 않는다. 채점·음성은 원래 글자를 쓰므로 영향 없음.
  var MIXED = /(^|[^\d\/.])(\d+)\s*[와과]\s*(?=\d+\s*\/\s*\d+)/g;
  function mfmt(s){
    var src=String(s==null?'':s).replace(MIXED, '$1$2\u2009'), out='', last=0, m;
    MF_UNIT = UNIT_CTX.test(src);
    RUN.lastIndex=0;
    while((m=RUN.exec(src))){
      var raw=m[0], start=m.index;
      var trimmed=raw.replace(/\s+$/,'');
      if(trimmed.length<2 || !OPS.test(trimmed)){ continue; }
      MF_CTX = src.slice(Math.max(0,start-12), start);
      out += plain(src.slice(last,start)) + '<span class="mf">'+expr(trimmed)+'</span>';
      last = start + trimmed.length;
      RUN.lastIndex = last;
    }
    return out + plain(src.slice(last));
  }
  window.mfmt = mfmt;
})();

</script>
<script>
/* 3회차 계단 질문(초4-2) — 원문은 앱 데이터 그대로. 조각: c 조건 · a 묻는 것 · o 눌러도 되는 곳(세지 않음) */
const QS = [
  {q:'□/13 + 7/13의 계산 결과가 진분수일 때, □에 들어갈 수 있는 자연수는 모두 몇 개인지 어떤 순서로 구해?',
   tags:[['c','□/13 + 7/13의 계산 결과'],['c','진분수일 때'],['a','□에 들어갈 수 있는 자연수는 모두 몇 개'],['o','어떤 순서로 구해']]},
  {q:'어떤 수에 3/11을 더해야 할 것을 잘못하여 뺐더니 5/11이 되었어. 바르게 계산한 값은 어떤 순서로 구해?',
   tags:[['c','어떤 수에 3/11을 더해야 할 것을'],['c','잘못하여 뺐더니 5/11이 되었어'],['a','바르게 계산한 값'],['o','어떤 순서로 구해']]},
  {q:'무게가 똑같은 음료수 5병이 든 상자의 무게가 0.89 kg이고, 1병을 꺼낸 뒤 무게가 0.74 kg이야. 빈 상자의 무게는 어떤 순서로 구해?',
   tags:[['c','무게가 똑같은 음료수 5병'],['c','상자의 무게가 0.89 kg'],['c','1병을 꺼낸 뒤 무게가 0.74 kg'],['a','빈 상자의 무게'],['o','어떤 순서로 구해']]},
  {q:'길이가 100 cm인 철사를 겹치지 않게 써서 한 변이 9 cm인 정다각형을 하나 만들었더니 28 cm가 남았어. 만든 정다각형의 이름은 뭐야?',
   tags:[['c','길이가 100 cm인 철사'],['o','겹치지 않게'],['c','한 변이 9 cm인 정다각형'],['c','28 cm가 남았어'],['a','만든 정다각형의 이름']]}
];
const NAME = {c:'조건', a:'묻는 것'};
const HINT_MISS = 3, HINT_IDLE = 25000;   // 엉뚱한 곳 3번 또는 25초 동안 새로 못 찾으면 남은 조각 하나가 반짝
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fm = s => window.mfmt ? mfmt(s) : esc(s);
let qi = 0, st = null, idleT = null;

/* 원문을 조각(조건·묻는 것)과 나머지 낱말로 나눈다. 조각은 원문에 글자 그대로 있어야 한다 */
function split(q, tags){
  const taken = [];
  const found = tags.map(([k, t], i) => {
    let at = -1, from = 0;
    while ((at = q.indexOf(t, from)) >= 0 && taken.some(r => at < r[1] && at + t.length > r[0])) from = at + 1;
    if (at < 0) { console.warn('원문에 없는 조각', t); return null; }
    taken.push([at, at + t.length]); return {i, k, t, at};
  }).filter(Boolean).sort((a, b) => a.at - b.at);
  const segs = []; let p = 0;
  for (const f of found) { if (f.at > p) segs.push({plain: q.slice(p, f.at)}); segs.push(f); p = f.at + f.t.length; }
  if (p < q.length) segs.push({plain: q.slice(p)});
  return segs;
}

function render(){
  const Q = QS[qi];
  st = {need: Q.tags.filter(t => t[0] !== 'o').length, got: new Set(), helped: new Set(), order: [], miss: 0, missWords: [], t0: Date.now(), tEnd: 0, done: false, sinceHit: 0};
  $('#dots').innerHTML = QS.map((_, k) => `<i class="${k < qi ? 'd' : k === qi ? 'c' : ''}"></i>`).join('');
  $('#q').className = 'q';
  $('#q').innerHTML = split(Q.q, Q.tags).map(s => s.plain != null
    ? s.plain.split(/(\s+)/).map(w => /^\s*$/.test(w) ? w : `<span class="w">${fm(w)}</span>`).join('')
    : `<span class="ch ${s.k === 'o' ? 'opt' : ''}" data-i="${s.i}" data-k="${s.k}">${fm(s.t)}${s.k === 'o' ? '' : `<span class="pop">${NAME[s.k]}</span>`}</span>`).join('');
  $('#q').querySelectorAll('.ch').forEach(el => el.onclick = () => hit(el));
  $('#q').querySelectorAll('.w').forEach(el => el.onclick = () => miss(el));
  const mic = $('#mic'); mic.disabled = true; mic.classList.remove('open'); $('#lock').hidden = false;
  $('#guide').classList.remove('done'); $('#guideT').textContent = '조건과 묻는 것을 터치하세요. 그래야 말할 기회가 생겨요.';
  $('#next').hidden = true;
  draw(); armIdle(); recDraw();
}

function draw(){
  const Q = QS[qi], n = k => Q.tags.filter(t => t[0] === k).length, g = k => Q.tags.filter((t, i) => t[0] === k && st.got.has(i)).length;
  const chip = k => `<span class="chip ${g(k) === n(k) ? 'full' : ''}">${NAME[k]} <span class="pips">${Array.from({length: n(k)}, (_, j) => `<i class="${j < g(k) ? 'f' : ''}"></i>`).join('')}</span></span>`;
  $('#count').innerHTML = chip('c') + chip('a');
  $('#prompt').innerHTML = st.done ? '<b>이제 말할 수 있어!</b> 마이크를 눌러 어떤 순서로 풀지 말해 봐' : `남은 것 <b>${st.need - st.got.size}개</b> · 문제를 끝까지 꼼꼼히 읽어 봐`;
}

function hit(el){
  if (st.done) return;
  const i = +el.dataset.i, k = el.dataset.k;
  if (k === 'o') { el.classList.add('on'); return; }       // 눌러도 되는 곳: 칠하기만, 세지 않음
  if (st.got.has(i)) return;
  st.got.add(i); st.order.push(i); el.classList.add('on'); el.classList.remove('glow');
  const pop = el.querySelector('.pop'); if (pop) { pop.classList.add('on'); setTimeout(() => pop.classList.remove('on'), 900); }
  try { navigator.vibrate && navigator.vibrate(15); } catch (e) {}
  st.sinceHit = 0; armIdle();
  if (st.got.size === st.need) unlock();
  draw(); recDraw();
}

function miss(el){
  if (st.done) return;
  st.miss++; st.sinceHit++; st.missWords.push(el.textContent);
  el.classList.remove('no'); void el.offsetWidth; el.classList.add('no');
  setTimeout(() => el.classList.remove('no'), 600);
  if (st.sinceHit >= HINT_MISS) hint();
  recDraw();
}

/* 도움: 아직 못 찾은 조각 하나만 반짝(조건 먼저) — 어른 화면에 「도움 받고 찾음」으로 남는다 */
function hint(){
  if (st.done) return;
  const Q = QS[qi], left = Q.tags.map((t, i) => [t[0], i]).filter(([k, i]) => k !== 'o' && !st.got.has(i) && !st.helped.has(i));
  const pick = left.find(([k]) => k === 'c') || left[0];
  st.sinceHit = 0;
  if (!pick) return;
  st.helped.add(pick[1]);
  const el = $(`#q .ch[data-i="${pick[1]}"]`); el && el.classList.add('glow');
  toast('반짝이는 곳을 잘 읽어 봐');
  armIdle(); recDraw();
}
function armIdle(){ clearTimeout(idleT); if (!st.done) idleT = setTimeout(hint, HINT_IDLE); }

function unlock(){
  st.done = true; st.tEnd = Date.now(); clearTimeout(idleT);
  $('#q').classList.add('over'); $('#q').querySelectorAll('.glow').forEach(e => e.classList.remove('glow'));
  const mic = $('#mic'); mic.disabled = false; $('#lock').hidden = true; mic.classList.add('open');
  $('#guide').classList.add('done'); $('#guideT').textContent = '좋아! 조건과 묻는 것을 다 찾았어.';
  $('#next').hidden = qi >= QS.length - 1;
}

function recDraw(){
  const Q = QS[qi], sec = Math.round(((st.tEnd || Date.now()) - st.t0) / 1000);
  const items = Q.tags.map((t, i) => [t, i]).filter(([t]) => t[0] !== 'o').map(([t, i]) => {
    const s = !st.got.has(i) ? '<span class="x">아직 못 찾음</span>' : st.helped.has(i) ? '<span class="h">반짝임 도움 뒤 찾음</span>' : '<span class="ok">스스로 찾음</span>';
    return `<li>${NAME[t[0]]} 「${fm(t[1])}」 — ${s}</li>`;
  }).join('');
  $('#rec').innerHTML = `<ul>${items}</ul><div class="t">엉뚱한 곳 터치 ${st.miss}번${st.missWords.length ? ' (' + st.missWords.slice(-5).map(esc).join(', ') + ')' : ''}${st.done ? ` · 다 찾는 데 ${sec}초` : ''}</div>`;
}

let tt = null;
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2200); }

$('#mic').onclick = () => toast('시안은 여기까지예요. 실제 앱에서는 여기서 말하기가 시작돼요.');
$('#next').onclick = () => { qi++; render(); scrollTo(0, 0); };
$('#again').onclick = () => render();
render();
</script>
