<title>새 질문 화면 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@500;700;800&display=swap">
<style>
/* 레이아웃: 한 화면 = 질문 하나. 위(진행) · 가운데(친구와 말풍선) · 아래(답하기) · 결과는 아래에서 올라오는 판 */
:root{
  --bg:#f5f3fc; --fg:#1f1d3a; --sub:#6b6890; --card:#ffffff; --line:#e3dff2; --brand:#5b4bd8; --brand-ink:#ffffff;
  --ok:#15803d; --okbg:#e7f7ec; --warn:#b45309; --warnbg:#fff3e2; --track:#e7e4f3; --me:#ece9ff;
  --f-body:"Noto Sans KR","Malgun Gothic",sans-serif; --f-hand:"Gowun Dodum","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17152e; --fg:#f1efff; --sub:#a9a4d6; --card:#221f40; --line:#36325c; --brand:#8b7cff; --brand-ink:#17152e;
  --ok:#4ade80; --okbg:#173a2a; --warn:#fbbf6a; --warnbg:#3b2a15; --track:#2d2a52; --me:#2f2b5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17152e; --fg:#f1efff; --sub:#a9a4d6; --card:#221f40; --line:#36325c; --brand:#8b7cff; --brand-ink:#17152e;
  --ok:#4ade80; --okbg:#173a2a; --warn:#fbbf6a; --warnbg:#3b2a15; --track:#2d2a52; --me:#2f2b5c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body)}
.app{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:14px 18px}
.top{display:flex;align-items:center;gap:12px}
.x{border:0;background:none;color:var(--sub);font-size:26px;line-height:1;cursor:pointer;padding:4px}
.bar{flex:1;height:14px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7c6cff,#b18cff);transition:width .5s cubic-bezier(.3,1.2,.5,1)}
.who{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;font:700 13px var(--f-body);padding:6px 10px;cursor:pointer}
.ask{font-size:21px;font-weight:800;margin:20px 0 6px;letter-spacing:-.02em}
.scene{display:flex;align-items:flex-start;gap:10px;margin-top:8px}
.buddy{position:relative;flex:0 0 132px;height:143px}
.buddy .mv,.buddy .br{position:absolute;inset:0;transform-origin:50% 98%}
.buddy .br{animation:breath 3.6s ease-in-out infinite}
.buddy img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .18s}
.buddy img.on{opacity:1}
.buddy .blink{transition:none}
.buddy .sh{position:absolute;left:24%;right:24%;bottom:-2px;height:9px;border-radius:50%;background:radial-gradient(closest-side,rgba(80,60,160,.25),transparent)}
@keyframes breath{50%{transform:scale(1.012,1.022) translateY(-1.5%)}}
.mv.talk{animation:talk .2s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.02,.975)}}
.mv.pop{animation:pop .38s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(.94,1.04)}55%{transform:scale(1.03,.97)}}
.mv.jump{animation:jump 1s cubic-bezier(.3,1.2,.5,1)}
@keyframes jump{10%{transform:scale(1.05,.92)}28%{transform:translateY(-16%) scale(.96,1.06)}46%{transform:none}62%{transform:translateY(-8%)}80%{transform:none}}
.mv.nod{animation:nod .4s ease-in-out}
@keyframes nod{40%{transform:rotate(3deg) translateY(1.5%)}}
.mv.droop{animation:droop .7s ease-out}
@keyframes droop{40%{transform:translateY(3%) scale(1.02,.96)}}
.buddy.lean .br{transform:rotate(4deg)}
.fx{position:absolute;left:50%;top:40%}
.fx i{position:absolute;width:14px;height:14px;left:-7px;top:-7px;opacity:0;background:linear-gradient(135deg,#fff6c4,#ffc53d);
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:spark 1s ease-out forwards}
@keyframes spark{20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(160deg)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;
  font-size:18px;line-height:1.55;font-weight:700;margin-top:12px;min-height:64px}
.bubble::before{content:"";position:absolute;left:-11px;top:24px;width:16px;height:16px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .cur{display:inline-block;width:2px;height:1.1em;background:var(--brand);vertical-align:-3px;animation:cur .8s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.fig{margin:12px 0 0 142px;max-width:300px}
.fig svg{width:100%;height:auto}
@media (max-width:480px){.fig{margin:12px auto 0;max-width:260px}.buddy{flex-basis:112px;height:121px}}
.me{align-self:flex-end;max-width:85%;margin-top:14px;background:var(--me);border-radius:18px 18px 6px 18px;padding:11px 14px;font-size:16px;line-height:1.55;font-weight:600;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.me small{display:block;font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:2px}
#mine{display:flex;flex-direction:column}
.grow{flex:1}
.answer{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.inrow{display:flex;gap:10px;align-items:stretch}
.mic{flex:0 0 58px;height:58px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 0 rgba(60,40,140,.25)}
.mic:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(60,40,140,.25)}
textarea{flex:1;min-width:0;resize:none;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--fg);font:500 16px/1.5 var(--f-body);padding:10px 12px;min-height:58px}
textarea:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #b18cff;outline-offset:2px}
.demo{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
.demo button{border:1px dashed var(--line);background:none;color:var(--sub);border-radius:99px;padding:5px 10px;font:600 12.5px var(--f-body);cursor:pointer}
.go{border:0;border-radius:16px;padding:15px;font:800 17px var(--f-body);background:var(--brand);color:var(--brand-ink);cursor:pointer;box-shadow:0 5px 0 rgba(60,40,140,.25)}
.go:disabled{background:var(--track);color:var(--sub);box-shadow:none;cursor:default}
.sheet{position:fixed;left:0;right:0;bottom:0;transform:translateY(105%);transition:transform .35s cubic-bezier(.3,1.1,.5,1);
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.show{transform:none}
.sheet .in{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.sheet.ok{background:var(--okbg)} .sheet.hint{background:var(--warnbg)}
.sheet h3{margin:0;font-size:19px}
.sheet.ok h3{color:var(--ok)} .sheet.hint h3{color:var(--warn)}
.sheet p{margin:0;font-size:15.5px;line-height:1.6}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0}
.keys span{font-size:13px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--card)}
.keys .y{color:var(--ok)} .keys .n{color:var(--warn)}
.sheet .go{margin-top:6px}
.sheet.ok .go{background:var(--ok);color:#fff}
.sheet.hint .go{background:var(--warn);color:#fff}
.done{text-align:center;margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.done h2{margin:0;font-size:24px}.done p{margin:0;color:var(--sub)}
.note{font-size:12px;color:var(--sub);text-align:center;margin-top:10px}
@media (prefers-reduced-motion:reduce){.buddy .br,.mv,.fx i,.bubble .cur{animation:none!important}}
</style>
<div class="app" id="app">
  <div class="top">
    <button class="x" id="x" aria-label="그만하기">✕</button>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <select class="who" id="who" aria-label="친구 바꾸기"></select>
  </div>
  <div id="stage" style="display:flex;flex-direction:column;flex:1"></div>
  <p class="note">시안 — 채점은 핵심 낱말로 흉내 냅니다(실제 앱은 AI 채점). 말하기는 앱에서, 여기서는 글로 써 보세요.</p>
</div>
<div class="sheet" id="sheet" role="status" aria-live="polite"><div class="in" id="sheetIn"></div></div>
<script>
(function(){
  const GRID = `<svg viewBox="0 0 190 196" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic,sans-serif"><line x1="14" y1="14" x2="14" y2="170" stroke="#d6dbe6" stroke-width="1"/><line x1="40" y1="14" x2="40" y2="170" stroke="#d6dbe6" stroke-width="1"/><line x1="66" y1="14" x2="66" y2="170" stroke="#d6dbe6" stroke-width="1"/><line x1="92" y1="14" x2="92" y2="170" stroke="#d6dbe6" stroke-width="1"/><line x1="118" y1="14" x2="118" y2="170" stroke="#d6dbe6" stroke-width="1"/><line x1="144" y1="14" x2="144" y2="170" stroke="#d6dbe6" stroke-width="1"/><line x1="170" y1="14" x2="170" y2="170" stroke="#d6dbe6" stroke-width="1"/><line x1="14" y1="14" x2="170" y2="14" stroke="#d6dbe6" stroke-width="1"/><line x1="14" y1="40" x2="170" y2="40" stroke="#d6dbe6" stroke-width="1"/><line x1="14" y1="66" x2="170" y2="66" stroke="#d6dbe6" stroke-width="1"/><line x1="14" y1="92" x2="170" y2="92" stroke="#d6dbe6" stroke-width="1"/><line x1="14" y1="118" x2="170" y2="118" stroke="#d6dbe6" stroke-width="1"/><line x1="14" y1="144" x2="170" y2="144" stroke="#d6dbe6" stroke-width="1"/><line x1="14" y1="170" x2="170" y2="170" stroke="#d6dbe6" stroke-width="1"/><line x1="40" y1="144" x2="144" y2="144" stroke="#2f5fb3" stroke-width="2.5"/><text x="40.0" y="162.0" font-size="13" fill="#374151" text-anchor="middle">ㄴ</text><text x="144.0" y="162.0" font-size="13" fill="#374151" text-anchor="middle">ㄷ</text><circle cx="92" cy="40" r="4" fill="#b45309"/><text x="104.0" y="34.0" font-size="13" fill="#b45309" text-anchor="middle">①</text><circle cx="118" cy="66" r="4" fill="#b45309"/><text x="130.0" y="60.0" font-size="13" fill="#b45309" text-anchor="middle">②</text><circle cx="40" cy="66" r="4" fill="#b45309"/><text x="52.0" y="60.0" font-size="13" fill="#b45309" text-anchor="middle">③</text></svg>`;
  const CH = {pola:{n:'폴라',c:'#f2737a',hi:'좋아, 같이 출발!'}, exi:{n:'엑시',c:'#c58ad8',hi:'천천히, 하나씩.'}, aresi:{n:'아레시',c:'#4fb3e6',hi:'신호를 보내 줘!'}, iris:{n:'이리스',c:'#6f63e0',hi:'준비됐지?'}, lemma:{n:'렘마',c:'#5fc9a4',hi:'천천히 해도 돼.'}};
  const BLINK = ['question','listening','thinking','hint','solving','retry'];
  // 초4-2 「2. 삼각형 · 02 이등변삼각형의 성질」 1회차 (앱에 들어간 질문 그대로)
  const QS = [
    {q:'이등변삼각형의 각에는 어떤 성질이 있어?', ans:'길이가 같은 두 변에 있는 두 각의 크기가 같아요.',
     keys:[['길이가 같은 두 변', /두\s*변|같은\s*변/], ['두 각의 크기가 같다', /두\s*각|각.*같|같은\s*각/]],
     hint:'길이가 같은 두 변을 먼저 찾아봐. 그 두 변에 붙어 있는 각은 어때?', good:'길이가 같은 두 변에 있는 두 각의 크기가 같아요.', half:'두 변의 길이가 같아요.'},
    {q:'이등변삼각형 모양의 종이를 반으로 접으면, 두 각이 같다는 걸 어떻게 알 수 있어?', ans:'반으로 접으면 두 각이 꼭 겹쳐요. 겹치니까 크기가 같아요.',
     keys:[['반으로 접으면 두 각이 겹친다', /겹/], ['겹치니까 크기가 같다', /같/]],
     hint:'반으로 접었을 때 두 각은 어떻게 돼? 그걸 보고 무엇을 알 수 있어?', good:'접으면 두 각이 딱 겹쳐서 크기가 같다는 걸 알아요.', half:'반으로 접어 봐요.'},
    {q:'모눈종이에 선분 ㄴㄷ이 있어. 점 ①, ②, ③ 중 어느 점과 이어야 이등변삼각형이 될까? 왜?', fig:true, ans:'①이에요. ①은 선분 ㄴㄷ의 한가운데 바로 위에 있어서, ①에서 ㄴ까지와 ①에서 ㄷ까지의 길이가 같아요.',
     keys:[['①', /①|1번|일번|첫\s*번째/], ['ㄴ과 ㄷ까지 길이가 같다', /길이.*같|같은\s*길이|한가운데|가운데/]],
     hint:'①, ②, ③에서 ㄴ까지와 ㄷ까지의 길이를 비교해 봐. 어느 점이 두 길이가 같아?', good:'①번이요. 가운데 위에 있어서 ㄴ까지랑 ㄷ까지 길이가 같아요.', half:'①번이요.'},
  ];
  let cur = 'pola';
  try { cur = localStorage.getItem('dd-proto-who') || 'pola'; } catch (e) {}
  const who = document.getElementById('who');
  who.innerHTML = Object.keys(CH).map(k => '<option value="' + k + '"' + (k === cur ? ' selected' : '') + '>' + CH[k].n + '</option>').join('');
  who.onchange = () => { cur = who.value; try { localStorage.setItem('dd-proto-who', cur); } catch (e) {} start(qi); };
  const img = (st) => 'characters/img/' + cur + '/' + st + '.webp';
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  let qi = 0, tries = 0, buddy = null, blinkT = 0, typeT = 0;

  function makeBuddy() {
    const b = document.createElement('div'); b.className = 'buddy';
    b.innerHTML = '<div class="sh"></div><div class="mv"><div class="br"><img class="a on" alt=""><img class="b" alt=""><img class="blink" alt=""></div></div><div class="fx"></div>';
    b._st = '';
    clearTimeout(blinkT);
    const loop = () => { blinkT = setTimeout(() => { doBlink(b); if (Math.random() < .2) setTimeout(() => doBlink(b), 250); loop(); }, 2500 + Math.random() * 3500); };
    loop();
    return b;
  }
  function doBlink(b) {
    if (reduced() || !BLINK.includes(b._st)) return;
    const k = b.querySelector('.blink'); if (!k.complete || !k.naturalWidth) return;
    k.classList.add('on'); setTimeout(() => k.classList.remove('on'), 130);
  }
  function face(b, st) {
    if (b._st === st) return; b._st = st;
    const [x, y] = b.querySelectorAll('img.a, img.b'); const on = x.classList.contains('on') ? x : y, nx = on === x ? y : x;
    nx.onload = () => { nx.classList.add('on'); on.classList.remove('on'); }; nx.src = img(st);
    const k = b.querySelector('.blink'); if (BLINK.includes(st)) k.src = img(st + '-blink'); else k.removeAttribute('src');
  }
  function move(b, m) { if (reduced()) return; const v = b.querySelector('.mv'); v.classList.remove('pop', 'jump', 'nod', 'droop', 'talk'); void v.offsetWidth; if (m) v.classList.add(m); }
  function sparkle(b) {
    if (reduced()) return; const fx = b.querySelector('.fx'); fx.innerHTML = '';
    for (let i = 0; i < 9; i++) { const s = document.createElement('i'); const a = Math.PI * 2 * i / 9; s.style.setProperty('--dx', Math.round(Math.cos(a) * 90) + 'px'); s.style.setProperty('--dy', Math.round(Math.sin(a) * 70 - 20) + 'px'); fx.appendChild(s); }
  }
  // 말풍선에 한 글자씩 — 그동안 친구가 말하듯 움직인다(입 그림이 생기면 입도 벙긋)
  function say(el, text, done) {
    clearInterval(typeT); el.innerHTML = '';
    const span = document.createElement('span'), c = document.createElement('i'); c.className = 'cur';
    el.append(span, c);
    if (reduced()) { span.textContent = text; c.remove(); done && done(); return; }
    move(buddy, 'talk'); let i = 0;
    typeT = setInterval(() => { span.textContent = text.slice(0, ++i); if (i >= text.length) { clearInterval(typeT); c.remove(); move(buddy, null); done && done(); } }, 38);
  }
  function hideSheet() { document.getElementById('sheet').className = 'sheet'; }
  function start(i) {
    hideSheet(); qi = i; tries = 0;
    document.getElementById('bar').style.width = (i / QS.length * 100) + '%';
    const st = document.getElementById('stage');
    if (i >= QS.length) { return finish(); }
    const Q = QS[i];
    st.innerHTML = '<div class="ask">말로 설명해 봐</div><div class="scene"></div>' + (Q.fig ? '<div class="fig">' + GRID + '</div>' : '') +
      '<div id="mine"></div><div class="grow"></div>' +
      '<div class="answer"><div class="inrow"><button class="mic" id="mic" aria-label="말하기(앱에서)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>' +
      '<textarea id="txt" rows="2" placeholder="여기에 답을 써 봐"></textarea></div>' +
      '<div class="demo"><span>예시 답 넣기:</span><button data-k="good">잘 말한 답</button><button data-k="half">덜 말한 답</button></div>' +
      '<button class="go" id="go" disabled>확인</button></div>';
    const sc = st.querySelector('.scene'); buddy = makeBuddy(); sc.appendChild(buddy);
    const bub = document.createElement('div'); bub.className = 'bubble'; sc.appendChild(bub);
    face(buddy, 'question'); move(buddy, 'pop');
    say(bub, Q.q);
    const txt = document.getElementById('txt'), go = document.getElementById('go');
    let t0 = 0;
    txt.oninput = () => { go.disabled = txt.value.trim().length < 2; face(buddy, 'listening'); buddy.classList.add('lean'); const n = Date.now(); if (n - t0 > 1200) { t0 = n; move(buddy, 'nod'); } };
    st.querySelectorAll('.demo button').forEach(b => b.onclick = () => { txt.value = Q[b.dataset.k]; txt.oninput(); });
    document.getElementById('mic').onclick = () => { txt.focus(); txt.placeholder = '시안에서는 글로 써 주세요 (앱에서는 마이크로 말해요)'; };
    go.onclick = () => check(txt.value.trim());
  }
  function check(a) {
    const Q = QS[qi], mine = document.getElementById('mine');
    mine.innerHTML = '<div class="me"><small>내 답</small>' + a.replace(/[<>&]/g, '') + '</div>';
    document.getElementById('txt').value = ''; document.getElementById('go').disabled = true;
    buddy.classList.remove('lean'); face(buddy, 'thinking'); move(buddy, 'pop');
    const bub = buddy.parentNode.querySelector('.bubble'); say(bub, '음… 네 설명을 살펴볼게.');
    setTimeout(() => {
      const hit = Q.keys.map(k => k[1].test(a)); tries++;
      const sh = document.getElementById('sheet'), si = document.getElementById('sheetIn');
      const keysHtml = '<div class="keys">' + Q.keys.map((k, j) => '<span class="' + (hit[j] ? 'y' : 'n') + '">' + (hit[j] ? '✓ ' : '· ') + k[0] + '</span>').join('') + '</div>';
      // 다시 말할 때는 빠진 핵심을 글로 보여 주지 않는다(답을 미리 알려 주게 됨) — 짚은 것만 ✓, 나머지는 개수만
      const missN = hit.filter(h => !h).length;
      const keysHint = '<div class="keys">' + Q.keys.filter((k, j) => hit[j]).map(k => '<span class="y">✓ ' + k[0] + '</span>').join('') + '<span class="n">? 핵심 ' + missN + '개 더</span></div>';
      if (hit.every(Boolean)) {
        face(buddy, 'praise'); move(buddy, 'jump'); sparkle(buddy); say(bub, '와, 정확해!');
        si.innerHTML = '<h3>정확해요!</h3>' + keysHtml + '<p><b>모범 답</b> · ' + Q.ans + '</p><button class="go" id="next">계속</button>';
        sh.className = 'sheet show ok';
        document.getElementById('next').onclick = () => start(qi + 1);
      } else if (tries < 2) {
        face(buddy, 'retry'); move(buddy, 'droop');
        setTimeout(() => { face(buddy, 'hint'); move(buddy, 'pop'); say(bub, Q.hint); }, 1300);
        si.innerHTML = '<h3>' + (missN > 1 ? '핵심을 더 떠올려 봐!' : '한 가지만 더!') + '</h3>' + keysHint + '<p>' + CH[cur].n + '가 단서를 줬어요. 말풍선을 보고 다시 말해 봐요.</p><button class="go" id="again">다시 말하기</button>';
        sh.className = 'sheet show hint';
        document.getElementById('again').onclick = () => { hideSheet(); face(buddy, 'question'); document.getElementById('txt').focus(); };
      } else {
        face(buddy, 'hint'); move(buddy, 'pop'); say(bub, '괜찮아, 같이 정리해 보자.');
        si.innerHTML = '<h3>이렇게 말하면 돼요</h3>' + keysHtml + '<p><b>모범 답</b> · ' + Q.ans + '</p><p style="font-size:13px;color:var(--sub)">이 질문은 내일 다시 나와요.</p><button class="go" id="next">계속</button>';
        sh.className = 'sheet show hint';
        document.getElementById('next').onclick = () => start(qi + 1);
      }
    }, 1100);
  }
  function finish() {
    document.getElementById('bar').style.width = '100%';
    const st = document.getElementById('stage');
    st.innerHTML = '<div class="done"><div class="scene" style="justify-content:center"></div><h2>1회차 질문 끝!</h2><p>이제 문제 풀기로 확인해요.</p><button class="go" id="re" style="width:100%">처음부터 다시 보기</button></div>';
    buddy = makeBuddy(); st.querySelector('.scene').appendChild(buddy); face(buddy, 'praise'); move(buddy, 'jump'); sparkle(buddy);
    document.getElementById('re').onclick = () => start(0);
  }
  document.getElementById('x').onclick = () => start(0);
  start(0);
})();
</script>
